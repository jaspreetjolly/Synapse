 the image-based ticks.</em></p>\n<p>Related: <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a> · <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a></p>\n"},"40-resources/summary-intune-vs-manageengine":{"id":"40-resources/summary-intune-vs-manageengine","title":"Summary — Intune vs ManageEngine: endpoint data protection argument","path":"40-Resources/summary-intune-vs-manageengine.md","type":"summary","tags":["intune","competitive","endpoint","security"],"html":"<h1>Summary — Intune vs ManageEngine: endpoint data protection argument</h1>\n<p><strong>Source:</strong> Jaspreet&#39;s own technical comparison deck, &quot;Endpoint data protection for Microsoft 365 requires Intune at both layers: MDM and MAM&quot;, 15 slides with detailed notes, 2026-09. Every claim in it is sourced to Microsoft Learn, Apple Support or ManageEngine documentation. See <a href=\"#note/raw/2026-10-19-windows-11-enterprise-folderref\">raw/2026-10-19-windows-11-enterprise-folder.ref.md</a>.</p>\n<h2>Key takeaways</h2>\n<ol>\n<li><p><strong>Enrolment is not enforcement.</strong> In M365, <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a> reads a compliance state on the Entra ID device object. Only Intune, or an onboarded compliance partner (Jamf, Ivanti, SOTI, Omnissa, Scalefusion and others), can write it. <a href=\"#note/10-notes/entities/manageengine\">manageengine</a> is <strong>not</strong> onboarded, and its own documentation limits third-party MDM CA to enrolled Windows 10+ devices. So it gives <strong>no device-based CA on Android or iOS</strong>. See <a href=\"#note/10-notes/concepts/device-compliance-signal-flow\">device-compliance-signal-flow</a>.</p>\n</li>\n<li><p><strong>On BYOD, only the app layer enforces.</strong> The iOS enrolment type caps MDM restrictions, and Android Work Profile separates apps, not identities. Intune MAM provides:</p>\n<ul>\n<li>conditional launch</li>\n<li>app PIN</li>\n<li>selective wipe</li>\n<li><strong>multi-identity</strong></li>\n<li>granular DLP</li>\n<li>working with no enrolment at all</li>\n</ul>\n<p>See <a href=\"#note/10-notes/concepts/mdm-vs-mam\">mdm-vs-mam</a>.</p>\n</li>\n<li><p><strong>Commercial:</strong> Intune is already paid for in M365 E3, E5 and Business Premium. Since July 2026, E3 even includes Plan 2, Remote Help and Advanced Analytics. So a third-party UEM is a net-new cost plus a second console. Third-party &quot;O365 DLP&quot; modules (Scalefusion, 42Gears) still write <strong>Intune</strong> app protection policies through Graph and still need the Intune licence.</p>\n</li>\n</ol>\n<h2>Other points</h2>\n<ul>\n<li><p><strong>Defender containment loop:</strong></p>\n<ul>\n<li>Defender flags the device as high-risk.</li>\n<li>Intune marks it non-compliant.</li>\n<li>Entra updates the device object.</li>\n<li>CA blocks access.</li>\n</ul>\n<p>This needs Intune-managed devices on Android and iOS, and Entra-joined or hybrid-joined devices on Windows. Without Intune there is no automatic consequence.</p>\n</li>\n<li><p><strong>Windows-only stack:</strong> security baselines, ASR, BitLocker escrow, Windows LAPS, EPM, Autopilot and Autopatch.</p>\n</li>\n<li><p><strong>Autopatch</strong> needs Windows Enterprise E3, E5 or <strong>F3</strong>.</p>\n</li>\n<li><p><strong>Licensing on slides 10 and 14 is out of date.</strong> The deck says Tunnel, Cloud PKI and EPM are Suite add-ons &quot;not in E3 or E5&quot;. From July 2026, <strong>Tunnel is in E3</strong> and <strong>Cloud PKI and EPM are in E5</strong> (<a href=\"#note/10-notes/entities/microsoft-intune-suite\">microsoft-intune-suite</a>). <strong>Update the deck:</strong> this strengthens the argument, because the BYOD per-app VPN is now already licensed.</p>\n</li>\n<li><p><strong>Objections handled:</strong></p>\n<ul>\n<li>&quot;enrol BYOD in ManageEngine&quot;</li>\n<li>&quot;use IP-based CA&quot; (IP is a location signal, not a trust signal)</li>\n<li>&quot;their console blocks copy-paste&quot; (that is Intune APP through Graph)</li>\n</ul>\n</li>\n<li><p><strong>Recommendation:</strong> consolidate on Intune, or run co-existence for specialist estates (rugged devices, Chrome OS, tvOS, Endpoint Central patching). Next step: an Intune BYOD pilot.</p>\n</li>\n</ul>\n<h2>Contradictions with the vault</h2>\n<blockquote>\n<p>[!note] <strong>Resolved in the map&#39;s favour:</strong> Tunnel for MAM and Intune Plan 2 are in E3 from July 2026 (<a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map#claim-003</a>, <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map#claim-004</a>).</p>\n</blockquote>\n<blockquote>\n<p>[!note] <strong>Confirmed:</strong> Autopatch is available with F3, per Microsoft Learn (<a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch#claim-002</a>). This deck was right.</p>\n</blockquote>\n<p>Related: <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> · <a href=\"#note/_meta/mocs/moc-windows-and-endpoint-management\">moc-windows-and-endpoint-management</a></p>\n"},"40-resources/summary-m365-e3-feature-map":{"id":"40-resources/summary-m365-e3-feature-map","title":"Summary — Microsoft 365 E3 feature map","path":"40-Resources/summary-m365-e3-feature-map.md","type":"summary","tags":["licensing","modern-work","security"],"html":"<h1>Summary — Microsoft 365 E3 feature map</h1>\n<p><strong>Source:</strong> Jaspreet&#39;s own Markmap mind map, &quot;M365 E3 Overview&quot; (raw/2026-10-19-m365-e3-feature-mindmap.html). It is a personal reference, not official Microsoft documentation.</p>\n<h2>Key takeaways</h2>\n<ol>\n<li><strong>E3 is three layers:</strong> <a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a> (productivity and baseline compliance), <a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a> (identity and endpoint), plus ME3-only extras (Windows 11 Enterprise, <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> P1, Universal Print, Loop). See <a href=\"#note/10-notes/concepts/m365-licensing-stack\">m365-licensing-stack</a>.</li>\n<li><strong>Security is spread across all three layers:</strong> email hygiene and compliance in O365 E3, identity controls in <a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1, device controls in <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>, and endpoint protection in MDE P1.</li>\n<li><strong>Intune Plan 2 is now in E3:</strong> since July 2026, E3 includes Intune Plan 2 (Tunnel for MAM, FOTA, specialty devices), Remote Help and Advanced Analytics, which confirms this map (claims 003–004). MDO Plan 1 in O365 E3 is also confirmed from July 2026 (claim-005).</li>\n</ol>\n<h2>Office 365 E3</h2>\n<table>\n<thead>\n<tr>\n<th>Area</th>\n<th>What the map lists</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Apps</td>\n<td>Office apps (desktop client)</td>\n</tr>\n<tr>\n<td>Exchange Online</td>\n<td>100 GB mailbox, 1.5 TB archive</td>\n</tr>\n<tr>\n<td>OneDrive</td>\n<td>5 TB maximum; <strong>1 TB default</strong> per user, which an admin raises</td>\n</tr>\n<tr>\n<td>SharePoint Online</td>\n<td>1 TB tenant + 10 GB per user, pooled</td>\n</tr>\n<tr>\n<td>Teams</td>\n<td>Meetings, chats, webinars, town halls</td>\n</tr>\n<tr>\n<td>Viva (seeded)</td>\n<td>Engage, Connections, Learning, Personal Insights</td>\n</tr>\n<tr>\n<td>Other apps</td>\n<td>Stream, Planner, To Do, Forms, Lists, Clipchamp, Power Apps and Power Automate (standard connectors)</td>\n</tr>\n<tr>\n<td>Security and compliance</td>\n<td>DLP (Exchange, SharePoint, OneDrive), anti-malware, anti-spam, eDiscovery and Content Search, retention policies, Litigation Hold, MDO Plan 1 → <a href=\"#note/40-resources/summary-mdo-plan1-feature-map\">summary-mdo-plan1-feature-map</a></td>\n</tr>\n</tbody></table>\n<h2>EMS E3</h2>\n<table>\n<thead>\n<tr>\n<th>Area</th>\n<th>What the map lists</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1</td>\n<td><a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>, MFA, SSO, hybrid SSPR, group-based access, App Proxy, password protection (incl. AD DS), Cloud App Discovery</td>\n</tr>\n<tr>\n<td><a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a></td>\n<td>MDM, MAM, config profiles, app protection, patching, compliance policies, remote actions, Tunnel for MAM, specialty devices (AR/VR), FOTA, Remote Help, Advanced Endpoint Analytics. See <a href=\"#note/10-notes/concepts/mdm-vs-mam\">mdm-vs-mam</a>.</td>\n</tr>\n<tr>\n<td>Information protection</td>\n<td>MIP / AIP Plan 1: <strong>manual</strong> sensitivity labelling. Auto-labelling needs AIP Plan 2 (E5); see <a href=\"#note/10-notes/entities/microsoft-purview\">microsoft-purview</a>.</td>\n</tr>\n<tr>\n<td>Rights</td>\n<td>Windows Server CAL rights</td>\n</tr>\n</tbody></table>\n<h2>ME3 additional features</h2>\n<ul>\n<li><a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a>: now ingested, see <a href=\"#note/40-resources/summary-windows-11-enterprise-feature-map\">summary-windows-11-enterprise-feature-map</a>.</li>\n<li><a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> P1: attack surface reduction, web protection and filtering, device control (USB), centralised AV management.</li>\n<li>Universal Print (100 jobs per month).</li>\n<li>Microsoft Loop (full workspaces).</li>\n</ul>\n<h2>Open questions</h2>\n<blockquote>\n<p>[!note] <strong>Resolved:</strong> Tunnel for MAM (claim-003) and Intune Plan 2 (claim-004) are in E3 from July 2026, Intune Plan 2 being the licence that carries Tunnel (<a href=\"#note/10-notes/entities/microsoft-intune-suite\">microsoft-intune-suite</a>). The Intune-vs-ManageEngine deck was written before that change.</p>\n</blockquote>\n<blockquote>\n<p>[!note] <strong>OneDrive settled:</strong> <strong>1 TB default, 5 TB maximum</strong>, confirmed by Jaspreet on 2026-10-19 (claim-002).\n[!note] <strong>Storage settled:</strong> OneDrive in M365 E3 is <strong>5 TB</strong>, confirmed by Jaspreet on 2026-10-19 (claim-002). The Copilot deck&#39;s &quot;Unlimited&quot; is out of date (<a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck#claim-002</a>).</p>\n</blockquote>\n<blockquote>\n<p>[!note] <strong>Resolved:</strong> Defender for Office 365 <strong>Plan 1</strong> is in O365 E3 and M365 E3 from <strong>1 July 2026</strong>, per the Microsoft Learn service description (claim-005). E3 gets Plan 1 capabilities only.</p>\n</blockquote>\n<blockquote>\n<p>[!note] <strong>Resolved:</strong> Intune Plan 1 &amp; 2, Remote Help and Advanced Endpoint Analytics are in E3 from July 2026 (claim-004).</p>\n</blockquote>\n<p>Related: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a> · <a href=\"#note/10-notes/concepts/email-and-collaboration-protection-layers\">email-and-collaboration-protection-layers</a> · <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a> · lower tier: <a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a></p>\n"},"40-resources/summary-mdo-plan1-feature-map":{"id":"40-resources/summary-mdo-plan1-feature-map","title":"Summary — Defender for Office 365 Plan 1 feature map","path":"40-Resources/summary-mdo-plan1-feature-map.md","type":"summary","tags":["security","licensing","email-security"],"html":"<h1>Summary — Defender for Office 365 Plan 1 feature map</h1>\n<p><strong>Source:</strong> Jaspreet&#39;s own Markmap mind map, &quot;Microsoft Defender for Office Plan1&quot; (raw/2026-10-19-mdo-plan1-feature-mindmap.html). It is linked from <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>.</p>\n<h2>Key takeaways</h2>\n<ol>\n<li><strong>MDO P1 extends protection beyond email</strong> to Teams, SharePoint and OneDrive: Safe Attachments, Safe Links and ZAP all cover Teams.</li>\n<li><strong>P1 is protection plus basic investigation:</strong> real-time detections and reports, without the advanced hunting or automation of a higher plan. This is my inference; the source does not list P2.</li>\n<li><strong>Admin tooling targets a secure baseline:</strong> Standard/Strict preset policies, Configuration Analyzer and the Tenant Allow/Block List.</li>\n</ol>\n<h2>Capabilities</h2>\n<table>\n<thead>\n<tr>\n<th>Area</th>\n<th>Capabilities</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Threat protection</td>\n<td>Safe Attachments (incl. Teams); Safe Links (incl. Teams); anti-phishing (user and domain impersonation); Safe Attachments for SharePoint, OneDrive and Teams</td>\n</tr>\n<tr>\n<td>Mail hygiene</td>\n<td>Zero-hour Auto Purge (ZAP, incl. Teams); advanced protection for internal mail</td>\n</tr>\n<tr>\n<td>Threat investigation</td>\n<td>Real-time detections; real-time reports</td>\n</tr>\n<tr>\n<td>Policy and admin</td>\n<td>Preset security policies (Standard / Strict); policy tuning; Configuration Analyzer; Tenant Allow/Block List</td>\n</tr>\n</tbody></table>\n<blockquote>\n<p>[!note] <strong>Licensing:</strong> Plan 1 is included in O365 E3 and M365 E3 since 1 July 2026 (<a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map#claim-005</a>).</p>\n</blockquote>\n<p>Entity: <a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a> · Concept: <a href=\"#note/10-notes/concepts/email-and-collaboration-protection-layers\">email-and-collaboration-protection-layers</a> · MOC: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a></p>\n"},"40-resources/summary-o365-e1-plus-feature-map":{"id":"40-resources/summary-o365-e1-plus-feature-map","title":"Summary — Office 365 E1 Plus feature map","path":"40-Resources/summary-o365-e1-plus-feature-map.md","type":"summary","tags":["licensing","modern-work","security"],"html":"<h1>Summary — Office 365 E1 Plus feature map</h1>\n<p><strong>Source:</strong> Jaspreet&#39;s own Markmap mind map, &quot;Office 365 E1 Plus&quot; (raw/2026-10-19-o365-e1-plus-feature-mindmap.html). It is a personal reference, not official Microsoft documentation.</p>\n<h2>Key takeaways</h2>\n<ol>\n<li><strong>E1 Plus = web-only Office 365 E1 + Entra ID P1 + Intune P1 + Office 365 DLP.</strong> It is a lightweight Zero Trust starter. See <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a>.</li>\n<li><strong>It carries the same identity stack as E3:</strong> the Entra ID P1 feature list is the same as in <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>.</li>\n<li><strong>The gaps against <a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a>:</strong> web apps only, 50 GB mailbox and 50 GB archive, 1 TB OneDrive, manual retention labels only, no eDiscovery, no Defender for Office 365.</li>\n</ol>\n<h2>Productivity and collaboration</h2>\n<table>\n<thead>\n<tr>\n<th>Area</th>\n<th>What the map lists</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Apps</td>\n<td>Office for the web (Word, Excel, PowerPoint, Outlook)</td>\n</tr>\n<tr>\n<td>Exchange Online</td>\n<td>50 GB mailbox + 50 GB archive</td>\n</tr>\n<tr>\n<td>OneDrive</td>\n<td>1 TB</td>\n</tr>\n<tr>\n<td>SharePoint</td>\n<td>1 TB + 10 GB per user</td>\n</tr>\n<tr>\n<td>Other</td>\n<td>Teams, Viva (Engage, Connections, Learning, Insights), Stream, Planner, To Do, Forms, Lists, Power Apps and Power Automate (no premium connectors)</td>\n</tr>\n</tbody></table>\n<h2>Security and compliance</h2>\n<ul>\n<li>DLP for Exchange, SharePoint and OneDrive</li>\n<li>Anti-malware and anti-spam (<a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a>)</li>\n<li>Manual retention labels (Exchange, SharePoint, Teams)</li>\n</ul>\n<h2>Identity and device management</h2>\n<ul>\n<li><strong><a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>:</strong> MDM, MAM, configuration profiles, app protection, patching, compliance policies, remote actions, Endpoint Analytics. The map does not name the plan; the deck says Plan 1.</li>\n<li><strong><a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1:</strong> <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>, MFA, SSO, hybrid SSPR, group-based access, App Proxy, password protection (incl. AD DS), Cloud App Discovery.</li>\n</ul>\n<blockquote>\n<p>[!warning] The map lists <strong>Microsoft Teams</strong> as included. The deck says Teams is a separate purchase for net-new customers (<a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a>). Treat Teams as dependent on the customer&#39;s agreement.</p>\n</blockquote>\n<p>Related: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a> · <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a></p>\n"},"40-resources/summary-passwordless-journey-2022":{"id":"40-resources/summary-passwordless-journey-2022","title":"Summary — Passwordless journey session (Sept 2022)","path":"40-Resources/summary-passwordless-journey-2022.md","type":"summary","tags":["identity","passwordless","partner"],"html":"<h1>Summary — Passwordless journey session (Sept 2022)</h1>\n<p><strong>Source:</strong> a partner-delivered session (Sept 2022, 6 slides) assessing passwordless readiness for an enterprise customer. Customer environment figures are deliberately <strong>not</strong> recorded here. See <a href=\"#note/raw/2026-10-19-windows-11-enterprise-folderref\">raw/2026-10-19-windows-11-enterprise-folder.ref.md</a>.</p>\n<h2>Key takeaways</h2>\n<ol>\n<li><strong>Definition:</strong> remove the password entirely. Users sign in with Microsoft Authenticator, <a href=\"#note/10-notes/entities/windows-hello-for-business\">windows-hello-for-business</a>, a FIDO2 security key, or a one-time code.</li>\n<li><strong>Tasks:</strong> enable WHfB via Intune, ConfigMgr or GPO; enable Authenticator passwordless; turn on mobile biometrics; integrate apps with Entra ID (then Azure AD).</li>\n<li><strong>Blockers seen in practice:</strong><ul>\n<li>thin clients and desktops without biometric hardware are limited to PIN or FIDO2</li>\n<li>laptops with cameras can go fully biometric</li>\n<li>most vendor apps still federated via ADFS, with some needing app changes before they can move to Entra ID</li>\n</ul>\n</li>\n</ol>\n<p><strong>Lesson:</strong> app integration with Entra ID, not device capability, is usually the long pole. See <a href=\"#note/10-notes/concepts/passwordless-authentication\">passwordless-authentication</a>.</p>\n<blockquote>\n<p>[!note] Dated (2022) and uses pre-rename terms (Azure AD). Treat it as a pattern, not a current reference.</p>\n</blockquote>\n"},"40-resources/summary-secure-wfh-government-m365-e3":{"id":"40-resources/summary-secure-wfh-government-m365-e3","title":"Summary — Secure WFH for Government with Microsoft 365 E3 (customer briefing)","path":"40-Resources/summary-secure-wfh-government-m365-e3.md","type":"summary","tags":["m365-e3","government","zero-trust","customer-briefing"],"html":"<h1>Summary — Secure WFH for Government with Microsoft 365 E3 (customer briefing)</h1>\n<p><strong>Source:</strong> Jaspreet&#39;s executive briefing for a <strong>national government customer</strong> (Ministers and government IT), 18 slides with notes, dated 2026-04. See <a href=\"#note/raw/2026-10-19-windows-11-enterprise-folderref\">raw/2026-10-19-windows-11-enterprise-folder.ref.md</a>. Customer specifics are kept to a minimum here.</p>\n<h2>Key takeaways</h2>\n<ol>\n<li><p><strong>Pitch:</strong> a single <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> licence per officer delivers secure work-from-home across four pillars. The deck claims &quot;no add-on licences required&quot;:</p>\n<ul>\n<li>identity and threat protection</li>\n<li>devices and apps</li>\n<li>collaboration</li>\n<li>information protection</li>\n</ul>\n</li>\n<li><p><strong>Zero Trust mapping:</strong></p>\n<ul>\n<li><strong>Verify explicitly:</strong> Entra ID P1 and WHfB</li>\n<li><strong>Least privilege:</strong> RBAC, labels, DLP</li>\n<li><strong>Assume breach:</strong> Defender for Office 365 P1, Intune compliance, Purview Audit and eDiscovery</li>\n</ul>\n<p>See <a href=\"#note/10-notes/concepts/zero-trust\">zero-trust</a>.</p>\n</li>\n<li><p><strong>Recommended path:</strong> a 1-day discovery workshop → a 4–6-week pilot (100 users, one ministry) → a Zero Trust baseline (CA, compliance, DLP for national ID, passport and tax data) → a staged rollout with Viva-led adoption.</p>\n</li>\n</ol>\n<h2>Useful reusable content</h2>\n<ul>\n<li><p><strong>Statistics cited:</strong></p>\n<ul>\n<li>99% of identity attacks are blocked by MFA</li>\n<li>22% of breaches start with stolen or weak credentials</li>\n<li>$4.75M average public-sector breach cost</li>\n<li>73% of remote workers use unmanaged devices</li>\n<li>78% report WFH security incidents</li>\n</ul>\n<p>Sources named: Microsoft Digital Defense Report, IBM Cost of a Data Breach 2024, Verizon DBIR 2024.</p>\n</li>\n<li><p><strong>E3 contents as pitched:</strong> apps, Teams, SharePoint, OneDrive, Viva (seeded), Entra ID P1, Intune, Defender for Office 365 P1, Windows 11 Enterprise, Purview (labels, DLP, retention, eDiscovery Core, Audit Standard with a 180-day log), Compliance Manager.</p>\n</li>\n</ul>\n<h2>Contradictions with the vault</h2>\n<blockquote>\n<p>[!warning] <strong>Qualify slide 16.</strong> E3 includes Identity Protection only as <strong>limited visibility</strong>, and &quot;just-in-time&quot; only as <strong>time-limited access (Temporary Access Pass)</strong>. Risk-based Conditional Access, automated remediation and <strong>PIM / JIT privileged role activation are E5 (Entra ID P2) only</strong>. See the table on <a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a>.</p>\n</blockquote>\n<blockquote>\n<p>[!note] <strong>OneDrive:</strong> 1 TB is the <strong>default</strong> and 5 TB the <strong>maximum</strong> (confirmed by Jaspreet). Fix slides 3, 8 and 12 to say &quot;1 TB default, up to 5 TB&quot;.</p>\n</blockquote>\n<blockquote>\n<p>[!warning] <strong>Defender Application Guard is deprecated.</strong> Remove it from slide 11 (<a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise#claim-002</a>).</p>\n</blockquote>\n<blockquote>\n<p>[!warning] <strong>Slide 11 mislabels Point-in-time restore.</strong> It is not Windows Backup or File History. PITR restores the <strong>full system state</strong> from local VSS restore points captured in the last <strong>72 hours</strong>, via WinRE. Frequency and retention are configurable on <strong>Enterprise only</strong>. See <a href=\"#note/raw/2026-10-19-ms-learn-point-in-time-restoreref\">raw/2026-10-19-ms-learn-point-in-time-restore.ref.md</a>.</p>\n</blockquote>\n<blockquote>\n<p>[!warning] <strong>Slide 15: labels are not automatic in E3.</strong> E3 (AIP / MIP Plan 1) gives <strong>manual</strong> labelling, and encryption follows once a user applies the label. <strong>Auto-labelling needs AIP Plan 2 / E5</strong> (<a href=\"#note/10-notes/entities/microsoft-purview\">microsoft-purview</a>).</p>\n</blockquote>\n<p>Related: <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> · <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a> · <a href=\"#note/_meta/mocs/moc-windows-and-endpoint-management\">moc-windows-and-endpoint-management</a></p>\n"},"40-resources/summary-windows-11-enterprise-feature-map":{"id":"40-resources/summary-windows-11-enterprise-feature-map","title":"Summary — Windows 11 Enterprise feature map","path":"40-Resources/summary-windows-11-enterprise-feature-map.md","type":"summary","tags":["licensing","endpoint","security"],"html":"<h1>Summary — Windows 11 Enterprise feature map</h1>\n<p><strong>Source:</strong> Jaspreet&#39;s own Markmap mind map, &quot;Windows 11 Enterprise&quot; (raw/2026-10-19-windows-11-enterprise-feature-mindmap.html). It is linked from <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a> as an ME3-only feature, which closes the gap logged at the last ingest.</p>\n<h2>Key takeaways</h2>\n<ol>\n<li><strong>Rights:</strong> run up to <strong>5 Windows environments</strong> per user (local, AVD, Windows 365, on-premises VDI under VDA).</li>\n<li><strong>Servicing is the big differentiator:</strong> <a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch</a>, 36 months of support per yearly feature update, feature-update pinning for up to 3 years, expedited zero-day updates, Hotpatch.</li>\n<li><strong>Security hardening beyond Pro:</strong> Credential Guard, Personal Data Encryption, and advanced BitLocker management with keys escrowed in Entra ID and rotated through Intune.</li>\n</ol>\n<h2>Capabilities</h2>\n<table>\n<thead>\n<tr>\n<th>Area</th>\n<th>What the map lists</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Rights</td>\n<td>Up to 5 Windows environments: local, AVD, Windows 365, on-premises VDI (VDA)</td>\n</tr>\n<tr>\n<td>Update management</td>\n<td><a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch</a> (ring-based patching, update-currency SLO, pause and rollback); 36-month support; feature update pinning (up to 3 years); expedited updates; Windows Hotpatch</td>\n</tr>\n<tr>\n<td>Resilience</td>\n<td>Quick machine recovery; point-in-time restore</td>\n</tr>\n<tr>\n<td>Connectivity</td>\n<td>Always-on VPN (user and device tunnel) — see <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise#claim-001</a></td>\n</tr>\n<tr>\n<td>Printing</td>\n<td>Universal Print</td>\n</tr>\n<tr>\n<td>Security</td>\n<td>Credential Guard; Personal Data Encryption; BitLocker and BitLocker To Go advanced management: enforce cipher, block writes to unencrypted removable media, silent deployment, TPM + PIN pre-boot, PIN complexity, block encryption until keys are escrowed in <a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a>, key rotation via <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>, reporting</td>\n</tr>\n<tr>\n<td>Experience</td>\n<td>Organizational Messages (M365 admin center)</td>\n</tr>\n</tbody></table>\n<blockquote>\n<p>[!note] <strong>Corroborated</strong> by the 2026 Microsoft decks (<a href=\"#note/40-resources/summary-windows-11-enterprise-secure-managed-cloud-ready\">summary-windows-11-enterprise-secure-managed-cloud-ready</a>, <a href=\"#note/40-resources/summary-windows-11-enterprise-l100-deck\">summary-windows-11-enterprise-l100-deck</a>): 5 instances, Autopatch rings, 36-month support, Expedite, Hotpatch, QMR and PITR, BitLocker controls, Credential Guard, PDE, Universal Print, org messages. Pinning: &quot;up to 3 years&quot; here and &quot;1,060 days&quot; there are the same limit.</p>\n</blockquote>\n<p>Entity: <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a> · Suite: <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> · MOC: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a></p>\n"},"40-resources/summary-windows-11-enterprise-l100-deck":{"id":"40-resources/summary-windows-11-enterprise-l100-deck","title":"Summary — Windows 11 Enterprise L100 deck","path":"40-Resources/summary-windows-11-enterprise-l100-deck.md","type":"summary","tags":["windows","licensing","endpoint","copilot"],"html":"<h1>Summary — Windows 11 Enterprise L100 deck</h1>\n<p><strong>Source:</strong> Microsoft customer-ready L100 pitch, &quot;Achieve more with Windows 11 Enterprise&quot;, 24 slides with speaker notes (file dated 2026-01). See <a href=\"#note/raw/2026-10-19-windows-11-enterprise-folderref\">raw/2026-10-19-windows-11-enterprise-folder.ref.md</a>.</p>\n<h2>Key takeaways</h2>\n<ol>\n<li><strong>Three pillars:</strong> an AI-ready productivity platform (<a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a> Chat, <a href=\"#note/10-notes/entities/copilot-plus-pc\">copilot-plus-pc</a>); automated servicing (<a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch</a>, Hotpatch, org messages, remediations); and protection built for <a href=\"#note/10-notes/concepts/zero-trust\">zero-trust</a> (Credential Guard, <a href=\"#note/10-notes/entities/windows-hello-for-business\">windows-hello-for-business</a>, TPM 2.0, Always-On VPN, BitLocker, PDE, <a href=\"#note/10-notes/entities/universal-print\">universal-print</a>).</li>\n<li><strong>Windows Update for Business deployment service is merging into Autopatch.</strong> One dashboard in the Intune admin center, no feature loss, same licensing; &quot;Windows Autopatch comes with your Microsoft 365 E3 subscription&quot;.</li>\n<li><strong>Forrester TEI (2024 composite: 15,000 employees, 30,000 devices):</strong> +15% productive time from performance and +5% from UX; 10–15% fewer help-desk tickets; <strong>60–80% less patching time</strong> (Autopatch); 20% lower printer spend (<a href=\"#note/10-notes/entities/universal-print\">universal-print</a>); 3% better risk profile.</li>\n</ol>\n<h2>Notable details</h2>\n<ul>\n<li><strong>Copilot Chat</strong> with <a href=\"#note/10-notes/concepts/enterprise-data-protection\">enterprise-data-protection</a>: prompts and responses stay in the M365 service boundary and can be <strong>logged, retained and eDiscovered</strong> with Purview. They are not used for training. M365 Copilot is quoted at $30 per user per month.</li>\n<li><strong>Use rights:</strong> per-user subscription with up to 5 managed instances (Windows 11 Enterprise, Windows 365, AVD, VDA for VDI), 36 months of support per annual release, LTSC, and health, readiness and risk reports. See <a href=\"#note/10-notes/concepts/windows-virtualization-rights\">windows-virtualization-rights</a>.</li>\n<li><strong>Support:</strong> Enterprise gets 36 months per feature update; Pro gets 24. See <a href=\"#note/10-notes/concepts/windows-enterprise-servicing\">windows-enterprise-servicing</a>.</li>\n<li><strong>Reports:</strong> Windows release health, the feature-update device-readiness report, the compatibility-risks report, and Microsoft Connected Cache.</li>\n<li><strong>Org messages</strong> are &quot;4x more effective than email&quot;.</li>\n<li><strong>App Assure:</strong> 99.6% of evaluated apps are compatible.</li>\n<li><strong>DirectAccess</strong> is still supported, but the deck recommends moving to Always-On VPN.</li>\n<li><strong>Windows 10 end of support:</strong> 14 Oct 2025. Three paths: Windows 365 (includes ESU), upgrade eligible PCs, or buy new Pro PCs and step up with Autopilot.</li>\n</ul>\n<h2>Internal inconsistencies</h2>\n<blockquote>\n<p>[!warning] The appendix datasheet (slide 24) lists Always-On VPN as &quot;device tunnel&quot; only. Other decks say device <strong>and</strong> user tunnel. See <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise#claim-001</a>.</p>\n</blockquote>\n<p>Related: <a href=\"#note/_meta/mocs/moc-windows-and-endpoint-management\">moc-windows-and-endpoint-management</a></p>\n"},"40-resources/summary-windows-11-enterprise-secure-managed-cloud-ready":{"id":"40-resources/summary-windows-11-enterprise-secure-managed-cloud-ready","title":"Summary — Windows 11 Enterprise: Secure, Managed, Cloud-Ready (+ Pro vs E3 one-pager)","path":"40-Resources/summary-windows-11-enterprise-secure-managed-cloud-ready.md","type":"summary","tags":["windows","licensing","endpoint","security"],"html":"<h1>Summary — Windows 11 Enterprise: Secure, Managed, Cloud-Ready (+ Pro vs E3 one-pager)</h1>\n<p><strong>Sources:</strong> three related decks (see <a href=\"#note/raw/2026-10-19-windows-11-enterprise-folderref\">raw/2026-10-19-windows-11-enterprise-folder.ref.md</a>):</p>\n<ul>\n<li>&quot;Windows 11 Enterprise – Secure, Managed, Cloud-Ready&quot;: 14 slides, 2026-03, the current version. The (2) copy is an earlier draft that cites &quot;Windows11_Enterprise_CXO.pdf&quot; and lacks the Pro vs E3 slide.</li>\n<li>&quot;Differentiating Windows Pro from Windows E3 (Updated)&quot;: 5 slides, 2026-04, reusing the same slides.</li>\n</ul>\n<h2>Key takeaways</h2>\n<ol>\n<li><strong>The Pro vs Enterprise E3 datasheet</strong> is the most complete feature list in the vault. See the table below.</li>\n<li><strong><a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch</a> rings</strong> (example split): Ring 0 Test 1% → Ring 1 First 10% → Ring 2 Fast 20% → Ring 3 Broad 69%. Health gates and telemetry pause the rollout on regressions. Claimed <strong>50–70% IT efficiency gain</strong>.</li>\n<li><strong>Expedite Updates:</strong> the admin picks a security KB in Intune, it bypasses rings and deferrals, and the fleet is compliant &quot;in hours&quot;. <strong>Always-On VPN</strong> uses IKEv2 with device tunnel (pre-logon) and user tunnel, plus RRAS or third-party gateway, NPS/RADIUS and PKI.</li>\n</ol>\n<h2>Pro vs Enterprise E3</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Windows Pro (device licence)</th>\n<th>Windows Enterprise E3 (user licence)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Support per feature update</td>\n<td>24 months</td>\n<td><strong>36 months</strong></td>\n</tr>\n<tr>\n<td>Identity</td>\n<td>WHfB, AD and Entra join</td>\n<td>+ <strong>Credential Guard</strong> (VBS-isolated LSASS, Remote Credential Guard for RDP)</td>\n</tr>\n<tr>\n<td>Encryption</td>\n<td>BitLocker</td>\n<td>+ <strong>advanced BitLocker admin</strong>: cipher, block writes to unencrypted removable media, silent deployment, TPM+PIN, PIN rules, escrow-before-encrypt in Entra ID, key rotation via Intune; + <strong>Personal Data Encryption</strong></td>\n</tr>\n<tr>\n<td>Network</td>\n<td>—</td>\n<td><strong>Always-On VPN</strong> (device + user tunnel), DirectAccess</td>\n</tr>\n<tr>\n<td>Experience</td>\n<td>—</td>\n<td>Windows UX customization (CSP)</td>\n</tr>\n<tr>\n<td>Cloud services</td>\n<td>—</td>\n<td>Subscription activation, <a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch</a>, Expedite, <strong>Hotpatch</strong>, Quick Machine Recovery, Point-in-Time Restore, <a href=\"#note/10-notes/entities/universal-print\">universal-print</a>, endpoint-analytics remediation, Connected Cache, organizational messages</td>\n</tr>\n<tr>\n<td>Use rights</td>\n<td>—</td>\n<td><strong>5 Windows instances per user</strong>; AVD, Windows 365, VDA; Windows Enterprise LTSC; release health; device-readiness and compatibility-risk reports</td>\n</tr>\n</tbody></table>\n<p><strong>Other claims in these decks:</strong></p>\n<ul>\n<li><strong>Feature-update pinning:</strong> up to <strong>3 years (1,060 days)</strong>. Confirmed by Jaspreet; the two figures describe the same limit.</li>\n<li><strong>Value pillars:</strong> Security, Management, Resilience, Flexibility</li>\n</ul>\n<p>Related: <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a> · <a href=\"#note/10-notes/concepts/windows-enterprise-servicing\">windows-enterprise-servicing</a> · <a href=\"#note/_meta/mocs/moc-windows-and-endpoint-management\">moc-windows-and-endpoint-management</a></p>\n"},"40-resources/summary-windows-enterprise-e3-sellers-training-2023":{"id":"40-resources/summary-windows-enterprise-e3-sellers-training-2023","title":"Summary — Windows Enterprise E3 sellers training (March 2023)","path":"40-Resources/summary-windows-enterprise-e3-sellers-training-2023.md","type":"summary","tags":["windows","licensing","sales-enablement"],"html":"<h1>Summary — Windows Enterprise E3 sellers training (March 2023)</h1>\n<p><strong>Source:</strong> Microsoft internal seller training, &quot;Why upgrade from a Windows Pro device license to a Windows Enterprise E3 subscription?&quot;, 6 March 2023, 26 slides, marked <em>Internal use only</em>. See <a href=\"#note/raw/2026-10-19-windows-11-enterprise-folderref\">raw/2026-10-19-windows-11-enterprise-folder.ref.md</a>.</p>\n<blockquote>\n<p>[!warning] <strong>Dated source (2023).</strong> Several points have been overtaken by the 2026 decks. They are flagged below. Use this page for licensing mechanics and objection handling, not for current feature lists.</p>\n</blockquote>\n<h2>Key takeaways (still valid)</h2>\n<ol>\n<li><strong>Licensing mechanics:</strong><ul>\n<li>Windows Enterprise E3 is a <strong>per-user</strong> subscription covering 5 instances (physical and virtual). It upgrades Pro; Home devices are not eligible.</li>\n<li>Downgrade rights are included.</li>\n<li>If the subscription lapses, the device reverts to Pro within 90 days.</li>\n<li>Includes LTSC, but not Enterprise IoT.</li>\n</ul>\n</li>\n<li><strong>Works vs licensed matrix:</strong><ul>\n<li><strong>Need Windows Enterprise to run:</strong> Credential Guard, PDE, UX customization, app-management GPOs, org messages.</li>\n<li><strong>Run on Pro but licensed only via E3/E5:</strong> Autopatch, Universal Print, modern BitLocker admin, subscription activation, readiness reports.</li>\n<li><strong>Not in Enterprise + Software Assurance (per device):</strong> cloud services, modern BitLocker admin, PDE and the 5-instance rights.</li>\n<li><strong>Windows E5</strong> = E3 + Defender for Endpoint P2.</li>\n</ul>\n</li>\n<li><strong>Autopatch value (Forrester projected TEI, March 2023):</strong><ul>\n<li>$1.4M NPV</li>\n<li>45% less effort on monthly OS updates</li>\n<li>95% less on feature updates</li>\n<li>80% less compliance and reporting time</li>\n<li>80% satisfaction</li>\n</ul>\n</li>\n</ol>\n<h2>Objection handling (top FAQ)</h2>\n<ul>\n<li><strong>Enterprise + SA vs E3:</strong> SA is per device, with Enterprise edition, 36 months, MDOP, LTSC and VDA. E3 adds the cloud services and per-user rights.</li>\n<li><strong>F3:</strong> the 2023 deck says M365 F3 excludes LTSC, MDOP and Autopatch. <strong>The Autopatch part is out of date:</strong> Microsoft Learn now lists F3 as eligible (<a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch#claim-002</a>).</li>\n<li><strong>&quot;It works on Pro&quot;:</strong> Pro is the qualifying base OS. Customers are trusted to license what they use.</li>\n</ul>\n<h2>Overtaken by later sources</h2>\n<table>\n<thead>\n<tr>\n<th>2023 statement</th>\n<th>Current position (2026 decks)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Always-On VPN <strong>device tunnel</strong> only</td>\n<td>Device + user tunnel (<a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise#claim-001</a>)</td>\n</tr>\n<tr>\n<td>M365 F3 excludes Autopatch</td>\n<td>F3 is eligible (<a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch#claim-002</a>)</td>\n</tr>\n<tr>\n<td>WUfB deployment service is a separate preview</td>\n<td>Merged into <a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch</a></td>\n</tr>\n<tr>\n<td>Organizational messages in preview</td>\n<td>GA</td>\n</tr>\n<tr>\n<td>Defender Application Guard for Edge is an Enterprise feature</td>\n<td><strong>Deprecated</strong>: do not position it (<a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise#claim-002</a>)</td>\n</tr>\n<tr>\n<td>No Windows 11 LTSC yet</td>\n<td>Windows Enterprise LTSC listed as a use right</td>\n</tr>\n<tr>\n<td>Windows 11 Enterprise 36 months vs Pro 24; Windows 10 Enterprise 30 vs Pro 18</td>\n<td>Still correct for Windows 11</td>\n</tr>\n</tbody></table>\n<p>Related: <a href=\"#note/10-notes/concepts/windows-enterprise-servicing\">windows-enterprise-servicing</a> · <a href=\"#note/_meta/mocs/moc-windows-and-endpoint-management\">moc-windows-and-endpoint-management</a></p>\n"},"40-resources/summary-windows-enterprise-value-prop-intune":{"id":"40-resources/summary-windows-enterprise-value-prop-intune","title":"Summary — Windows Enterprise value prop: Intune standpoint","path":"40-Resources/summary-windows-enterprise-value-prop-intune.md","type":"summary","tags":["windows","intune","endpoint"],"html":"<h1>Summary — Windows Enterprise value prop: Intune standpoint</h1>\n<p><strong>Source:</strong> a Microsoft CAT (Customer Acceleration Team) deck, &quot;Windows Enterprise value prop – Intune standpoint&quot;. Three near-identical copies exist (2025-04 to 2026-01); two were read and one timed out. The slides are mostly titles plus Microsoft Learn links. See <a href=\"#note/raw/2026-10-19-windows-11-enterprise-folderref\">raw/2026-10-19-windows-11-enterprise-folder.ref.md</a>.</p>\n<h2>Key takeaways</h2>\n<ol>\n<li><strong>Framing:</strong> the choice depends on business needs, endpoint-management maturity and the wish to consolidate agents and vendors. The maturity path runs ConfigMgr on-premises → tenant attach → co-management → workloads moved to Intune → modern managed (cloud-native).</li>\n<li><strong>Windows Enterprise capabilities surfaced through Intune:</strong><ul>\n<li>feature-update pinning and reporting</li>\n<li>expedited zero-day updates and their reporting</li>\n<li>upgrade-readiness report</li>\n<li>proactive remediation</li>\n<li><a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch</a></li>\n<li>Connected Cache</li>\n<li>BitLocker management</li>\n<li>driver and firmware servicing (hidden slides)</li>\n<li>Personal Data Encryption (Windows 11 22H2+, unlocked by WHfB)</li>\n<li>Hotpatch</li>\n</ul>\n</li>\n<li><strong>Autopatch division of labour:</strong><ul>\n<li><strong>You:</strong> enroll endpoints.</li>\n<li><strong>Microsoft:</strong> evaluates and selects updates, defines and maintains test rings, schedules, deploys, monitors, pauses and rolls back. Microsoft sees cross-customer signals, so it catches conflicts early.</li>\n</ul>\n</li>\n</ol>\n<p>Related: <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> · <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a> · <a href=\"#note/_meta/mocs/moc-windows-and-endpoint-management\">moc-windows-and-endpoint-management</a></p>\n"},"agents":{"id":"agents","title":"AGENTS — Vault Operating Manual","path":"AGENTS.md","type":"schema","tags":["meta","schema"],"html":"<h1>AGENTS.md</h1>\n<p>Operating manual for any AI agent (and for me) working in this Second Brain. Pattern: Karpathy-style LLM wiki — raw sources in, a compiled wiki out, governed by a schema.</p>\n<h2>1. Three layers and ownership</h2>\n<table>\n<thead>\n<tr>\n<th>Layer</th>\n<th>Folders</th>\n<th>Owner</th>\n<th>Rule</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Raw</strong></td>\n<td><code>raw/</code>, <code>00-Inbox/</code></td>\n<td>Human</td>\n<td>Immutable. Agent may add a copy or reference; never edits or deletes.</td>\n</tr>\n<tr>\n<td><strong>Wiki</strong></td>\n<td><code>10-Notes/</code>, <code>20-Projects/</code>, <code>30-Areas/</code>, <code>40-Resources/</code>, <code>index.md</code>, <code>log.md</code>, <code>_meta/MOCs/</code></td>\n<td>Agent (human reviews)</td>\n<td>Compiled knowledge. Agent creates and updates; every claim traces to a raw source.</td>\n</tr>\n<tr>\n<td><strong>Schema</strong></td>\n<td><code>AGENTS.md</code>, <code>_meta/conventions.md</code>, <code>_meta/templates/</code></td>\n<td>Human</td>\n<td>Rules of the vault. Agent proposes changes; human approves.</td>\n</tr>\n</tbody></table>\n<h2>2. Folder conventions and naming</h2>\n<table>\n<thead>\n<tr>\n<th>Folder</th>\n<th>Holds</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>raw/</code></td>\n<td>Original sources (PDFs, transcripts, clippings, links). Never modified.</td>\n</tr>\n<tr>\n<td><code>00-Inbox/</code></td>\n<td>Quick captures awaiting processing. Cleared weekly.</td>\n</tr>\n<tr>\n<td><code>10-Notes/entities/</code></td>\n<td>People, orgs, products, tools — one per page.</td>\n</tr>\n<tr>\n<td><code>10-Notes/concepts/</code></td>\n<td>Ideas, frameworks, patterns — one per page.</td>\n</tr>\n<tr>\n<td><code>20-Projects/</code></td>\n<td>Time-bound work with a goal and end date.</td>\n</tr>\n<tr>\n<td><code>30-Areas/</code></td>\n<td>Ongoing responsibilities (no end date).</td>\n</tr>\n<tr>\n<td><code>40-Resources/</code></td>\n<td>Source summaries and analysis pages.</td>\n</tr>\n<tr>\n<td><code>50-Archive/</code></td>\n<td>Finished or inactive items. Move, never delete.</td>\n</tr>\n<tr>\n<td><code>_meta/</code></td>\n<td>Schema, MOCs, templates.</td>\n</tr>\n</tbody></table>\n<p>Naming: atomic notes in <code>kebab-case.md</code> (e.g. <code>microsoft-copilot.md</code>); Inbox captures and raw files as <code>YYYY-MM-DD-slug.ext</code>; summaries as <code>summary-&lt;slug&gt;.md</code>; analyses as <code>analysis-&lt;slug&gt;.md</code>; MOCs as <code>moc-&lt;topic&gt;.md</code> (except <code>home.md</code>). Full rules: <code>[conventions](#note/_meta/conventions)</code>.</p>\n<h2>3. Page types and frontmatter</h2>\n<p>Types: <code>entity</code>, <code>concept</code>, <code>summary</code>, <code>analysis</code>, <code>project</code>, <code>area</code>, <code>moc</code>, <code>capture</code>, <code>schema</code>.</p>\n<p>Every wiki page starts with:</p>\n<pre><code class=\"language-yaml\">---\ntitle: Human-readable title\ntype: entity | concept | summary | analysis | project | area | moc | capture | schema\ncreated: YYYY-MM-DD\nupdated: YYYY-MM-DD\ntags: [topic, subtopic]\nsources: [&quot;raw/2026-10-18-source-slug&quot;]\nstatus: draft | active | evergreen | stale | archived\n---\n</code></pre>\n<p>A page missing any of the seven fields fails lint.</p>\n<h3>Optional: claims block</h3>\n<p>Use <code>claims:</code> in frontmatter for assertions worth tracking individually (facts, numbers, predictions, decisions). Most useful on entity, concept, summary and analysis pages.</p>\n<pre><code class=\"language-yaml\">claims:\n  - id: claim-001\n    text: &quot;&lt;one atomic assertion&gt;&quot;\n    confidence: 0.8\n    status: provisional | evergreen | disputed\n    evidence:\n      - source: raw/2026-10-19-source-slug.md\n        kind: documentation | quote | observation\n        excerpt: &quot;&lt;short quote, under 30 words&gt;&quot;\n    captured: YYYY-MM-DD\n    updated: YYYY-MM-DD\n</code></pre>\n<p>Rules:</p>\n<ul>\n<li><code>id</code> is unique within the page (<code>claim-001</code>, <code>claim-002</code>, …); cite elsewhere as <code>page#claim-001</code>.</li>\n<li>One assertion per claim. <code>confidence</code> is 0.0–1.0: below 0.5 is a hunch, 0.5–0.8 is likely, above 0.8 is well supported.</li>\n<li><code>status</code>: <code>provisional</code> = new or single-source; <code>evergreen</code> = confirmed by 2+ sources or durable by nature; <code>disputed</code> = credible evidence on both sides.</li>\n<li>Every <code>evidence.source</code> points to a file in <code>raw/</code>. <code>documentation</code> = official docs or specs; <code>quote</code> = a person&#39;s words; <code>observation</code> = something I saw first-hand.</li>\n<li>When new evidence conflicts, add it to the claim, set <code>status: disputed</code>, adjust <code>confidence</code>, bump <code>updated</code>, and log it. Never delete evidence.</li>\n</ul>\n<h2>4. Operations</h2>\n<h3>ingest (raw → wiki)</h3>\n<ol>\n<li>Read the source in full.</li>\n<li>Save a copy or reference to <code>raw/</code> as <code>YYYY-MM-DD-slug</code>.</li>\n<li>Give the human 1–3 key takeaways; discuss before writing.</li>\n<li>Write <code>40-Resources/summary-&lt;slug&gt;.md</code> with citations.</li>\n<li>Create or update entity pages for people, orgs, products.</li>\n<li>Create or update concept pages for ideas worth tracking.</li>\n<li>Update relevant MOCs in <code>_meta/MOCs/</code>.</li>\n<li>Update <code>index.md</code>; append to <code>log.md</code>.</li>\n<li>Report every page touched.</li>\n</ol>\n<h3>query (wiki → answer)</h3>\n<ol>\n<li>Read <code>index.md</code> first.</li>\n<li>Drill into relevant pages; follow <code>links</code>.</li>\n<li>Synthesize an answer citing wiki pages; no fresh web search unless asked.</li>\n<li>If the answer is non-trivial, offer to file it as <code>40-Resources/analysis-&lt;slug&gt;.md</code>, then update index and log.</li>\n</ol>\n<h3>lint (health check)</h3>\n<p>Report, then wait for approval before fixing.</p>\n<p>Pages:</p>\n<ul>\n<li><strong>Contradictions</strong> — pages that disagree, in prose or in claims.</li>\n<li><strong>Orphans</strong> — pages nothing links to.</li>\n<li><strong>Stale pages</strong> — <code>status: evergreen</code> with page <code>updated</code> older than 90 days.</li>\n<li><strong>Missing</strong> — concepts mentioned often with no page; missing cross-references; missing frontmatter fields.</li>\n<li><strong>Inbox backlog</strong> — captures older than 7 days.</li>\n</ul>\n<p>Claims:</p>\n<ul>\n<li><strong>Disputed</strong> — every claim with <code>status: disputed</code>, with its evidence on each side.</li>\n<li><strong>No evidence</strong> — claims with an empty <code>evidence</code> list, or a <code>source</code> that isn&#39;t in <code>raw/</code>.</li>\n<li><strong>Cross-page contradictions</strong> — two claims on different pages that assert incompatible things about the same subject.</li>\n<li><strong>Stale evergreen</strong> — <code>status: evergreen</code> claims with <code>updated</code> older than 90 days.</li>\n<li><strong>Confidence mismatch</strong> — <code>evergreen</code> claims below 0.8 confidence, or a single source with confidence above 0.8.</li>\n</ul>\n<p>Report format: one table per check — page, claim id (if any), issue, suggested fix.</p>\n<h2>5. Log format</h2>\n<p><code>log.md</code> is append-only, newest at the bottom, one line per event, greppable:</p>\n<pre><code>## [YYYY-MM-DD] &lt;op&gt; | &lt;subject&gt;\n- touched: page-a, page-b\n- note: one line on what changed or why\n</code></pre>\n<p><code>&lt;op&gt;</code> is one of <code>ingest</code>, <code>query</code>, <code>lint</code>, <code>fix</code>, <code>schema</code>, <code>archive</code>, <code>claim</code>.\nFind all ingests: <code>grep &quot;] ingest&quot; log.md</code>.</p>\n<h2>6. House rules</h2>\n<ol>\n<li><strong>One idea per page.</strong> Split when a page covers two things.</li>\n<li><strong>Cite sources.</strong> Every factual claim links to a <code>raw/</code> file or a summary page; tracked claims carry <code>evidence</code>.</li>\n<li><strong>Flag uncertainty.</strong> Mark unverified claims <code>&gt; [!question]</code> and contradictions <code>&gt; [!warning]</code>.</li>\n<li><strong>Link, don&#39;t duplicate.</strong> Reference an existing page instead of restating it.</li>\n<li><strong>Never touch raw.</strong> Raw is append-only.</li>\n<li><strong>Show before saving</strong> schema changes; wiki edits are reported after.</li>\n<li><strong>Update <code>updated:</code></strong> on every edit.</li>\n</ol>\n"},"index":{"id":"index","title":"Index","path":"index.md","type":"moc","tags":["meta","index"],"html":"<h1>Index</h1>\n<p>Catalog of every wiki page. Agents read this first on every query. One line per page: <code>link — one-line description</code>.</p>\n<h2>Entities</h2>\n<ul>\n<li><a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> — enterprise suite: O365 E3 + EMS E3 + ME3 extras</li>\n<li><a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a> — productivity and baseline compliance layer of M365 E3</li>\n<li><a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a> — identity and endpoint layer: Entra ID P1, Intune, MIP P1</li>\n<li><a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> — cloud identity; P1 brings Conditional Access, MFA, SSO</li>\n<li><a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> — endpoint and app management (MDM, MAM, patching, compliance)</li>\n<li><a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a> — email and collaboration threat protection (Plan 1)</li>\n<li><a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> — endpoint security; P1 is in M365 E3</li>\n<li><a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> — E1 + Entra ID P1 + Intune P1 + DLP; emerging-markets promo</li>\n<li><a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a> — enterprise Windows: 5-environment rights, Autopatch, BitLocker management</li>\n<li><a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch</a> — automated ring-based Windows update service</li>\n<li><a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a> — Graph-grounded AI assistant; add-on to O365/M365</li>\n<li><a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a> — baseline email filtering (spam, malware, phishing)</li>\n<li><a href=\"#note/10-notes/entities/microsoft-purview\">microsoft-purview</a> — data security and compliance: DLP, labels, retention, eDiscovery</li>\n<li><a href=\"#note/10-notes/entities/microsoft-365-e5\">microsoft-365-e5</a> — top tier: Entra ID Protection, auto-labels, Defender for Cloud Apps, XDR</li>\n<li><a href=\"#note/10-notes/entities/windows-hello-for-business\">windows-hello-for-business</a> — PIN or biometric + TPM sign-in; on Pro and Enterprise</li>\n<li><a href=\"#note/10-notes/entities/microsoft-intune-suite\">microsoft-intune-suite</a> — paid add-on: EPM, Cloud PKI, Tunnel; not in E3 or E5</li>\n<li><a href=\"#note/10-notes/entities/manageengine\">manageengine</a> — third-party UEM competitor; no Entra compliance write, so no mobile device CA</li>\n<li><a href=\"#note/10-notes/entities/copilot-plus-pc\">copilot-plus-pc</a> — 40+ TOPS NPU Windows PCs; Pluton and Secured-core by default</li>\n<li><a href=\"#note/10-notes/entities/universal-print\">universal-print</a> — cloud print with no servers; in Windows Enterprise</li>\n</ul>\n<h2>Concepts</h2>\n<ul>\n<li><a href=\"#note/10-notes/concepts/m365-licensing-stack\">m365-licensing-stack</a> — M365 suites are built from smaller suites; explain them layer by layer</li>\n<li><a href=\"#note/10-notes/concepts/email-and-collaboration-protection-layers\">email-and-collaboration-protection-layers</a> — baseline EOP → MDO P1 → investigation</li>\n<li><a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a> — policy-driven if-then access decisions</li>\n<li><a href=\"#note/10-notes/concepts/mdm-vs-mam\">mdm-vs-mam</a> — manage the whole device vs only the apps</li>\n<li><a href=\"#note/10-notes/concepts/zero-trust\">zero-trust</a> — verify explicitly, least privilege, assume breach</li>\n<li><a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a> — five controls + good/better/best licensing for Copilot</li>\n<li><a href=\"#note/10-notes/concepts/enterprise-data-protection\">enterprise-data-protection</a> — work-account Copilot Chat data isn&#39;t used for training</li>\n<li><a href=\"#note/10-notes/concepts/passwordless-authentication\">passwordless-authentication</a> — WHfB, Authenticator, FIDO2; app integration is the long pole</li>\n<li><a href=\"#note/10-notes/concepts/device-compliance-signal-flow\">device-compliance-signal-flow</a> — Intune evaluates → Entra stores → CA enforces</li>\n<li><a href=\"#note/10-notes/concepts/windows-enterprise-servicing\">windows-enterprise-servicing</a> — 36-month support, pinning, Autopatch, Expedite, Hotpatch</li>\n<li><a href=\"#note/10-notes/concepts/windows-virtualization-rights\">windows-virtualization-rights</a> — 5 instances per user; AVD, W365, VDA included</li>\n</ul>\n<h2>Summaries</h2>\n<ul>\n<li><a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a> — M365 E3 feature map (O365 E3, EMS E3, ME3 extras); claims 003–005 resolved: Intune Plan 2, Tunnel and MDO P1 in E3 since July 2026</li>\n<li><a href=\"#note/40-resources/summary-mdo-plan1-feature-map\">summary-mdo-plan1-feature-map</a> — Defender for Office 365 Plan 1 capabilities</li>\n<li><a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a> — Office 365 E1 Plus feature map</li>\n<li><a href=\"#note/40-resources/summary-windows-11-enterprise-feature-map\">summary-windows-11-enterprise-feature-map</a> — Windows 11 Enterprise feature map</li>\n<li><a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> — Copilot security deck: five controls, E1 Plus/E3/E5 matrix; 3 claims (1 disputed)</li>\n<li><a href=\"#note/40-resources/summary-windows-11-enterprise-l100-deck\">summary-windows-11-enterprise-l100-deck</a> — Microsoft L100 pitch: Copilot, Autopatch, Zero Trust, TEI figures</li>\n<li><a href=\"#note/40-resources/summary-windows-11-enterprise-secure-managed-cloud-ready\">summary-windows-11-enterprise-secure-managed-cloud-ready</a> — Pro vs Enterprise E3 datasheet, Autopatch rings, Expedite, AOVPN</li>\n<li><a href=\"#note/40-resources/summary-windows-enterprise-e3-sellers-training-2023\">summary-windows-enterprise-e3-sellers-training-2023</a> — DATED: licensing mechanics, works-vs-licensed, objections</li>\n<li><a href=\"#note/40-resources/summary-windows-enterprise-value-prop-intune\">summary-windows-enterprise-value-prop-intune</a> — Intune-surfaced Windows Enterprise capabilities</li>\n<li><a href=\"#note/40-resources/summary-secure-wfh-government-m365-e3\">summary-secure-wfh-government-m365-e3</a> — government WFH pitch on E3; 1 disputed claim</li>\n<li><a href=\"#note/40-resources/summary-intune-vs-manageengine\">summary-intune-vs-manageengine</a> — why M365 data protection needs Intune at MDM and MAM layers</li>\n<li><a href=\"#note/40-resources/summary-passwordless-journey-2022\">summary-passwordless-journey-2022</a> — DATED: passwordless readiness pattern</li>\n</ul>\n<h2>MOCs</h2>\n<ul>\n<li><a href=\"#note/_meta/mocs/home\">home</a> — landing page and entry points</li>\n<li><a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a> — Microsoft 365 licensing, products and concepts</li>\n<li><a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a> — Copilot security controls and tiers</li>\n<li><a href=\"#note/_meta/mocs/moc-windows-and-endpoint-management\">moc-windows-and-endpoint-management</a> — Windows, Intune, servicing, passwordless, competitors</li>\n</ul>\n"},"log":{"id":"log","title":"Log","path":"log.md","type":"moc","tags":["meta","log"],"html":"<h1>Log</h1>\n<p>Append-only. Newest at the bottom. Format in <a href=\"#note/agents\">AGENTS</a> §5.</p>\n<h2>[2026-10-18] schema | vault scaffold</h2>\n<ul>\n<li>touched: raw/, 00-Inbox/, 10-Notes/entities/, 10-Notes/concepts/, 20-Projects/, 30-Areas/, 40-Resources/, 50-Archive/, _meta/MOCs/, _meta/templates/</li>\n<li>note: folder structure and empty placeholders created</li>\n</ul>\n<h2>[2026-10-19] schema | AGENTS.md, conventions, index, home</h2>\n<ul>\n<li>touched: <a href=\"#note/agents\">AGENTS</a>, <a href=\"#note/_meta/conventions\">conventions</a>, <a href=\"#note/index\">index</a>, <a href=\"#note/_meta/mocs/home\">home</a></li>\n<li>note: vault manual (incl. optional claims block and claim lint checks), conventions, empty index and landing MOC approved and saved</li>\n</ul>\n<h2>[2026-10-19] schema | Synapse persona</h2>\n<ul>\n<li>touched: .copilot/synapse/SOUL.md, .copilot/synapse/AGENTS.md, <a href=\"#note
