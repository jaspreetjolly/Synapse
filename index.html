iew\">microsoft-purview</a>, <a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a>, <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a>, <a href=\"#note/index\">index</a>, raw/2026-10-19-jaspreet-rulings-licensing.md, raw/2026-10-19-intune-advanced-capabilities-e3-e5.ref.md, raw/2026-10-19-ms-learn-autopatch-prerequisites.ref.md, raw/2026-10-19-ms-learn-point-in-time-restore.ref.md</li>\n<li>note: Intune P2 and Tunnel in E3 (validated on the web: July 2026 change); Autopatch on F3 (MS Learn); Copilot Chat retained in a mailbox Substrate folder; ID Protection/JIT split P1 vs P2; Application Guard deprecated; pinning up to 3 years = 1,060 days; Copilot Chat model warning removed; OneDrive 1 TB default / 5 TB max; PITR per MS Learn; manual labels AIP P1/E3, auto AIP P2/E5. Still open: AOVPN user tunnel, MDO P1 in O365 E3</li>\n</ul>\n<h2>[2026-10-19] claim | Defender for Office 365 P1 in E3 resolved</h2>\n<ul>\n<li>touched: raw/2026-10-19-ms-learn-mdo-service-description.ref.md, <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map#claim-005</a>, <a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a>, <a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a>, <a href=\"#note/10-notes/concepts/email-and-collaboration-protection-layers\">email-and-collaboration-protection-layers</a>, <a href=\"#note/40-resources/summary-mdo-plan1-feature-map\">summary-mdo-plan1-feature-map</a>, <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a>, <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>, <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a>, <a href=\"#note/index\">index</a></li>\n<li>note: Microsoft Learn MDO service description: P1 included in O365 E3 and M365 E3 effective 1 Jul 2026 (P1 capabilities only; P2 stays E5). Last open item: AOVPN user tunnel on Pro</li>\n</ul>\n"},"raw/2026-10-19-elevate-security-for-copilot-o365-e1-plusref":{"id":"raw/2026-10-19-elevate-security-for-copilot-o365-e1-plusref","title":"Reference — Elevate security for Copilot with Office 365 E1 Plus (deck)","path":"raw/2026-10-19-elevate-security-for-copilot-o365-e1-plus.ref.md","type":"capture","tags":["raw","reference"],"html":"<h1>Reference — Elevate security for Copilot with Office 365 E1 Plus</h1>\n<ul>\n<li>Original file: &quot;Elevate security for Copilot with O365 E1 Plus.PPTX&quot; (25 slides, v9.1), attached by Jaspreet on 2026-10-19.</li>\n<li>Classification: Microsoft confidential, for presenter info only.</li>\n<li>Intended copy: raw/2026-10-19-elevate-security-for-copilot-o365-e1-plus.pptx. The automatic copy was blocked by sensitivity-label policy, so Jaspreet should upload the deck here manually under that name.</li>\n<li>Summary: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a></li>\n</ul>\n"},"raw/2026-10-19-intune-advanced-capabilities-e3-e5ref":{"id":"raw/2026-10-19-intune-advanced-capabilities-e3-e5ref","title":"Reference — Intune advanced capabilities in M365 E3/E5 (July 2026)","path":"raw/2026-10-19-intune-advanced-capabilities-e3-e5.ref.md","type":"capture","tags":["raw","reference","licensing"],"html":"<h1>Reference — Intune advanced capabilities in M365 E3/E5 (July 2026)</h1>\n<p>Validated on the web on 2026-10-19 at Jaspreet&#39;s request. Summary in my own words, not a copy.</p>\n<ul>\n<li><strong>Microsoft Learn</strong>, &quot;Microsoft Intune advanced capabilities&quot; (learn.microsoft.com/intune/fundamentals/advanced-capabilities): advanced capabilities (FOTA, specialty devices, Tunnel for MAM, Advanced Analytics, Remote Help, Cloud PKI, EPM, Enterprise App Management) come through Intune Plan 2, the Intune Suite, and <strong>select Microsoft 365 bundles</strong>.</li>\n<li><strong>Multiple secondary sources</strong> (Cyvra, Zarioh, Paul Rigby, IT trip, HubSite 365), consistent with each other and citing Microsoft&#39;s 2026 M365 packaging and pricing FAQ and the Intune blog post &quot;Advanced Microsoft Intune capabilities now available in Microsoft 365 E3 and E5&quot;:<ul>\n<li>From <strong>1 July 2026</strong>, rolled out tenant by tenant after 30 days&#39; notice, complete by about <strong>1 August 2026</strong>.</li>\n<li><strong>M365 E3:</strong> Intune <strong>Plan 2</strong> (Tunnel for MAM, FOTA, specialty devices), <strong>Remote Help</strong>, <strong>Advanced Analytics</strong>.</li>\n<li><strong>M365 E5:</strong> the E3 set plus <strong>EPM, Cloud PKI, Enterprise App Management</strong>.</li>\n<li>No action is needed to receive them. Existing Suite customers should review at renewal.</li>\n</ul>\n</li>\n</ul>\n<blockquote>\n<p>[!question] The primary Microsoft pricing FAQ and the Intune blog were cited by these sources but not opened directly. Upgrade the evidence when one is ingested.</p>\n</blockquote>\n<p>Used by: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map#claim-003</a>, <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map#claim-004</a>, <a href=\"#note/10-notes/entities/microsoft-intune-suite\">microsoft-intune-suite</a></p>\n"},"raw/2026-10-19-jaspreet-e3-storage-confirmation":{"id":"raw/2026-10-19-jaspreet-e3-storage-confirmation","title":"Jaspreet confirmation — M365 E3 storage","path":"raw/2026-10-19-jaspreet-e3-storage-confirmation.md","type":"capture","tags":["raw","observation","licensing"],"html":"<h1>Jaspreet confirmation — M365 E3 storage</h1>\n<p>On 2026-10-19 (10:28 IST), Jaspreet stated in a Synapse session: &quot;E3 storage is not unlimited its 5 TB&quot;.</p>\n<p>This was recorded as first-hand observation evidence for <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map#claim-002</a>.</p>\n"},"raw/2026-10-19-jaspreet-rulings-licensing":{"id":"raw/2026-10-19-jaspreet-rulings-licensing","title":"Jaspreet rulings — licensing and Windows contradictions","path":"raw/2026-10-19-jaspreet-rulings-licensing.md","type":"capture","tags":["raw","observation"],"html":"<h1>Jaspreet rulings — licensing and Windows contradictions</h1>\n<p>First-hand rulings Jaspreet gave in a Synapse session on 2026-10-19 (14:13 IST). Quoted as given:</p>\n<ol>\n<li>&quot;Tunnel for MAM in my mindmap show it under Intune itself. Map is correct and now Intune Plan 2 is also part of ME3.&quot;</li>\n<li>&quot;Chat retention is there it is stored in Substrate folder in user mailbox.&quot;</li>\n<li>&quot;Autopatch is available for MF3&quot; (cites the Microsoft Learn Autopatch prerequisites page).</li>\n<li>Identity Protection and JIT, as a table:</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>Capability</th>\n<th>Entra ID P1 / M365 E3</th>\n<th>Entra ID P2 / M365 E5</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Identity Protection visibility</td>\n<td>Limited</td>\n<td>Full</td>\n</tr>\n<tr>\n<td>Risky-user information</td>\n<td>Limited data</td>\n<td>Full risk details</td>\n</tr>\n<tr>\n<td>Risk-based CA (user / sign-in risk)</td>\n<td>No</td>\n<td>Yes</td>\n</tr>\n<tr>\n<td>Automated risk remediation</td>\n<td>No</td>\n<td>Yes</td>\n</tr>\n<tr>\n<td>Time-limited user access (e.g. Temporary Access Pass)</td>\n<td>Yes</td>\n<td>Yes</td>\n</tr>\n<tr>\n<td>PIM / JIT privileged role activation</td>\n<td>No</td>\n<td>Yes</td>\n</tr>\n</tbody></table>\n<ol start=\"5\">\n<li>&quot;Defender Application Guard is depricated.&quot;</li>\n<li>&quot;Feature-update pinning: upto 3 years (1060 days).&quot;</li>\n<li>Remove any &quot;Copilot Chat model&quot; mention, because it keeps changing.</li>\n<li>&quot;OneDrive: 1 TB is the default and 5 TB the maximum.&quot;</li>\n<li>Point-in-time restore: use the Microsoft Learn page.</li>\n<li>&quot;Manual labelling AIP1/ ME3, Auto Labelling in AIP2/ E5.&quot;</li>\n</ol>\n"},"raw/2026-10-19-ms-learn-autopatch-prerequisitesref":{"id":"raw/2026-10-19-ms-learn-autopatch-prerequisitesref","title":"Reference — Microsoft Learn: Windows Autopatch prerequisites","path":"raw/2026-10-19-ms-learn-autopatch-prerequisites.ref.md","type":"capture","tags":["raw","reference","windows"],"html":"<h1>Reference — Microsoft Learn: Windows Autopatch prerequisites</h1>\n<p>URL: <a href=\"https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/prepare/windows-autopatch-prerequisites\">https://learn.microsoft.com/en-us/windows/deployment/windows-autopatch/prepare/windows-autopatch-prerequisites</a> (last updated 02/26/2026). Read on 2026-10-19. Summary in my own words.</p>\n<ul>\n<li><strong>Licences:</strong> M365 Business Premium; Windows Education A3/A5; Windows Enterprise E3/E5 (<strong>included in M365 F3, E3 or E5</strong>); Windows Enterprise E3/E5 VDA.</li>\n<li><strong>Feature entitlement:</strong> Business Premium, A3+, E3+ and F3 all get releases, rings, quality, feature and driver/firmware updates, Autopatch groups and reports. <strong>Support requests are E3+ and F3 only.</strong></li>\n<li><strong>Infrastructure:</strong> Entra ID P1 or P2 plus Intune. Intune is the MDM authority or co-managed (Windows Update and Device configuration workloads set to Intune or Pilot Intune). Devices must have checked in within 28 days, be internet-connected and be <strong>corporate-owned (BYOD blocked)</strong>.</li>\n<li><strong>Editions:</strong> Windows 10/11 Pro, Education, Enterprise, Pro Education, Pro for Workstations and IoT Enterprise. LTSC gets quality updates only.</li>\n<li><strong>Diagnostic data:</strong> at least Required level for the deployment protections.</li>\n</ul>\n<p>Used by: <a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch#claim-002</a></p>\n"},"raw/2026-10-19-ms-learn-mdo-service-descriptionref":{"id":"raw/2026-10-19-ms-learn-mdo-service-descriptionref","title":"Reference — Microsoft Learn: Defender for Office 365 service description","path":"raw/2026-10-19-ms-learn-mdo-service-description.ref.md","type":"capture","tags":["raw","reference","licensing","email-security"],"html":"<h1>Reference — Microsoft Learn: Defender for Office 365 service description</h1>\n<p>URLs, read on 2026-10-19:</p>\n<ul>\n<li><a href=\"https://learn.microsoft.com/en-us/office365/servicedescriptions/office-365-advanced-threat-protection-service-description\">https://learn.microsoft.com/en-us/office365/servicedescriptions/office-365-advanced-threat-protection-service-description</a></li>\n<li><a href=\"https://learn.microsoft.com/en-us/office365/servicedescriptions/microsoft-defender-for-office-365-features\">https://learn.microsoft.com/en-us/office365/servicedescriptions/microsoft-defender-for-office-365-features</a></li>\n</ul>\n<p>Summary in my own words:</p>\n<ul>\n<li><strong>Plan 1:</strong> included in Microsoft 365 Business Premium and, <strong>effective 1 July 2026, in Office 365 E3 and Microsoft 365 E3</strong>. E3 customers get Plan 1 capabilities only: Safe Links, Safe Attachments, anti-phishing with user and domain impersonation protection, and real-time detections.</li>\n<li><strong>Plan 2:</strong> included in Microsoft 365 E5, A5 and G5. Adds Threat Trackers, campaign views, Threat Explorer, automated investigation and response, attack simulation training, and Defender XDR integration.</li>\n<li><strong>Secondary sources</strong> (ITPro-Tips, Tiago S. Carvalho, Calance):<ul>\n<li>The rollout started on 17 June 2026.</li>\n<li>Licensed users automatically get the Built-in protection preset; Standard and Strict must be enabled manually.</li>\n<li>Real-time detections without Threat Explorer means the tenant is on Plan 1.</li>\n</ul>\n</li>\n</ul>\n<p>Used by: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map#claim-005</a>, <a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a></p>\n"},"raw/2026-10-19-ms-learn-point-in-time-restoreref":{"id":"raw/2026-10-19-ms-learn-point-in-time-restoreref","title":"Reference — Microsoft Learn: Point-in-time restore for Windows","path":"raw/2026-10-19-ms-learn-point-in-time-restore.ref.md","type":"capture","tags":["raw","reference","windows"],"html":"<h1>Reference — Microsoft Learn: Point-in-time restore for Windows</h1>\n<p>URL: <a href=\"https://learn.microsoft.com/en-us/windows/configuration/point-in-time-restore\">https://learn.microsoft.com/en-us/windows/configuration/point-in-time-restore</a> (applies to Windows 11; last updated 10/15/2026). Read on 2026-10-19. Summary in my own words.</p>\n<ul>\n<li><strong>What it does:</strong> restores a Windows 11 PC to its full earlier state (OS, apps, settings, local files) in minutes, using local <strong>VSS</strong> restore points from the <strong>last 72 hours</strong>.</li>\n<li><strong>Capture:</strong> automatic. Default about <strong>every 24 hours</strong>; configurable to 4, 6, 12, 16 or 24 hours.</li>\n<li><strong>Retention:</strong> default 72 hours; configurable down to 4 hours.</li>\n<li><strong>Space cap:</strong> default 2% of disk, between 2 GB and 50 GB. Restore points are evicted first when free space drops to 20 GB or less.</li>\n<li><strong>Edition split:</strong><ul>\n<li><strong>On/off and the space cap:</strong> Home, Pro and Enterprise.</li>\n<li><strong>Frequency and retention:</strong> <strong>Enterprise only</strong>.</li>\n<li><strong>On by default:</strong> unmanaged Home and Pro (OS volume of 200 GB or more).</li>\n<li><strong>Off by default:</strong> Enterprise and Education, and managed or domain-joined Pro.</li>\n</ul>\n</li>\n<li><strong>Management:</strong> Recovery CSP <code>PointInTimeRestore</code> node (enable, max disk usage, frequency, retention), or Settings &gt; System &gt; Recovery.</li>\n<li><strong>Restore:</strong> local only, from <strong>WinRE</strong> (Troubleshoot &gt; Point-in-time restore). Needs the <strong>BitLocker recovery key</strong>. Changes after the restore point are lost, but <strong>OneDrive cloud data is unaffected</strong>. It can roll back recent security updates or policies, so validate afterwards. Only the OS volume is restored. EFS-encrypted files block restore.</li>\n<li><strong>Versus System Restore:</strong> PITR is scheduled-only, covers the full system, keeps restore points 72 hours at most, uses reserved storage and supports remote management. System Restore is event-triggered or manual and covers system files and settings only.</li>\n<li><strong>Versus Windows 365 PITR:</strong> the Cloud PC version keeps restore points up to a month in cloud storage.</li>\n</ul>\n<p>Used by: <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a>, <a href=\"#note/40-resources/summary-secure-wfh-government-m365-e3\">summary-secure-wfh-government-m365-e3</a></p>\n"},"raw/2026-10-19-windows-11-enterprise-folderref":{"id":"raw/2026-10-19-windows-11-enterprise-folderref","title":"Reference — Windows 11 Enterprise source folder","path":"raw/2026-10-19-windows-11-enterprise-folder.ref.md","type":"capture","tags":["raw","reference"],"html":"<h1>Reference — Windows 11 Enterprise source folder</h1>\n<p>The originals stay where they are, in OneDrive at <code>Windows 11 Enterprise/</code>. They are referenced here rather than copied, because several are 20–300 MB. Ingested 2026-10-19.</p>\n<table>\n<thead>\n<tr>\n<th>File</th>\n<th>Last modified</th>\n<th>Ingested</th>\n<th>Summary</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Windows 11 Enterprise L100 deck.PPTX</td>\n<td>2026-01-25</td>\n<td>✓ 24 slides + notes</td>\n<td><a href=\"#note/40-resources/summary-windows-11-enterprise-l100-deck\">summary-windows-11-enterprise-l100-deck</a></td>\n</tr>\n<tr>\n<td>Windows 11 Enterprise Secure, Managed, Cloud-Ready.pptx</td>\n<td>2026-03-03</td>\n<td>✓ 14 slides</td>\n<td><a href=\"#note/40-resources/summary-windows-11-enterprise-secure-managed-cloud-ready\">summary-windows-11-enterprise-secure-managed-cloud-ready</a></td>\n</tr>\n<tr>\n<td>Windows 11 Enterprise Secure, Managed, Cloud-Ready (2).pptx</td>\n<td>2026-01-26</td>\n<td>✓ earlier version of the above</td>\n<td>same</td>\n</tr>\n<tr>\n<td>Differentiating_Windows_Pro_from_Windows_E3_Updated.pptx</td>\n<td>2026-04-06</td>\n<td>✓ 5 slides</td>\n<td>same</td>\n</tr>\n<tr>\n<td>Windows Enterprise E3 presentation - sellers training session March 6 2023.pptx</td>\n<td>2025-10-30</td>\n<td>✓ 26 slides + notes</td>\n<td><a href=\"#note/40-resources/summary-windows-enterprise-e3-sellers-training-2023\">summary-windows-enterprise-e3-sellers-training-2023</a></td>\n</tr>\n<tr>\n<td>Windows Enterprise ValueProp(Intune).pptx</td>\n<td>2026-01-16</td>\n<td>✓ 26 slides</td>\n<td><a href=\"#note/40-resources/summary-windows-enterprise-value-prop-intune\">summary-windows-enterprise-value-prop-intune</a></td>\n</tr>\n<tr>\n<td>Windows Enterprise-Value Prop with Intune.pptx</td>\n<td>2025-10-31</td>\n<td>✓ near-duplicate</td>\n<td>same</td>\n</tr>\n<tr>\n<td>WindowsEntps-ValueProp(Intune).pptx</td>\n<td>2025-04-10</td>\n<td>✗ download timed out twice; assumed to be a third copy</td>\n<td>same</td>\n</tr>\n<tr>\n<td>Secure-WFH-Government-M365-E3.pptx</td>\n<td>2026-04-25</td>\n<td>✓ 18 slides + notes</td>\n<td><a href=\"#note/40-resources/summary-secure-wfh-government-m365-e3\">summary-secure-wfh-government-m365-e3</a></td>\n</tr>\n<tr>\n<td>Intune-vs-ManageEngine-Security-Argument.pptx</td>\n<td>2026-09-11</td>\n<td>✓ 15 slides + notes</td>\n<td><a href=\"#note/40-resources/summary-intune-vs-manageengine\">summary-intune-vs-manageengine</a></td>\n</tr>\n<tr>\n<td>Passwordless - Session 16th Sep 2022.pptx</td>\n<td>2022-10-06</td>\n<td>✓ 6 slides</td>\n<td><a href=\"#note/40-resources/summary-passwordless-journey-2022\">summary-passwordless-journey-2022</a></td>\n</tr>\n<tr>\n<td>Windows 11 Enterprise - L200 pitch deck.PPTX</td>\n<td>2025-10-31</td>\n<td>✗ 290 MB, over the 249 MB copy limit</td>\n<td>not ingested</td>\n</tr>\n</tbody></table>\n"},"readme":{"id":"readme","title":"README","path":"README.md","type":"schema","tags":["meta"],"html":"<h1>Jaspreet&#39;s Second Brain</h1>\n<p>A Karpathy-style LLM wiki: raw sources in, compiled wiki out, governed by a schema.</p>\n<ul>\n<li>Start at <a href=\"#note/_meta/mocs/home\">home</a>.</li>\n<li>Rules for agents: <a href=\"#note/agents\">AGENTS</a>. Naming and formatting: <a href=\"#note/_meta/conventions\">conventions</a>.</li>\n<li>Catalog: <a href=\"#note/index\">index</a>. Change history: <a href=\"#note/log\">log</a>.</li>\n<li>Agent persona: Synapse (<code>.copilot/synapse/</code>), memory in <code>_meta/synapse/</code>.</li>\n</ul>\n<h2>Public graph site</h2>\n<p>This vault can be published as an interactive browser graph:</p>\n<p><a href=\"https://jaspreetjolly.github.io/Synapse/\">https://jaspreetjolly.github.io/Synapse/</a></p>\n<p>Local preview:</p>\n<pre><code class=\"language-powershell\">npm install\nnpm run build\nnpm run serve\n</code></pre>\n<p>Then open <code>http://127.0.0.1:8080/</code>.</p>\n"},"_meta/conventions":{"id":"_meta/conventions","title":"Vault Conventions","path":"_meta/conventions.md","type":"schema","tags":["meta","schema"],"html":"<h1>Conventions</h1>\n<h2>File naming</h2>\n<ul>\n<li>Atomic notes (entities, concepts): <code>kebab-case.md</code> — <code>azure-openai.md</code>, <code>second-brain.md</code>.</li>\n<li>Inbox captures and raw files: <code>YYYY-MM-DD-slug.md</code> — <code>2026-10-18-copilot-roadmap.md</code>.</li>\n<li>Summaries: <code>summary-&lt;slug&gt;.md</code>. Analyses: <code>analysis-&lt;slug&gt;.md</code>.</li>\n<li>Lowercase, hyphens only, no spaces or special characters, no dates in atomic note names.</li>\n</ul>\n<h2>Frontmatter</h2>\n<p>Required on every page: <code>title, type, created, updated, tags, sources, status</code>.</p>\n<pre><code class=\"language-yaml\">---\ntitle: Azure OpenAI\ntype: entity\ncreated: 2026-10-18\nupdated: 2026-10-18\ntags: [ai, microsoft, product]\nsources: [&quot;summary-azure-openai-overview&quot;]\nstatus: active\n---\n</code></pre>\n<pre><code class=\"language-yaml\">---\ntitle: 2026-10-18 Copilot roadmap note\ntype: capture\ncreated: 2026-10-18\nupdated: 2026-10-18\ntags: [inbox]\nsources: []\nstatus: draft\n---\n</code></pre>\n<p>Status values: <code>draft</code> → <code>active</code> → <code>evergreen</code>; <code>stale</code>, <code>archived</code> as needed.</p>\n<h2>Links</h2>\n<ul>\n<li>Use <code>wiki-links</code> by filename, no extension: <code>azure-openai</code>.</li>\n<li>Alias with a pipe: <code>AOAI</code>.</li>\n<li>Link to a heading: <code>second-brain#Layers</code>.</li>\n<li>Every new page links to at least one existing page and one MOC.</li>\n</ul>\n<h2>Tags</h2>\n<ul>\n<li>Lowercase, kebab-case, plural-free: <code>#ai</code>, <code>#customer</code>, <code>#modern-work</code>.</li>\n<li>Max 5 tags per page.</li>\n<li>Hierarchy with <code>/</code>: <code>#customer/acme</code>, <code>#area/sci</code>.</li>\n<li>Tags group; links relate. Don&#39;t use a tag where a link fits.</li>\n</ul>\n<h2>MOCs</h2>\n<ul>\n<li>Live in <code>_meta/MOCs/</code>.</li>\n<li>Name: <code>moc-&lt;topic&gt;.md</code>; landing page is <code>home.md</code>.</li>\n<li>Create a MOC when a topic has 5+ notes.</li>\n<li><code>home.md</code> links to every MOC.</li>\n</ul>\n<h2>Weekly Inbox processing (every Friday)</h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> Open <code>00-Inbox/</code>; handle oldest first.</li>\n<li><input disabled=\"\" type=\"checkbox\"> For each capture: delete, promote to a note, or ingest as a source.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Move source material to <code>raw/</code>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Add frontmatter and links to anything promoted.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Update relevant MOCs and <code>index.md</code>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Append one <code>log.md</code> entry for the session.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Inbox is empty, or every leftover item has a reason.</li>\n</ul>\n"},"_meta/mocs/home":{"id":"_meta/mocs/home","title":"Home","path":"_meta/MOCs/home.md","type":"moc","tags":["meta","moc"],"html":"<h1>Home</h1>\n<p>Start here.</p>\n<h2>How this vault works</h2>\n<ul>\n<li><a href=\"#note/agents\">AGENTS</a> — operating manual: layers, operations, house rules</li>\n<li><a href=\"#note/_meta/conventions\">conventions</a> — naming, frontmatter, links, tags</li>\n<li><a href=\"#note/index\">index</a> — full catalog of pages</li>\n<li><a href=\"#note/log\">log</a> — what changed and when</li>\n</ul>\n<h2>Capture and process</h2>\n<ul>\n<li><code>00-Inbox/</code> — quick captures; process weekly</li>\n<li><code>raw/</code> — immutable sources</li>\n</ul>\n<h2>Knowledge</h2>\n<ul>\n<li>Entities — <code>10-Notes/entities/</code></li>\n<li>Concepts — <code>10-Notes/concepts/</code></li>\n<li>Summaries and analyses — <code>40-Resources/</code></li>\n</ul>\n<h2>Work</h2>\n<ul>\n<li>Projects — <code>20-Projects/</code></li>\n<li>Areas — <code>30-Areas/</code></li>\n</ul>\n<h2>Topic MOCs</h2>\n<ul>\n<li><a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a> — E1 Plus, M365 E3, EMS, Entra, Intune, Defender, Windows</li>\n<li><a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a> — Zero Trust controls and licence tiers for Copilot</li>\n<li><a href=\"#note/_meta/mocs/moc-windows-and-endpoint-management\">moc-windows-and-endpoint-management</a> — Windows 11 Enterprise, Autopatch, Intune, passwordless, competitors</li>\n</ul>\n<p><em>Add a MOC here when a topic reaches 5+ notes.</em></p>\n"},"_meta/mocs/moc-copilot-security-readiness":{"id":"_meta/mocs/moc-copilot-security-readiness","title":"MOC — Copilot security readiness","path":"_meta/MOCs/moc-copilot-security-readiness.md","type":"moc","tags":["moc","copilot","security","zero-trust"],"html":"<h1>MOC — Copilot security readiness</h1>\n<h2>Start here</h2>\n<ul>\n<li><a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a> — the five controls and good / better / best licensing</li>\n</ul>\n<h2>Concepts</h2>\n<ul>\n<li><a href=\"#note/10-notes/concepts/zero-trust\">zero-trust</a> · <a href=\"#note/10-notes/concepts/enterprise-data-protection\">enterprise-data-protection</a> · <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a> · <a href=\"#note/10-notes/concepts/mdm-vs-mam\">mdm-vs-mam</a> · <a href=\"#note/10-notes/concepts/email-and-collaboration-protection-layers\">email-and-collaboration-protection-layers</a></li>\n</ul>\n<h2>Products</h2>\n<ul>\n<li>AI: <a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a></li>\n<li>Identity: <a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a></li>\n<li>Devices: <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> · <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a> · <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a></li>\n<li>Threats: <a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a> · <a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a></li>\n<li>Data: <a href=\"#note/10-notes/entities/microsoft-purview\">microsoft-purview</a></li>\n</ul>\n<h2>Licence tiers</h2>\n<ul>\n<li><a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> → <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> → <a href=\"#note/10-notes/entities/microsoft-365-e5\">microsoft-365-e5</a></li>\n</ul>\n<h2>Sources</h2>\n<ul>\n<li><a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a></li>\n</ul>\n<h2>Gaps</h2>\n<ul>\n<li>A dedicated M365 E5 source (the current page rests on deck speaker notes)</li>\n<li>Official Copilot data-protection terms</li>\n</ul>\n"},"_meta/mocs/moc-microsoft-365-licensing":{"id":"_meta/mocs/moc-microsoft-365-licensing","title":"MOC — Microsoft 365 licensing","path":"_meta/MOCs/moc-microsoft-365-licensing.md","type":"moc","tags":["moc","licensing","modern-work","security"],"html":"<h1>MOC — Microsoft 365 licensing</h1>\n<h2>Start here</h2>\n<ul>\n<li><a href=\"#note/10-notes/concepts/m365-licensing-stack\">m365-licensing-stack</a> — how the E3 layers fit together</li>\n</ul>\n<h2>Suites</h2>\n<ul>\n<li><a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> — emerging-markets Zero Trust starter</li>\n<li><a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> → <a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a> + <a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a> + <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a></li>\n<li><a href=\"#note/10-notes/entities/microsoft-365-e5\">microsoft-365-e5</a> — top tier: risk-based identity, auto-labelling, Defender XDR</li>\n</ul>\n<h2>Products</h2>\n<ul>\n<li>Identity: <a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> → <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a></li>\n<li>Endpoint: <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> → <a href=\"#note/10-notes/concepts/mdm-vs-mam\">mdm-vs-mam</a>; <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a></li>\n<li>Windows: <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a> → <a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch</a> · <a href=\"#note/10-notes/concepts/windows-virtualization-rights\">windows-virtualization-rights</a> — full map: <a href=\"#note/_meta/mocs/moc-windows-and-endpoint-management\">moc-windows-and-endpoint-management</a></li>\n<li>Add-ons: <a href=\"#note/10-notes/entities/microsoft-intune-suite\">microsoft-intune-suite</a></li>\n<li>Data: <a href=\"#note/10-notes/entities/microsoft-purview\">microsoft-purview</a></li>\n<li>AI: <a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a> → <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a></li>\n<li>Email and collaboration security: <a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a> → <a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a> → <a href=\"#note/10-notes/concepts/email-and-collaboration-protection-layers\">email-and-collaboration-protection-layers</a></li>\n</ul>\n<h2>Sources</h2>\n<ul>\n<li><a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a></li>\n<li><a href=\"#note/40-resources/summary-mdo-plan1-feature-map\">summary-mdo-plan1-feature-map</a></li>\n<li><a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a></li>\n<li><a href=\"#note/40-resources/summary-windows-11-enterprise-feature-map\">summary-windows-11-enterprise-feature-map</a></li>\n<li><a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a></li>\n</ul>\n<h2>Gaps</h2>\n<ul>\n<li>Official source still needed: Always-On VPN user tunnel on Pro</li>\n<li>Business Premium comparison; a dedicated E5 source</li>\n</ul>\n"},"_meta/mocs/moc-windows-and-endpoint-management":{"id":"_meta/mocs/moc-windows-and-endpoint-management","title":"MOC — Windows and endpoint management","path":"_meta/MOCs/moc-windows-and-endpoint-management.md","type":"moc","tags":["moc","windows","endpoint","intune"],"html":"<h1>MOC — Windows and endpoint management</h1>\n<h2>Start here</h2>\n<ul>\n<li><a href=\"#no ndows-enterprise-value-prop-intune\">summary-windows-enterprise-value-prop-intune</a></li>\n<li><a href=\"#note/40-resources/summary-windows-enterprise-e3-sellers-training-2023\">summary-windows-enterprise-e3-sellers-training-2023</a> (dated)</li>\n<li><a href=\"#note/40-resources/summary-intune-vs-manageengine\">summary-intune-vs-manageengine</a></li>\n<li><a href=\"#note/40-resources/summary-secure-wfh-government-m365-e3\">summary-secure-wfh-government-m365-e3</a></li>\n<li><a href=\"#note/40-resources/summary-passwordless-journey-2022\">summary-passwordless-journey-2022</a> (dated)</li>\n</ul>\n<h2>Gaps</h2>\n<ul>\n<li>The Windows 11 Enterprise L200 deck (too large to copy)</li>\n<li>An official Windows Enterprise E3/E5 and F3 licensing source, to settle the Autopatch-on-F3 conflict</li>\n</ul>\n"},"_meta/synapse/dreams":{"id":"_meta/synapse/dreams","title":"Synapse — Dreams","path":"_meta/synapse/DREAMS.md","type":"meta","tags":[],"html":"<h1>Synapse — Dreams</h1>\n"},"_meta/synapse/memory":{"id":"_meta/synapse/memory","title":"Synapse — Memory","path":"_meta/synapse/MEMORY.md","type":"meta","tags":[],"html":"<h1>Synapse — Memory</h1>\n"}}};
    const color = {
      entity: "#74d99f",
      concept: "#dc7f91",
      resource: "#bf9234",
      raw: "#9ca3af",
      meta: "#aa4bd3",
      index: "#aa4bd3",
      log: "#5364d7",
      note: "#66b3df",
      tag: "#66b3df",
      placeholder: "#5364d7",
      asset: "#9ca3af"
    };
    const noteList = document.getElementById("note-list");
    const search = document.getElementById("search");
    const tooltip = document.getElementById("tooltip");
    const drawer = document.getElementById("drawer");
    const notePages = Object.values(graph.pages).sort((a, b) => a.title.localeCompare(b.title));
    const nodeById = new Map(graph.nodes.map(node => [node.id, node]));
    const svg = d3.select("#graph");
    const width = () => svg.node().clientWidth;
    const height = () => svg.node().clientHeight;
    let activeId = null;

    function renderList(filter = "") {
      const needle = filter.trim().toLowerCase();
      noteList.innerHTML = "";
      notePages
        .filter(note => !needle || note.title.toLowerCase().includes(needle) || note.path.toLowerCase().includes(needle))
        .forEach(note => {
          const button = document.createElement("button");
          button.className = "note-button" + (note.id === activeId ? " active" : "");
          button.innerHTML = "<strong>" + escapeHtml(note.title) + "</strong><span class='note-path'>" + escapeHtml(note.path) + "</span>";
          button.addEventListener("click", () => openNote(note.id));
          noteList.appendChild(button);
        });
    }

    function highlightNote(id) {
      if (!graph.pages[id]) return;
      activeId = id;
      location.hash = "note/" + id;
      renderList(search.value);
      node.attr("stroke", d => d.id === id ? "#ffffff" : "transparent")
        .attr("stroke-width", d => d.id === id ? 3 : 0);
    }

    function openNote(id) {
      if (!graph.pages[id]) return;
      highlightNote(id);
      const url = new URL("note.html", location.href);
      url.hash = "note/" + id;
      window.open(url.href, "_blank", "noopener");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    search.addEventListener("input", () => renderList(search.value));
    document.getElementById("toggle-drawer").addEventListener("click", () => {
      drawer.classList.toggle("open");
      if (drawer.classList.contains("open")) search.focus();
    });
    document.getElementById("close-drawer").addEventListener("click", () => drawer.classList.remove("open"));

    const zoomLayer = svg.append("g");
    svg.call(d3.zoom().scaleExtent([0.12, 7]).on("zoom", event => zoomLayer.attr("transform", event.transform)));

    const links = graph.links.map(link => ({ ...link }));
    const nodes = graph.nodes.map(node => ({ ...node }));

    const simulation = d3.forceSimulation(nodes)
      .velocityDecay(0.34)
      .force("link", d3.forceLink(links).id(d => d.id).distance(d => d.type === "tag" ? 105 : 165).strength(0.28))
      .force("charge", d3.forceManyBody().strength(-620).distanceMax(900))
      .force("center", d3.forceCenter(width() / 2, height() / 2))
      .force("collision", d3.forceCollide().radius(d => radius(d) + 18).strength(0.9));

    const link = zoomLayer.append("g")
      .attr("stroke", "rgba(190,200,210,0.35)")
      .attr("stroke-opacity", 0.8)
      .selectAll("line")
      .data(links)
      .join("line")
      .attr("stroke-width", d => d.type === "tag" ? 1 : 1.4);

    const nodeGroup = zoomLayer.append("g").selectAll("g")
      .data(nodes)
      .join("g")
      .style("cursor", d => graph.pages[d.id] ? "pointer" : "default")
      .call(d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended));

    const node = nodeGroup.append("circle")
      .attr("r", radius)
      .attr("fill", d => color[d.type] || color.note)
      .attr("fill-opacity", d => d.kind === "placeholder" ? 0.78 : 1);

    const label = nodeGroup.append("text")
      .text(d => d.label.length > 34 ? d.label.slice(0, 31) + "..." : d.label)
      .attr("x", d => radius(d) + 5)
      .attr("y", "0.35em")
      .attr("fill", d => color[d.type] || color.note)
      .attr("font-size", d => d.kind === "tag" ? 16 : 15)
      .attr("paint-order", "stroke")
      .attr("stroke", "#151719")
      .attr("stroke-width", 4);

    nodeGroup
      .on("click", (event, d) => {
        if (graph.pages[d.id]) openNote(d.id);
      })
      .on("mouseenter", (event, d) => {
        tooltip.style.opacity = 1;
        tooltip.textContent = d.path || d.label;
      })
      .on("mousemove", event => {
        tooltip.style.left = event.clientX + 12 + "px";
        tooltip.style.top = event.clientY + 12 + "px";
      })
      .on("mouseleave", () => {
        tooltip.style.opacity = 0;
      });

    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);
      nodeGroup.attr("transform", d => "translate(" + d.x + "," + d.y + ")");
    });

    function radius(d) {
      const degree = graph.links.filter(link => link.source === d.id || link.target === d.id || link.source.id === d.id || link.target.id === d.id).length;
      return Math.max(7, Math.min(34, 7 + degree * 2.1));
    }

    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }

    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }

    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = event.x;
      d.fy = event.y;
    }

    document.getElementById("reset").addEventListener("click", () => {
      nodes.forEach(d => { d.fx = null; d.fy = null; });
      simulation.force("center", d3.forceCenter(width() / 2, height() / 2));
      simulation.alpha(1).restart();
    });

    window.addEventListener("resize", () => {
      simulation.force("center", d3.forceCenter(width() / 2, height() / 2));
      simulation.alpha(0.5).restart();
    });

    renderList();
    const initialId = location.hash.startsWith("#note/") ? location.hash.replace("#note/", "") : "index";
    if (graph.pages[initialId]) highlightNote(initialId);
  </script>
