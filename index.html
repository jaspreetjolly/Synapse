otes/entities/microsoft-intune","type":"wikilink"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"10-notes/entities/microsoft-intune-suite","type":"wikilink"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"10-notes/concepts/mdm-vs-mam","type":"wikilink"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"10-notes/entities/manageengine","type":"wikilink"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"10-notes/entities/microsoft-defender-for-endpoint","type":"wikilink"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"10-notes/concepts/conditional-access","type":"wikilink"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"40-resources/summary-windows-11-enterprise-feature-map","type":"wikilink"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"40-resources/summary-windows-11-enterprise-l100-deck","type":"wikilink"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"40-resources/summary-windows-11-enterprise-secure-managed-cloud-ready","type":"wikilink"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"40-resources/summary-windows-enterprise-value-prop-intune","type":"wikilink"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"40-resources/summary-windows-enterprise-e3-sellers-training-2023","type":"wikilink"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"40-resources/summary-intune-vs-manageengine","type":"wikilink"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"40-resources/summary-secure-wfh-government-m365-e3","type":"wikilink"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"40-resources/summary-passwordless-journey-2022","type":"wikilink"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"tag:moc","type":"tag"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"tag:windows","type":"tag"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"tag:endpoint","type":"tag"},{"source":"_meta/mocs/moc-windows-and-endpoint-management","target":"tag:intune","type":"tag"}],"pages":{"10-notes/concepts/conditional-access":{"id":"10-notes/concepts/conditional-access","title":"Conditional Access","path":"10-Notes/concepts/conditional-access.md","type":"concept","tags":["identity","security","zero-trust"],"html":"<h1>Conditional Access</h1>\n<p><strong>Idea:</strong> access decisions are policy-driven &#39;if-then&#39; rules over signals such as user, device, location and app, rather than a static allow or deny.</p>\n<ul>\n<li><strong>Delivered by:</strong> <a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1, so it is included in <a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a> and <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a>.</li>\n<li><strong>Pairs with:</strong> MFA (a common control) and device compliance from <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>.</li>\n</ul>\n<p><strong>Now sourced:</strong> the deck lists the signals (user/group membership, IP location, device state, application) and the decisions (allow, require MFA, limit access, force password reset). It also adds Continuous Access Evaluation for near-real-time revocation (<a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a>, slide 13).</p>\n<p><strong>Underpins:</strong> <a href=\"#note/10-notes/concepts/zero-trust\">zero-trust</a> and control 1 of <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>. Also available in <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a>.</p>\n<p><strong>Device grants:</strong> &quot;Require device to be marked as compliant&quot; reads state written by Intune or an onboarded compliance partner (<a href=\"#note/10-notes/concepts/device-compliance-signal-flow\">device-compliance-signal-flow</a>). &quot;Require app protection policy&quot; covers unenrolled BYOD (<a href=\"#note/10-notes/concepts/mdm-vs-mam\">mdm-vs-mam</a>). IP and named locations are Entra ID P1-only location signals, not trust signals (<a href=\"#note/40-resources/summary-intune-vs-manageengine\">summary-intune-vs-manageengine</a>).</p>\n<p>Sources: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>, <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a>, <a href=\"#note/40-resources/summary-intune-vs-manageengine\">summary-intune-vs-manageengine</a></p>\n"},"10-notes/concepts/copilot-security-readiness":{"id":"10-notes/concepts/copilot-security-readiness","title":"Copilot security readiness","path":"10-Notes/concepts/copilot-security-readiness.md","type":"concept","tags":["copilot","security","zero-trust","licensing"],"html":"<h1>Copilot security readiness</h1>\n<p><strong>Idea:</strong> before (or while) rolling out <a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a>, put five <a href=\"#note/10-notes/concepts/zero-trust\">zero-trust</a> controls in place. The licence tier sets how deep each control goes.</p>\n<h2>The five controls (deck, slides 12–18)</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>Control</th>\n<th>Baseline product</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>Govern access to Copilot</td>\n<td><a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1, <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>, MFA, CAE</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Mitigate device risk</td>\n<td><a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> P1: app deployment, app protection, wipe</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Protect against threats</td>\n<td><a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a></td>\n</tr>\n<tr>\n<td>4</td>\n<td>Protect against data loss</td>\n<td><a href=\"#note/10-notes/entities/microsoft-purview\">microsoft-purview</a> DLP for email and files</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Discover AI apps</td>\n<td>Entra Cloud App Discovery (400+ AI apps)</td>\n</tr>\n</tbody></table>\n<h2>Staged rollout</h2>\n<ol>\n<li><strong>Web-grounded prompts first:</strong> Copilot Chat with <a href=\"#note/10-notes/concepts/enterprise-data-protection\">enterprise-data-protection</a>.</li>\n<li><strong>Then Graph-grounded prompts:</strong> <a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a> over organizational data.</li>\n</ol>\n<p>Mature the five controls between the stages.</p>\n<h2>Good / better / best</h2>\n<table>\n<thead>\n<tr>\n<th>Tier</th>\n<th>Positioning</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a></td>\n<td><strong>Baseline:</strong> Conditional Access, DLP for email and files, unified endpoint management</td>\n</tr>\n<tr>\n<td><a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a></td>\n<td><strong>Core / jumping-off point:</strong> + Defender for Office 365 P1 (since July 2026; the deck predates this), manual labels, standard eDiscovery and audit, block risky AI apps on <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a> via <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> P1</td>\n</tr>\n<tr>\n<td><a href=\"#note/10-notes/entities/microsoft-365-e5\">microsoft-365-e5</a></td>\n<td><strong>Best:</strong> Entra ID Protection risk-based access, automatic labels, communication compliance, Defender for Cloud Apps (block or sanction AI apps), Defender XDR</td>\n</tr>\n</tbody></table>\n<p><strong>Talk-track use:</strong> open with &quot;Copilot inherits your existing controls&quot;, then show where the customer sits on the ladder. Detail: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a>.</p>\n"},"10-notes/concepts/device-compliance-signal-flow":{"id":"10-notes/concepts/device-compliance-signal-flow","title":"Device compliance signal flow (Intune → Entra → Conditional Access)","path":"10-Notes/concepts/device-compliance-signal-flow.md","type":"concept","tags":["intune","identity","zero-trust"],"html":"<h1>Device compliance signal flow (Intune → Entra → Conditional Access)</h1>\n<p><strong>Idea:</strong> three decoupled components make the device-based access decision for Microsoft 365.</p>\n<ol>\n<li><strong><a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> evaluates</strong> device health and writes compliant or non-compliant onto the Entra ID device object.</li>\n<li><strong><a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> stores</strong> that state.</li>\n<li><strong><a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a> enforces</strong> it at sign-in with the grant control &quot;Require device to be marked as compliant&quot;. It does <strong>not</strong> call Intune at token time.</li>\n</ol>\n<p><strong>Consequences:</strong></p>\n<ul>\n<li>A UEM that cannot write the state, such as <a href=\"#note/10-notes/entities/manageengine\">manageengine</a>, cannot take part, whatever its posture checks are.</li>\n<li>The <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> risk score flows through the same path (Defender → Intune → Entra → CA) to block a high-risk device automatically.</li>\n<li>On unenrolled BYOD, the equivalent control is &quot;Require app protection policy&quot; (<a href=\"#note/10-notes/concepts/mdm-vs-mam\">mdm-vs-mam</a>).</li>\n</ul>\n<p>Source: <a href=\"#note/40-resources/summary-intune-vs-manageengine\">summary-intune-vs-manageengine</a></p>\n"},"10-notes/concepts/email-and-collaboration-protection-layers":{"id":"10-notes/concepts/email-and-collaboration-protection-layers","title":"Email and collaboration protection layers","path":"10-Notes/concepts/email-and-collaboration-protection-layers.md","type":"concept","tags":["security","email-security"],"html":"<h1>Email and collaboration protection layers</h1>\n<p><strong>Idea:</strong> email and collaboration security comes in layers. Each layer adds detection depth and coverage.</p>\n<ol>\n<li><strong>Baseline: <a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a></strong> (in <a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a> and <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a>): multi-engine anti-malware, anti-spam, DLP.</li>\n<li><strong>Threat protection</strong> (<a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a> P1, <strong>included in O365/M365 E3 since July 2026</strong> and in Business Premium): detonation (Safe Attachments), URL rewriting (Safe Links), impersonation anti-phishing, ZAP, extended to Teams, SharePoint and OneDrive.</li>\n<li><strong>Investigation and response:</strong> real-time detections in P1. <strong>Plan 2 (E5)</strong> adds Threat Explorer, automated investigation and response, attack simulation training and Defender XDR integration (<a href=\"#note/raw/2026-10-19-ms-learn-mdo-service-descriptionref\">raw/2026-10-19-ms-learn-mdo-service-description.ref.md</a>).</li>\n</ol>\n<p>Sources: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>, <a href=\"#note/40-resources/summary-mdo-plan1-feature-map\">summary-mdo-plan1-feature-map</a></p>\n"},"10-notes/concepts/enterprise-data-protection":{"id":"10-notes/concepts/enterprise-data-protection","title":"Enterprise Data Protection (Copilot Chat)","path":"10-Notes/concepts/enterprise-data-protection.md","type":"concept","tags":["copilot","security","privacy"],"html":"<h1>Enterprise Data Protection (Copilot Chat)</h1>\n<p><strong>Idea:</strong> when a user signs in to Microsoft Copilot (web chat) with a work account, the chat runs under enterprise data protection.</p>\n<ul>\n<li>Prompts and responses are not used to train the underlying model.</li>\n<li><del>Chat data is not retained</del> <strong>Outdated.</strong> Under EDP, prompts and responses stay in the M365 service boundary and are <strong>stored in a hidden Substrate folder in the user&#39;s Exchange mailbox</strong> (confirmed by Jaspreet). They are logged, subject to the customer&#39;s retention policies and available for eDiscovery and Purview. The &quot;not saved&quot; wording belonged to the older commercial data protection (<a href=\"#note/40-resources/summary-windows-11-enterprise-l100-deck\">summary-windows-11-enterprise-l100-deck</a>, slide 5). See claim-001.</li>\n<li>Covered by the Data Protection Addendum and Product Terms (GDPR, ISO 27018). Available to anyone signed in with an Entra account, at no extra cost; the specific controls depend on the plan.</li>\n<li><strong>So:</strong> employees can safely include internal data in web-grounded prompts.</li>\n</ul>\n<p>It is included for <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> users. It is distinct from Graph-grounded <a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a>.</p>\n<blockquote>\n<p>[!note] <strong>Resolved:</strong> EDP supersedes commercial data protection and adds logging, retention and eDiscovery (<a href=\"#note/40-resources/summary-windows-11-enterprise-l100-deck\">summary-windows-11-enterprise-l100-deck</a>).</p>\n</blockquote>\n<p><strong>Entry points:</strong> M365 Copilot app (pre-installed on Windows), m365copilot.com, Outlook, Teams, the Edge sidebar, Word, Excel and PowerPoint.</p>\n<blockquote>\n<p>[!warning] The deck&#39;s slide 9 notes say E3 and E5 customers get Copilot &quot;at no additional cost during preview&quot;. That refers to the old preview and is out of date; check current eligibility at aka.ms/Copilot/FAQ.</p>\n</blockquote>\n<p><strong>Rollout:</strong> this is stage 1 of the staged rollout in <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>.</p>\n<p>Sources: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> (slides 8–9, 11), <a href=\"#note/40-resources/summary-windows-11-enterprise-l100-deck\">summary-windows-11-enterprise-l100-deck</a> (slides 5–6)</p>\n"},"10-notes/concepts/m365-licensing-stack":{"id":"10-notes/concepts/m365-licensing-stack","title":"Microsoft 365 licensing stack","path":"10-Notes/concepts/m365-licensing-stack.md","type":"concept","tags":["licensing","modern-work"],"html":"<h1>Microsoft 365 licensing stack</h1>\n<p><strong>Idea:</strong> Microsoft 365 suites are built from smaller suites. Explain them layer by layer, not as one long feature list.</p>\n<table>\n<thead>\n<tr>\n<th>Layer</th>\n<th>E3 component</th>\n<th>Role</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Productivity and compliance</td>\n<td><a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a></td>\n<td>Apps, mail, files, collaboration, baseline DLP and retention</td>\n</tr>\n<tr>\n<td>Identity and endpoint</td>\n<td><a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a></td>\n<td><a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1, <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>, MIP P1</td>\n</tr>\n<tr>\n<td>OS and endpoint security</td>\n<td>ME3 extras</td>\n<td>Windows 11 Enterprise, <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> P1, Universal Print, Loop</td>\n</tr>\n</tbody></table>\n<p><strong>Below E3:</strong> <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> takes the identity and device layer (Entra ID P1, Intune P1) and adds DLP on top of web-only E1. It is a Zero Trust starter for emerging markets.</p>\n<p><strong>Why it matters:</strong> customers with O365 E3 and separate EMS E3 often miss the ME3-only extras. That gap is a common upsell or consolidation talking point. This is my inference, not stated in the source.</p>\n<p>Instances: <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a>, <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> · Sources: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>, <a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a> · Copilot view: <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a></p>\n"},"10-notes/concepts/mdm-vs-mam":{"id":"10-notes/concepts/mdm-vs-mam","title":"MDM vs MAM","path":"10-Notes/concepts/mdm-vs-mam.md","type":"concept","tags":["endpoint","security"],"html":"<h1>MDM vs MAM</h1>\n<p><strong>Idea:</strong> there are two ways to manage endpoints. Pick one per device-ownership scenario.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>MDM</th>\n<th>MAM</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Controls</td>\n<td>Whole device</td>\n<td>Individual apps and their data</td>\n</tr>\n<tr>\n<td>Typical fit</td>\n<td>Corporate-owned devices</td>\n<td>BYOD, unenrolled devices</td>\n</tr>\n<tr>\n<td>Intune features (per source)</td>\n<td>Config profiles, compliance policies, patching, wipe</td>\n<td>App protection policies, Tunnel for MAM</td>\n</tr>\n</tbody></table>\n<h2>Why MAM decides BYOD (<a href=\"#note/40-resources/summary-intune-vs-manageengine\">summary-intune-vs-manageengine</a>)</h2>\n<ul>\n<li><strong>Apple caps MDM by enrolment type.</strong> Only Automated Device Enrollment (supervised, corporate) unlocks the full restriction set; User Enrollment gets a curated list.</li>\n<li><strong>Android Work Profile</strong> separates apps, not <strong>identities</strong>, and does nothing if the user declines enrolment.</li>\n<li><strong>Intune MAM works with no enrolment.</strong> It provides conditional launch, app PIN, selective wipe, <strong>multi-identity</strong> (work vs personal account in the same app), and cut/copy/paste, save-as and screen-capture controls. It is enforced by the CA grant &quot;Require app protection policy&quot;.</li>\n<li><strong>Tunnel for MAM</strong> (per-app VPN on unenrolled iOS and Android) is in <strong>M365 E3 from July 2026</strong> via Intune Plan 2 (<a href=\"#note/10-notes/entities/microsoft-intune-suite\">microsoft-intune-suite</a>).</li>\n</ul>\n<p>Both are delivered by <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>. Related: <a href=\"#note/10-notes/concepts/device-compliance-signal-flow\">device-compliance-signal-flow</a>. Sources: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>, <a href=\"#note/40-resources/summary-intune-vs-manageengine\">summary-intune-vs-manageengine</a></p>\n"},"10-notes/concepts/passwordless-authentication":{"id":"10-notes/concepts/passwordless-authentication","title":"Passwordless authentication","path":"10-Notes/concepts/passwordless-authentication.md","type":"concept","tags":["identity","security","zero-trust"],"html":"<h1>Passwordless authentication</h1>\n<p><strong>Idea:</strong> remove the password as a sign-in factor and replace it with phishing-resistant methods.</p>\n<table>\n<thead>\n<tr>\n<th>Method</th>\n<th>Where</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a href=\"#note/10-notes/entities/windows-hello-for-business\">windows-hello-for-business</a> (PIN or biometric + TPM)</td>\n<td>Windows PCs</td>\n</tr>\n<tr>\n<td>Microsoft Authenticator passwordless</td>\n<td>Mobile</td>\n</tr>\n<tr>\n<td>FIDO2 security keys</td>\n<td>Shared or thin-client devices with no biometrics</td>\n</tr>\n</tbody></table>\n<p><strong>What usually blocks it:</strong></p>\n<ol>\n<li>Apps not yet integrated with <a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> (still on ADFS or legacy auth)</li>\n<li>Devices without biometric hardware, which fall back to PIN or FIDO2</li>\n</ol>\n<p><strong>Why it matters:</strong> MFA blocks about 99% of identity attacks (<a href=\"#note/40-resources/summary-secure-wfh-government-m365-e3\">summary-secure-wfh-government-m365-e3</a>), and passwordless removes the phishable factor entirely. It is part of verify-explicitly in <a href=\"#note/10-notes/concepts/zero-trust\">zero-trust</a>.</p>\n<p>Sources: <a href=\"#note/40-resources/summary-passwordless-journey-2022\">summary-passwordless-journey-2022</a>, <a href=\"#note/40-resources/summary-windows-11-enterprise-l100-deck\">summary-windows-11-enterprise-l100-deck</a></p>\n"},"10-notes/concepts/windows-enterprise-servicing":{"id":"10-notes/concepts/windows-enterprise-servicing","title":"Windows Enterprise servicing model","path":"10-Notes/concepts/windows-enterprise-servicing.md","type":"concept","tags":["windows","updates","endpoint"],"html":"<h1>Windows Enterprise servicing model</h1>\n<p><strong>Idea:</strong> Enterprise turns patching from a project into a managed service with more time and more control.</p>\n<table>\n<thead>\n<tr>\n<th>Lever</th>\n<th>Detail</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Support window</td>\n<td><strong>36 months</strong> per annual feature update, vs 24 on Pro</td>\n</tr>\n<tr>\n<td>Pinning</td>\n<td>Hold a feature update for <strong>up to 3 years (1,060 days)</strong></td>\n</tr>\n<tr>\n<td><a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch</a></td>\n<td>Microsoft-managed rings, health gates, pause and rollback; now includes the WUfB deployment service</td>\n</tr>\n<tr>\n<td>Expedite</td>\n<td>Bypass rings and deferrals for a zero-day KB; fleet compliant in hours</td>\n</tr>\n<tr>\n<td>Hotpatch</td>\n<td>Monthly security fixes applied in memory with no reboot</td>\n</tr>\n<tr>\n<td>Reports</td>\n<td>Release health, device readiness, compatibility risks</td>\n</tr>\n<tr>\n<td>Connected Cache</td>\n<td>Local caching for low-bandwidth sites</td>\n</tr>\n</tbody></table>\n<blockquote>\n<p>[!warning] <strong>Do not mix the efficiency figures.</strong> The decks quote three different Autopatch numbers. Name the source each time:</p>\n<ul>\n<li>50–70% IT efficiency (Secure, Managed, Cloud-Ready)</li>\n<li>60–80% less patching time (Forrester TEI 2024)</li>\n<li>45% / 95% / 80% for monthly, feature and reporting effort (Forrester projected TEI 2023)</li>\n</ul>\n</blockquote>\n<p>Sources: <a href=\"#note/40-resources/summary-windows-11-enterprise-secure-managed-cloud-ready\">summary-windows-11-enterprise-secure-managed-cloud-ready</a>, <a href=\"#note/40-resources/summary-windows-11-enterprise-l100-deck\">summary-windows-11-enterprise-l100-deck</a>, <a href=\"#note/40-resources/summary-windows-enterprise-e3-sellers-training-2023\">summary-windows-enterprise-e3-sellers-training-2023</a></p>\n"},"10-notes/concepts/windows-virtualization-rights":{"id":"10-notes/concepts/windows-virtualization-rights","title":"Windows Enterprise virtualization rights","path":"10-Notes/concepts/windows-virtualization-rights.md","type":"concept","tags":["windows","licensing","vdi"],"html":"<h1>Windows Enterprise virtualization rights</h1>\n<p><strong>Idea:</strong> Windows Enterprise E3 is <strong>per user</strong>. Each user may run up to <strong>5 Windows instances</strong> at once, physical or virtual. VDI access rights are included, so no extra CALs are needed.</p>\n<ul>\n<li><strong>Instances:</strong> local <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a>, Windows 365 Cloud PC, Azure Virtual Desktop, on-premises VDI under VDA, and LTSC for special-purpose devices.</li>\n<li><strong>Contrast:</strong><ul>\n<li>Windows Pro is a <strong>device</strong> licence with no VDI rights.</li>\n<li>Enterprise + Software Assurance is per device, with VDA only (no AVD or W365 rights, no cloud services).</li>\n</ul>\n</li>\n<li><strong>Customer question:</strong> &quot;Do you buy CALs for your VDI?&quot;</li>\n</ul>\n<p>Sources: <a href=\"#note/40-resources/summary-windows-11-enterprise-l100-deck\">summary-windows-11-enterprise-l100-deck</a>, <a href=\"#note/40-resources/summary-windows-enterprise-e3-sellers-training-2023\">summary-windows-enterprise-e3-sellers-training-2023</a></p>\n"},"10-notes/concepts/zero-trust":{"id":"10-notes/concepts/zero-trust","title":"Zero Trust","path":"10-Notes/concepts/zero-trust.md","type":"concept","tags":["security","zero-trust"],"html":"<h1>Zero Trust</h1>\n<p><strong>Idea:</strong> a security strategy, not a product, built on three principles: <strong>verify explicitly, use least-privilege access, assume breach</strong>. In short: &quot;never trust, always verify&quot;.</p>\n<ul>\n<li><strong>Microsoft&#39;s AI framing:</strong> security recommendations for AI are anchored in Zero Trust, and building those protections now prepares a tenant for Copilot.</li>\n<li><strong>In M365:</strong> identity (<a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a>, <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>), devices (<a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>), threats (<a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a>, <a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a>, <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a>), data (<a href=\"#note/10-notes/entities/microsoft-purview\">microsoft-purview</a>) and apps (Cloud App Discovery).</li>\n<li><strong>Applied to Copilot:</strong> <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a></li>\n<li><strong>Applied to work-from-home in M365 E3:</strong> <a href=\"#note/40-resources/summary-secure-wfh-government-m365-e3\">summary-secure-wfh-government-m365-e3</a>. Note that deck wrongly maps Identity Protection and just-in-time access to E3.</li>\n<li><strong>On the device:</strong> <a href=\"#note/10-notes/entities/windows-hello-for-business\">windows-hello-for-business</a>, Credential Guard, TPM 2.0 (<a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a>); <a href=\"#note/10-notes/concepts/device-compliance-signal-flow\">device-compliance-signal-flow</a>; <a href=\"#note/10-notes/concepts/passwordless-authentication\">passwordless-authentication</a></li>\n</ul>\n<p>Source: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> (slide 11 notes)</p>\n"},"10-notes/entities/copilot-plus-pc":{"id":"10-notes/entities/copilot-plus-pc","title":"Copilot+ PC","path":"10-Notes/entities/copilot-plus-pc.md","type":"entity","tags":["product","windows","hardware","ai"],"html":"<h1>Copilot+ PC</h1>\n<p>A Windows 11 PC class with a <strong>40+ TOPS NPU</strong>. Microsoft claims it is 5x faster than 5-year-old PCs (Cinebench 24 multi-core) and has Secured-core and <strong>Microsoft Pluton</strong> security by default.</p>\n<ul>\n<li><strong>AI features:</strong> Recall (preview), Click to Do, Studio Effects, Live Captions (40+ languages).</li>\n<li><strong>Management:</strong> works with existing tools. It can step up from Pro to <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a>, which unlocks advanced policies such as Recall controls.</li>\n</ul>\n<p>Source: <a href=\"#note/40-resources/summary-windows-11-enterprise-l100-deck\">summary-windows-11-enterprise-l100-deck</a></p>\n"},"10-notes/entities/ems-e3":{"id":"10-notes/entities/ems-e3","title":"Enterprise Mobility + Security E3","path":"10-Notes/entities/ems-e3.md","type":"entity","tags":["product","licensing","security"],"html":"<h1>Enterprise Mobility + Security E3</h1>\n<p>The identity and endpoint layer of <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a>.</p>\n<ul>\n<li><p><strong>Identity:</strong> <a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1</p>\n</li>\n<li><p><strong>Endpoint:</strong> <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>, plus Remote Help and Advanced Endpoint Analytics as listed in the source map</p>\n</li>\n<li><p><strong>Information protection:</strong> MIP Plan 1 (manual labeling)</p>\n</li>\n<li><p><strong>Rights:</strong> Windows Server CAL rights</p>\n</li>\n<li><p><strong>Since July 2026:</strong> Intune <strong>Plan 2</strong> (Tunnel for MAM, FOTA, specialty devices), <strong>Remote Help</strong> and <strong>Advanced Analytics</strong> are included (<a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map#claim-004</a>).</p>\n</li>\n</ul>\n<p>Sources: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>, <a href=\"#note/40-resources/summary-intune-vs-manageengine\">summary-intune-vs-manageengine</a></p>\n"},"10-notes/entities/exchange-online-protection":{"id":"10-notes/entities/exchange-online-protection","title":"Exchange Online Protection","path":"10-Notes/entities/exchange-online-protection.md","type":"entity","tags":["product","security","email-security"],"html":"<h1>Exchange Online Protection</h1>\n<p>Microsoft&#39;s cloud email filtering service against spam, malware, phishing and other email threats. It is the baseline in every Exchange Online plan, including <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> and <a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a>.</p>\n<ul>\n<li><strong>Layer 1</strong> of <a href=\"#note/10-notes/concepts/email-and-collaboration-protection-layers\">email-and-collaboration-protection-layers</a>; <a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a> builds on top of it.</li>\n<li><strong>Step 3</strong> (&quot;protect against threats&quot;) in the E1 Plus Copilot journey (<a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>).</li>\n</ul>\n<p>Sources: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a>, <a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a></p>\n"},"10-notes/entities/manageengine":{"id":"10-notes/entities/manageengine","title":"ManageEngine (Endpoint Central / MDM)","path":"10-Notes/entities/manageengine.md","type":"entity","tags":["vendor","competitor","endpoint"],"html":"<h1>ManageEngine (Endpoint Central / MDM)</h1>\n<p>A third-party UEM vendor, often met as a competitor to <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>.</p>\n<ul>\n<li><strong>Strengths (conceded):</strong> zero-touch enrolment (ABM, Android Zero-Touch, Knox), supervised iOS and Android Enterprise update policies, root and jailbreak detection, Play Integrity, kiosk and COSU, containerisation, Conditional Exchange Access, MTD integrations, broad OS coverage (Chrome OS, tvOS, rugged devices), Endpoint Central patching. It can also block a second Outlook account via the documented Intune MAM keys.</li>\n<li><strong>Gap:</strong> not an onboarded Microsoft compliance partner. It cannot write compliance state to Entra ID, so there is no require-compliant-device <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a> on Android or iOS. It also offers nothing on unenrolled BYOD and no multi-identity. See <a href=\"#note/10-notes/concepts/device-compliance-signal-flow\">device-compliance-signal-flow</a>.</li>\n<li><strong>Positioning:</strong> recommend co-existence for specialist estates; otherwise consolidate on Intune.</li>\n</ul>\n<p>Source: <a href=\"#note/40-resources/summary-intune-vs-manageengine\">summary-intune-vs-manageengine</a></p>\n"},"10-notes/entities/microsoft-365-copilot":{"id":"10-notes/entities/microsoft-365-copilot","title":"Microsoft 365 Copilot","path":"10-Notes/entities/microsoft-365-copilot.md","type":"entity","tags":["product","copilot","ai"],"html":"<h1>Microsoft 365 Copilot</h1>\n<p>An AI assistant that combines LLMs with the user&#39;s data in Microsoft Graph and works inside the M365 apps, <strong>within the Microsoft 365 compliance boundary</strong>.</p>\n<ul>\n<li><strong>Licensing:</strong> an add-on to Office 365 E1–E5 and Microsoft 365 E3/E5. The base plan determines which security and compliance controls apply (<a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>).</li>\n<li><strong>Permissions:</strong> Copilot only accesses data the user already has permission to view, so oversharing becomes visible. Interactions are logged for audit.</li>\n<li><strong>Distinct from:</strong> Microsoft Copilot (free web chat) with <a href=\"#note/10-notes/concepts/enterprise-data-protection\">enterprise-data-protection</a>, which is included with E1 Plus.</li>\n<li><strong>Price and scope</strong> (L100 notes): $30 per user per month. Users toggle between &quot;web&quot; (Copilot Chat) and &quot;work&quot; (Graph-grounded) scope. 1,000+ plugins and connectors. Copilot Chat agents can be metered (pay as you go).</li>\n<li><strong>Hardware:</strong> <a href=\"#note/10-notes/entities/copilot-plus-pc\">copilot-plus-pc</a></li>\n<li><strong>Prepare with:</strong> <a href=\"#note/10-notes/concepts/zero-trust\">zero-trust</a> controls; roll out web-grounded prompts first, then Graph-grounded (<a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>).</li>\n</ul>\n<p>Source: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> · MOC: <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a></p>\n"},"10-notes/entities/microsoft-365-e3":{"id":"10-notes/entities/microsoft-365-e3","title":"Microsoft 365 E3","path":"10-Notes/entities/microsoft-365-e3.md","type":"entity","tags":["product","licensing","modern-work"],"html":"<h1>Microsoft 365 E3</h1>\n<p>Microsoft&#39;s enterprise bundle of productivity, identity, endpoint management and baseline security.</p>\n<ul>\n<li><strong>Made of:</strong> <a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a> + <a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a> + ME3-only extras (Windows 11 Enterprise, <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> P1, Universal Print, Loop). See <a href=\"#note/10-notes/concepts/m365-licensing-stack\">m365-licensing-stack</a>.</li>\n<li><strong>July 2026 uplift:</strong> <a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a> P1 (via O365 E3), plus Intune Plan 2, Remote Help and Advanced Analytics (via EMS E3). See <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>.</li>\n<li><strong>Detail:</strong> <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a></li>\n<li><strong>Windows:</strong> <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a> (detail in <a href=\"#note/40-resources/summary-windows-11-enterprise-feature-map\">summary-windows-11-enterprise-feature-map</a>)</li>\n<li><strong>Copilot positioning:</strong> the &quot;core / jumping-off point&quot; for <a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a> security. It sits above <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> (baseline) and below M365 E5. See <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>.</li>\n<li><strong>Customer pitch example:</strong> secure work-from-home for a government customer (<a href=\"#note/40-resources/summary-secure-wfh-government-m365-e3\">summary-secure-wfh-government-m365-e3</a>). Watch its E5-only items listed as E3 (claim-001 there).</li>\n<li><strong>MOC:</strong> <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a> · <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a> · <a href=\"#note/_meta/mocs/moc-windows-and-endpoint-management\">moc-windows-and-endpoint-management</a></li>\n</ul>\n"},"10-notes/entities/microsoft-365-e5":{"id":"10-notes/entities/microsoft-365-e5","title":"Microsoft 365 E5","path":"10-Notes/entities/microsoft-365-e5.md","type":"entity","tags":["product","licensing","security","compliance"],"html":"<h1>Microsoft 365 E5</h1>\n<p>Microsoft&#39;s top enterprise suite. It is the &quot;best-in-class&quot; tier for Copilot security in <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>, above <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> and <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a>.</p>\n<h2>What E5 adds over E3 (per deck slides 21 and 25)</h2>\n<table>\n<thead>\n<tr>\n<th>Area</th>\n<th>E5 capability</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Identity</td>\n<td>Entra ID Protection: user and sign-in risk in <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>; access reviews; PIM for just-in-time admin</td>\n</tr>\n<tr>\n<td>Data</td>\n<td><a href=\"#note/10-notes/entities/microsoft-purview\">microsoft-purview</a> automatic sensitivity and retention labels; risk-adaptive controls; communication compliance; premium eDiscovery and audit; DKE; trainable classifiers; DLP extended to endpoints and Teams</td>\n</tr>\n<tr>\n<td>AI apps</td>\n<td>Defender for Cloud Apps: discover, then <strong>block or sanction</strong> 400+ AI apps</td>\n</tr>\n<tr>\n<td>Threats</td>\n<td>Microsoft Defender XDR across endpoints, identity, cloud apps, email and files</td>\n</tr>\n</tbody></table>\n<h2>Intune in E5 (since July 2026)</h2>\n<p>Everything in E3 (Intune Plan 2, Remote Help, Advanced Analytics), <strong>plus Endpoint Privilege Management, Microsoft Cloud PKI and Enterprise Application Management</strong> (<a href=\"#note/10-notes/entities/microsoft-intune-suite\">microsoft-intune-suite</a>).</p>\n<h2>Identity: P1 vs P2</h2>\n<p>See the table on <a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a>. E5 adds risk-based CA, automated risk remediation and PIM / JIT role activation.</p>\n<blockquote>\n<p>[!question] This page rests only on a Copilot-focused deck. Ingest an E5 service description or mind map to confirm the full feature set, including Defender for Office 365 P2 and Defender for Endpoint P2.</p>\n</blockquote>\n<p>Source: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> · MOCs: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a> · <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a></p>\n"},"10-notes/entities/microsoft-defender-for-endpoint":{"id":"10-notes/entities/microsoft-defender-for-endpoint","title":"Microsoft Defender for Endpoint","path":"10-Notes/entities/microsoft-defender-for-endpoint.md","type":"entity","tags":["product","security","endpoint"],"html":"<h1>Microsoft Defender for Endpoint</h1>\n<p>Microsoft&#39;s endpoint security platform. <strong>Plan 1</strong> ships in <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> as an ME3-only feature.</p>\n<p><strong>P1 capabilities (per source):</strong> attack surface reduction, web protection and filtering, device control (USB), centralised AV management.</p>\n<ul>\n<li><strong>Pairs with:</strong> <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> for device management.</li>\n</ul>\n<p><strong>Copilot role (M365 E3):</strong> antimalware, web and network protection, and manual blocking of discovered risky AI apps on <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a> devices. M365 E5 moves this to XDR (<a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>).</p>\n<p>Sources: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>, <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> · MOC: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a></p>\n"},"10-notes/entities/microsoft-defender-for-office-365":{"id":"10-notes/entities/microsoft-defender-for-office-365","title":"Microsoft Defender for Office 365","path":"10-Notes/entities/microsoft-defender-for-office-365.md","type":"entity","tags":["product","security","email-security"],"html":"<h1>Microsoft Defender for Office 365</h1>\n<p>Microsoft&#39;s threat protection for email and collaboration (Exchange, Teams, SharePoint, OneDrive). This page covers <strong>Plan 1</strong>.</p>\n<ul>\n<li><strong>Protection:</strong> Safe Attachments, Safe Links, impersonation anti-phishing, ZAP, all extended to Teams</li>\n<li><strong>Investigation:</strong> real-time detections and reports</li>\n<li><strong>Admin:</strong> preset policies, Configuration Analyzer, Tenant Allow/Block List</li>\n<li><strong>Licensing (Microsoft Learn service description):</strong><ul>\n<li><strong>Plan 1:</strong> Microsoft 365 Business Premium, and <strong>since 1 July 2026, Office 365 E3 and Microsoft 365 E3</strong>. E3 gets Plan 1 capabilities only.</li>\n<li><strong>Plan 2:</strong> Microsoft 365 E5, A5 and G5. Adds Threat Explorer, threat trackers, campaign views, automated investigation and response, attack simulation training, and Defender XDR integration.</li>\n</ul>\n</li>\n<li><strong>E3 tenants after the change:</strong> Microsoft applies the <strong>Built-in protection</strong> preset automatically. <strong>Standard and Strict presets must be enabled manually</strong>, so review the anti-phishing and Safe Links policies. If a tenant shows Real-time detections but not Threat Explorer, it is on Plan 1.</li>\n<li><strong>Positioning:</strong> sits on top of the anti-spam and anti-malware baseline in <a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a>. See <a href=\"#note/10-notes/concepts/email-and-collaboration-protection-layers\">email-and-collaboration-protection-layers</a>.</li>\n</ul>\n<p>Sources: <a href=\"#note/40-resources/summary-mdo-plan1-feature-map\">summary-mdo-plan1-feature-map</a>, <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>, <a href=\"#note/raw/2026-10-19-ms-learn-mdo-service-descriptionref\">raw/2026-10-19-ms-learn-mdo-service-description.ref.md</a></p>\n"},"10-notes/entities/microsoft-entra-id":{"id":"10-notes/entities/microsoft-entra-id","title":"Microsoft Entra ID","path":"10-Notes/entities/microsoft-entra-id.md","type":"entity","tags":["product","identity","security"],"html":"<h1>Microsoft Entra ID</h1>\n<p>Microsoft&#39;s cloud identity service. <strong>Plan 1</strong> ships in <a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a>.</p>\n<p><strong>P1 capabilities (per source):</strong> <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>, MFA, SSO, hybrid self-service password reset, group-based access (dynamic groups, licensing, app access), Application Proxy for on-premises web apps, password protection (global and custom banned lists, spray defence, AD DS), Cloud App Discovery (shadow IT).</p>\n<p><strong>Also in:</strong> <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> (same P1 feature set, per <a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a>).</p>\n<p><strong>Copilot role</strong> (control 1 of <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>): a single managed identity; <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a> evaluates user, group, IP location, device state and app; Continuous Access Evaluation (CAE) revokes tokens on critical events: user termination, password change or reset, network location change, token revocation. Policy is enforced without waiting for the token to expire. P1 also defends against password spray, replay and phishing. Cloud App Discovery assesses 400+ AI apps from uploaded network logs.</p>\n<p><strong>Above P1 (in <a href=\"#note/10-notes/entities/microsoft-365-e5\">microsoft-365-e5</a>):</strong> Entra ID Protection feeds user and sign-in risk into Conditional Access.</p>\n<h2>P1 (M365 E3) vs P2 (M365 E5)</h2>\n<table>\n<thead>\n<tr>\n<th>Capability</th>\n<th>Entra ID P1 / M365 E3</th>\n<th>Entra ID P2 / M365 E5</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Identity Protection visibility</td>\n<td>✅ Limited</td>\n<td>✅ Full</td>\n</tr>\n<tr>\n<td>Risky-user information</td>\n<td>✅ Limited data</td>\n<td>✅ Full risk details</td>\n</tr>\n<tr>\n<td>Risk-based Conditional Access (user risk or sign-in risk)</td>\n<td>❌</td>\n<td>✅</td>\n</tr>\n<tr>\n<td>Automated risk remediation</td>\n<td>❌</td>\n<td>✅</td>\n</tr>\n<tr>\n<td>Time-limited user access, e.g. Temporary Access Pass</td>\n<td>✅</td>\n<td>✅</td>\n</tr>\n<tr>\n<td>PIM / JIT privileged role activation</td>\n<td>❌</td>\n<td>✅</td>\n</tr>\n</tbody></table>\n<p>The risk-based and privileged-access rows are the E3 → E5 identity upgrade story (<a href=\"#note/10-notes/entities/microsoft-365-e5\">microsoft-365-e5</a>). Source: Jaspreet&#39;s ruling, <a href=\"#note/raw/2026-10-19-jaspreet-rulings-licensing\">raw/2026-10-19-jaspreet-rulings-licensing.md</a>.</p>\n<p>Sources: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>, <a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a>, <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> · MOC: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a> · <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a></p>\n"},"10-notes/entities/microsoft-intune-suite":{"id":"10-notes/entities/microsoft-intune-suite","title":"Microsoft Intune Suite","path":"10-Notes/entities/microsoft-intune-suite.md","type":"entity","tags":["product","endpoint","licensing","add-on"],"html":"<h1>Microsoft Intune Suite</h1>\n<p>A bundle of advanced Intune capabilities on top of Intune Plan 1. <strong>Since July 2026 (rollout complete about 1 Aug 2026), most of it is included in M365 suites:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Capability</th>\n<th>M365 E3</th>\n<th>M365 E5</th>\n<th>Otherwise</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Intune Plan 2: <strong>Tunnel for MAM</strong>, FOTA, specialty devices (AR/VR, meeting rooms)</td>\n<td>✅</td>\n<td>✅</td>\n<td>Plan 2 / Suite</td>\n</tr>\n<tr>\n<td>Remote Help</td>\n<td>✅</td>\n<td>✅</td>\n<td>Suite</td>\n</tr>\n<tr>\n<td>Advanced Analytics</td>\n<td>✅</td>\n<td>✅</td>\n<td>Suite</td>\n</tr>\n<tr>\n<td>Endpoint Privilege Management (Windows)</td>\n<td>❌</td>\n<td>✅</td>\n<td>Suite / add-on</td>\n</tr>\n<tr>\n<td>Microsoft Cloud PKI</td>\n<td>❌</td>\n<td>✅</td>\n<td>Suite / add-on</td>\n</tr>\n<tr>\n<td>Enterprise Application Management</td>\n<td>❌</td>\n<td>✅</td>\n<td>Suite / add-on</td>\n</tr>\n</tbody></table>\n<p>Customers already paying for the Suite should review it at their next renewal.</p>\n<blockquote>\n<p>[!note] The Intune-vs-ManageEngine deck (Sept 2026) still says Tunnel and Cloud PKI are &quot;not in E3 or E5&quot;. That is now <strong>out of date</strong>: Tunnel is in E3, and Cloud PKI is in E5.</p>\n</blockquote>\n<p>Sources: <a href=\"#note/raw/2026-10-19-intune-advanced-capabilities-e3-e5ref\">raw/2026-10-19-intune-advanced-capabilities-e3-e5.ref.md</a> · <a href=\"#note/raw/2026-10-19-jaspreet-rulings-licensing\">raw/2026-10-19-jaspreet-rulings-licensing.md</a> · Related: <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> · <a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a> · <a href=\"#note/10-notes/entities/microsoft-365-e5\">microsoft-365-e5</a></p>\n"},"10-notes/entities/microsoft-intune":{"id":"10-notes/entities/microsoft-intune","title":"Microsoft Intune","path":"10-Notes/entities/microsoft-intune.md","type":"entity","tags":["product","endpoint","security"],"html":"<h1>Microsoft Intune</h1>\n<p>Microsoft&#39;s endpoint and app management service, included via <a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a>.</p>\n<p><strong>Capabilities (per source):</strong> MDM across platforms, MAM, device configuration profiles, app protection policies, patch management (Windows, Mac, Android, iOS), compliance policies, remote actions such as wipe, Tunnel for MAM (per-app VPN without enrollment), specialty devices (AR/VR headsets), FOTA, Remote Help, Advanced Endpoint Analytics.</p>\n<ul>\n<li><strong>Concept:</strong> <a href=\"#note/10-notes/concepts/mdm-vs-mam\">mdm-vs-mam</a></li>\n<li><strong>Works with:</strong> <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a> through <a href=\"#note/10-notes/concepts/device-compliance-signal-flow\">device-compliance-signal-flow</a>.</li>\n</ul>\n<p><strong>Plan 1 also in:</strong> <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a>.</p>\n<p><strong>Copilot role</strong> (control 2 of <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>): deploy and update M365 apps; restrict work apps, including Copilot, on personal devices; app protection blocks saving Copilot-generated files to unmanaged apps and copy-paste to non-work apps; wipe work content if a device is lost.</p>\n<p><strong>Windows:</strong> rotates BitLocker keys for <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a>; surfaces Enterprise-only update controls such as pinning, Expedite, Hotpatch and readiness reports (<a href=\"#note/40-resources/summary-windows-enterprise-value-prop-intune\">summary-windows-enterprise-value-prop-intune</a>).</p>\n<p><strong>Plans:</strong> <strong>Plan 1</strong> is in E1 Plus, Business Premium, E3 and E5. <strong>Since July 2026, M365 E3 also includes Plan 2</strong> (Tunnel for MAM, FOTA, specialty devices), <strong>Remote Help</strong> and <strong>Advanced Analytics</strong>. <strong>E5 adds</strong> EPM, Cloud PKI and Enterprise App Management. See <a href=\"#note/10-notes/entities/microsoft-intune-suite\">microsoft-intune-suite</a>.</p>\n<p><strong>Why Intune for M365 data:</strong> it is the evaluator in <a href=\"#note/10-notes/concepts/device-compliance-signal-flow\">device-compliance-signal-flow</a> and the only MAM with multi-identity. The competitive argument against <a href=\"#note/10-notes/entities/manageengine\">manageengine</a> is in <a href=\"#note/40-resources/summary-intune-vs-manageengine\">summary-intune-vs-manageengine</a>.</p>\n<p>Sources: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>, <a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a>, <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a></p>\n"},"10-notes/entities/microsoft-purview":{"id":"10-notes/entities/microsoft-purview","title":"Microsoft Purview","path":"10-Notes/entities/microsoft-purview.md","type":"entity","tags":["product","security","compliance"],"html":"<h1>Microsoft Purview</h1>\n<p>Microsoft&#39;s data security and compliance family: DLP, information protection (sensitivity labels), retention, eDiscovery, audit and communication compliance.</p>\n<table>\n<thead>\n<tr>\n<th>Tier</th>\n<th>Copilot-relevant capability (deck, slide 25)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a></td>\n<td>DLP for email and files; standard audit</td>\n</tr>\n<tr>\n<td><a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a></td>\n<td>+ manual sensitivity labels (MIP P1), label inheritance in Copilot output, standard eDiscovery and retention</td>\n</tr>\n<tr>\n<td>M365 E5</td>\n<td>+ automatic labelling, endpoint and Teams DLP, premium eDiscovery and audit, communication compliance, DKE, trainable classifiers</td>\n</tr>\n</tbody></table>\n<p><strong>Labelling rule:</strong> <strong>manual</strong> sensitivity labelling = AIP / MIP <strong>Plan 1</strong> (M365 E3). <strong>Automatic</strong> labelling = AIP <strong>Plan 2</strong> (M365 E5). Confirmed by Jaspreet (<a href=\"#note/raw/2026-10-19-jaspreet-rulings-licensing\">raw/2026-10-19-jaspreet-rulings-licensing.md</a>).</p>\n<p>Sources: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a>, <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a></p>\n"},"10-notes/entities/office-365-e1-plus":{"id":"10-notes/entities/office-365-e1-plus","title":"Office 365 E1 Plus","path":"10-Notes/entities/office-365-e1-plus.md","type":"entity","tags":["product","licensing","modern-work","security"],"html":"<h1>Office 365 E1 Plus</h1>\n<p>An Office 365 E1 promo bundle that adds <strong><a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1, <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> P1 and Office 365 DLP</strong>. It is sold only in selected emerging markets.</p>\n<ul>\n<li><strong>Position:</strong> the &quot;baseline security&quot; tier for Copilot readiness, below <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> (<a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>).</li>\n<li><strong>Productivity:</strong> Office for the web only; 50 GB mailbox + 50 GB archive; 1 TB OneDrive.</li>\n<li><strong>Security:</strong> EOP anti-malware and anti-spam (<a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a>), DLP for email and files, manual retention labels, Cloud App Discovery via Entra ID P1.</li>\n<li><strong>AI:</strong> Microsoft Copilot (free web chat) with <a href=\"#note/10-notes/concepts/enterprise-data-protection\">enterprise-data-protection</a>. <a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a> is an add-on.</li>\n<li><strong>Not included (slide 7 table):</strong> desktop Office apps, Purview P1 classification and encryption, Windows Enterprise, Defender for Endpoint P1.</li>\n<li><strong>Over plain O365 E1:</strong> adds Intune P1 (E1 has Basic), Office 365 DLP and Entra ID P1. Storage and mailbox sizes are the same.</li>\n</ul>\n<blockquote>\n<p>[!warning] Teams inclusion conflicts between the sources. The map lists Teams; the deck says it is a separate purchase for net-new customers.</p>\n</blockquote>\n<p>Sources: <a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a>, <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> · MOC: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a></p>\n"},"10-notes/entities/office-365-e3":{"id":"10-notes/entities/office-365-e3","title":"Office 365 E3","path":"10-Notes/entities/office-365-e3.md","type":"entity","tags":["product","licensing","modern-work"],"html":"<h1>Office 365 E3</h1>\n<p>The productivity and baseline compliance layer of <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a>.</p>\n<ul>\n<li><strong>Workloads:</strong> Office apps, Exchange Online (100 GB mailbox, 1.5 TB archive), OneDrive (1 TB default, 5 TB maximum; see <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map#claim-002</a>), SharePoint, Teams, seeded Viva, Stream, Planner, Forms, Lists, Clipchamp, Power Platform with standard connectors.</li>\n<li><strong>Security and compliance:</strong> DLP, anti-malware, anti-spam, eDiscovery, retention, Litigation Hold. See <a href=\"#note/10-notes/concepts/email-and-collaboration-protection-layers\">email-and-collaboration-protection-layers</a>.</li>\n<li><strong>Threat protection:</strong> <a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a> <strong>Plan 1</strong>, included since <strong>1 July 2026</strong> (<a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map#claim-005</a>). Before that date, O365 E3 had only the <a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a> baseline.</li>\n</ul>\n<p>Source: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a></p>\n"},"10-notes/entities/universal-print":{"id":"10-notes/entities/universal-print","title":"Universal Print","path":"10-Notes/entities/universal-print.md","type":"entity","tags":["product","windows","cloud-service"],"html":"<h1>Universal Print</h1>\n<p>Microsoft 365 cloud print service.</p>\n<ul>\n<li><strong>What it does:</strong> no on-premises print servers or drivers; printers are Entra ID-registered; secure release by PIN, QR code, badge or the M365 app; usage monitoring; printing from any OS or the web.</li>\n<li><strong>Licensing:</strong> included with <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a> (E3 and E5). The E3 mind map says <strong>100 jobs per month</strong> (<a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>).</li>\n<li><strong>Value:</strong> the Forrester TEI claims 20% lower printer maintenance spend.</li>\n</ul>\n<p>Sources: <a href=\"#note/40-resources/summary-windows-11-enterprise-l100-deck\">summary-windows-11-enterprise-l100-deck</a>, <a href=\"#note/40-resources/summary-windows-11-enterprise-secure-managed-cloud-ready\">summary-windows-11-enterprise-secure-managed-cloud-ready</a></p>\n"},"10-notes/entities/windows-11-enterprise":{"id":"10-notes/entities/windows-11-enterprise","title":"Windows 11 Enterprise","path":"10-Notes/entities/windows-11-enterprise.md","type":"entity","tags":["product","endpoint","security","licensing"],"html":"<h1>Windows 11 Enterprise</h1>\n<p>The enterprise edition of Windows 11, included in <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> as an ME3-only feature.</p>\n<ul>\n<li><strong>Rights:</strong> up to 5 Windows environments per user (local, AVD, Windows 365, on-premises VDI)</li>\n<li><strong>Servicing:</strong> <a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch</a>, 36-month support, feature-update <strong>pinning up to 3 years (1,060 days)</strong>, expedited updates, Hotpatch</li>\n<li><strong>Security:</strong> Credential Guard, Personal Data Encryption, advanced BitLocker management through <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> with keys escrowed in <a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a></li>\n<li><strong>Other:</strong> quick machine recovery, Always-on VPN, Universal Print, Organizational Messages</li>\n<li><strong>Copilot relevance:</strong> in M365 E3, risky AI apps are blocked on Windows 11 devices via <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> P1 (<a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a>)</li>\n</ul>\n<h2>Added from the Windows folder decks</h2>\n<ul>\n<li><strong>Licence model:</strong> per user; 5 instances; upgrades Pro, not Home; reverts to Pro within 90 days of lapse; downgrade rights; LTSC included, IoT not. See <a href=\"#note/10-notes/concepts/windows-virtualization-rights\">windows-virtualization-rights</a>.</li>\n<li><strong>Pro vs Enterprise datasheet:</strong> <a href=\"#note/40-resources/summary-windows-11-enterprise-secure-managed-cloud-ready\">summary-windows-11-enterprise-secure-managed-cloud-ready</a></li>\n<li><strong>Servicing:</strong> <a href=\"#note/10-notes/concepts/windows-enterprise-servicing\">windows-enterprise-servicing</a></li>\n<li><strong>Identity:</strong> <a href=\"#note/10-notes/entities/windows-hello-for-business\">windows-hello-for-business</a> is on <strong>Pro too</strong>. Credential Guard (with Remote Credential Guard) and PDE are Enterprise-only.</li>\n<li><strong>AI:</strong> works with <a href=\"#note/10-notes/entities/copilot-plus-pc\">copilot-plus-pc</a> and Copilot Chat; Enterprise unlocks Recall policy controls.</li>\n<li><strong>Point-in-time restore (PITR):</strong> rolls the whole system back to a local VSS restore point from the <strong>last 72 hours</strong> (default every 24 hours), from WinRE, in minutes. <strong>Configuring frequency and retention is Enterprise-only</strong>; on/off and the space cap are on all editions. It is off by default on managed devices. A BitLocker recovery key is needed to restore. OneDrive data is unaffected; local changes made after the restore point are lost. It is not System Restore or File History. See <a href=\"#note/raw/2026-10-19-ms-learn-point-in-time-restoreref\">raw/2026-10-19-ms-learn-point-in-time-restore.ref.md</a>.</li>\n<li><strong>Windows E5:</strong> Enterprise E3 + Defender for Endpoint P2.</li>\n</ul>\n<blockquote>\n<p>[!warning] <strong>Always-On VPN user tunnel</strong> (claim-001): the 2023 and L100 datasheets list only the <strong>device tunnel</strong> as Enterprise. General knowledge: the user tunnel also works on Pro. Treat the device tunnel as the differentiator.</p>\n</blockquote>\n<blockquote>\n<p>[!warning] <strong>Defender Application Guard is deprecated</strong> (claim-002, confirmed by Jaspreet). Remove it from any deck that still lists it: the 2023 seller training and the government WFH briefing.</p>\n</blockquote>\n<p>Sources: <a href=\"#note/40-resources/summary-windows-11-enterprise-feature-map\">summary-windows-11-enterprise-feature-map</a>, <a href=\"#note/40-resources/summary-windows-11-enterprise-l100-deck\">summary-windows-11-enterprise-l100-deck</a>, <a href=\"#note/40-resources/summary-windows-11-enterprise-secure-managed-cloud-ready\">summary-windows-11-enterprise-secure-managed-cloud-ready</a>, <a href=\"#note/40-resources/summary-windows-enterprise-e3-sellers-training-2023\">summary-windows-enterprise-e3-sellers-training-2023</a> · MOC: <a href=\"#note/_meta/mocs/moc-windows-and-endpoint-management\">moc-windows-and-endpoint-management</a></p>\n"},"10-notes/entities/windows-autopatch":{"id":"10-notes/entities/windows-autopatch","title":"Windows Autopatch","path":"10-Notes/entities/windows-autopatch.md","type":"entity","tags":["product","endpoint"],"html":"<h1>Windows Autopatch</h1>\n<p>A Microsoft service that automates Windows and Office update rollout. It is listed under <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a>.</p>\n<ul>\n<li>Ring-based patching</li>\n<li>A measurable update-currency target (SLO)</li>\n<li>Break-glass controls: pause and rollback</li>\n</ul>\n<h2>How it works</h2>\n<ul>\n<li><strong>Division of labour:</strong> you enroll devices. Microsoft evaluates and selects updates, builds and maintains rings, schedules, deploys, monitors, pauses and rolls back.</li>\n<li><strong>Scope:</strong> Windows quality, feature, driver and firmware updates, plus M365 Apps, Edge and Teams.</li>\n<li><strong>Example rings:</strong> Test 1% → First 10% → Fast 20% → Broad 69%, with health gates.</li>\n<li><strong>Now absorbs</strong> the Windows Update for Business deployment service, in one dashboard in the Intune admin center with no feature loss (<a href=\"#note/40-resources/summary-windows-11-enterprise-l100-deck\">summary-windows-11-enterprise-l100-deck</a>).</li>\n<li><strong>Requires</strong> <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>. It runs on Pro hardware but is licensed through Enterprise E3/E5.</li>\n</ul>\n<h2>Value claims</h2>\n<p>These measure different things, so always cite which one you use. See <a href=\"#note/10-notes/concepts/windows-enterprise-servicing\">windows-enterprise-servicing</a>.</p>\n<ul>\n<li>50–70% IT efficiency gain</li>\n<li>60–80% less patching time (Forrester TEI 2024)</li>\n<li>45% / 95% / 80% less effort on monthly, feature and reporting work (projected TEI 2023)</li>\n</ul>\n<h2>Licensing and prerequisites (Microsoft Learn, updated Feb 2026)</h2>\n<ul>\n<li><strong>Eligible licences:</strong> M365 Business Premium; Windows Education A3/A5; Windows Enterprise E3/E5, <strong>included in M365 F3, E3 or E5</strong>; Windows Enterprise E3/E5 VDA. F3 and E3+ get the same features, including support requests; Business Premium and A3+ do not get support requests.</li>\n<li><strong>Needs:</strong> Entra ID P1 or P2 plus Intune. Devices must be Intune-managed or co-managed (Windows Update and Device configuration workloads set to Intune or Pilot Intune), and must have checked in within the last 28 days.</li>\n<li><strong>Corporate-owned devices only.</strong> Windows BYOD is blocked at registration.</li>\n<li><strong>Editions:</strong> Windows 10/11 Pro, Education, Enterprise, Pro for Workstations and IoT Enterprise. On LTSC, quality updates only.</li>\n<li><strong>Diagnostic data:</strong> at least Required level for the deployment protections.</li>\n</ul>\n<p>Source: <a href=\"#note/raw/2026-10-19-ms-learn-autopatch-prerequisitesref\">raw/2026-10-19-ms-learn-autopatch-prerequisites.ref.md</a></p>\n<p>Sources: <a href=\"#note/40-resources/summary-windows-11-enterprise-feature-map\">summary-windows-11-enterprise-feature-map</a>, <a href=\"#note/40-resources/summary-windows-11-enterprise-secure-managed-cloud-ready\">summary-windows-11-enterprise-secure-managed-cloud-ready</a>, <a href=\"#note/40-resources/summary-windows-11-enterprise-l100-deck\">summary-windows-11-enterprise-l100-deck</a>, <a href=\"#note/40-resources/summary-windows-enterprise-value-prop-intune\">summary-windows-enterprise-value-prop-intune</a>, <a href=\"#note/40-resources/summary-windows-enterprise-e3-sellers-training-2023\">summary-windows-enterprise-e3-sellers-training-2023</a>, <a href=\"#note/40-resources/summary-intune-vs-manageengine\">summary-intune-vs-manageengine</a></p>\n"},"10-notes/entities/windows-hello-for-business":{"id":"10-notes/entities/windows-hello-for-business","title":"Windows Hello for Business","path":"10-Notes/entities/windows-hello-for-business.md","type":"entity","tags":["product","identity","windows","passwordless"],"html":"<h1>Windows Hello for Business</h1>\n<p>Windows sign-in with a local PIN or biometrics backed by keys in TPM 2.0, instead of a password. It is the Windows building block of <a href=\"#note/10-notes/concepts/passwordless-authentication\">passwordless-authentication</a>.</p>\n<ul>\n<li><strong>Edition:</strong> available on <strong>Pro and Enterprise</strong>. It is not an Enterprise differentiator (<a href=\"#note/40-resources/summary-windows-11-enterprise-secure-managed-cloud-ready\">summary-windows-11-enterprise-secure-managed-cloud-ready</a>).</li>\n<li><strong>Enables:</strong> SSO to Entra ID apps, and unlocks Personal Data Encryption on <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a>.</li>\n<li><strong>Deploy via:</strong> <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>, ConfigMgr or GPO.</li>\n</ul>\n<p>Sources: <a href=\"#note/40-resources/summary-windows-11-enterprise-l100-deck\">summary-windows-11-enterprise-l100-deck</a>, <a href=\"#note/40-resources/summary-passwordless-journey-2022\">summary-passwordless-journey-2022</a></p>\n"},"40-resources/summary-elevate-security-for-copilot-e1-plus-deck":{"id":"40-resources/summary-elevate-security-for-copilot-e1-plus-deck","title":"Summary — Elevate security for Copilot with Office 365 E1 Plus (deck)","path":"40-Resources/summary-elevate-security-for-copilot-e1-plus-deck.md","type":"summary","tags":["copilot","security","zero-trust","licensing"],"html":"<h1>Summary — Elevate security for Copilot with Office 365 E1 Plus (deck)</h1>\n<p><strong>Source:</strong> Microsoft field presentation &quot;Elevate security for Copilot with Office 365 E1 Plus&quot;, v9.1, 25 slides (raw/2026-10-19-elevate-security-for-copilot-o365-e1-plus.pptx). It is a 45-minute, level-200 deck for ITDMs, IT security leads and CISOs. The deck is marked <em>Microsoft confidential, for presenter info only</em>, so keep this page internal.</p>\n<h2>Key takeaways</h2>\n<ol>\n<li><strong>Pitch:</strong> <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> is a low-cost first step toward <a href=\"#note/10-notes/concepts/zero-trust\">zero-trust</a> that gets a customer ready for <a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a>. It is sold only in selected emerging markets as a promo SKU.</li>\n<li><strong>Five controls frame Copilot security readiness</strong> (slides 12–18): govern access (<a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1, <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>); mitigate device risk (<a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> P1); protect against threats (<a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a>); protect against data loss (<a href=\"#note/10-notes/entities/microsoft-purview\">microsoft-purview</a> DLP for email and files); discover AI apps (Cloud App Discovery, 400+ AI apps). See <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>.</li>\n<li><strong>Good / better / best</strong> (slides 21, 25): E1 Plus = baseline, <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> = &quot;best-in-class&quot; core (the speaker calls ME3 &quot;the jumping-off point&quot;), M365 E5 = automated and XDR-grade. See <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>.</li>\n</ol>\n<h2>Narrative arc</h2>\n<table>\n<thead>\n<tr>\n<th>Slides</th>\n<th>Point</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>2–3</td>\n<td>Microsoft 365 Copilot = LLM + Microsoft Graph + M365 apps, inside the compliance boundary</td>\n</tr>\n<tr>\n<td>4–6</td>\n<td>Market data: 79% of leaders see AI as imperative; 60% lack a plan; 80% cite data leakage as the main AI concern</td>\n</tr>\n<tr>\n<td>7</td>\n<td>What E1 Plus contains, compared with O365 E1 and M365 E3</td>\n</tr>\n<tr>\n<td>8–10</td>\n<td>Three value pillars: smart secure productivity (Copilot Chat with <a href=\"#note/10-notes/concepts/enterprise-data-protection\">enterprise-data-protection</a>), AI-era protection (Zero Trust), optimized IT management</td>\n</tr>\n<tr>\n<td>11–18</td>\n<td>The five-step Copilot security journey (see takeaway 2)</td>\n</tr>\n<tr>\n<td>19–20</td>\n<td>Endpoint management: BYOD, consolidation, TCO</td>\n</tr>\n<tr>\n<td>21, 25</td>\n<td>E1 Plus vs M365 E3 vs M365 E5 control matrix</td>\n</tr>\n<tr>\n<td>22–23</td>\n<td>Upsell to M365 E3 + Copilot; next step is a solution assessment</td>\n</tr>\n</tbody></table>\n<h2>E1 Plus contents (slide 7)</h2>\n<p>OneDrive, Exchange, SharePoint, Viva Connections, Viva Engage, Viva Insights, Delve, Power Apps, Power Automate, Bookings, Stream, Sway, Forms, Planner, To Do, <strong>Entra ID P1</strong>, <strong>Office 365 DLP</strong>, <strong>Intune Plan 1</strong>.</p>\n<ul>\n<li>Teams is a separate purchase for net-new customers; some Viva and Power Platform features depend on it.</li>\n<li>Storage per the slide: 1 TB OneDrive and 50 GB mailbox for E1 and E1 Plus; &quot;Unlimited&quot; and 100 GB for M365 E3.</li>\n</ul>\n<blockquote>\n<p>[!warning] <strong>Resolved:</strong> slide 7&#39;s &quot;Unlimited&quot; for M365 E3 storage is <strong>out of date</strong>. Jaspreet confirmed 5 TB on 2026-10-19, which matches the E3 mind map (<a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map#claim-002</a>). Never quote &quot;Unlimited&quot;.</p>\n</blockquote>\n<h3>Comparison table (slide 7, read from a rendered image)</h3>\n<table>\n<thead>\n<tr>\n<th>Capability</th>\n<th>O365 E1</th>\n<th>O365 E1 Plus</th>\n<th>M365 E3</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Files and storage (OneDrive/SharePoint)</td>\n<td>1 TB</td>\n<td>1 TB</td>\n<td><del>Unlimited</del> <strong>5 TB</strong> (deck is out of date; see claim-002)</td>\n</tr>\n<tr>\n<td>Email (Exchange)</td>\n<td>50 GB</td>\n<td>50 GB</td>\n<td>100 GB</td>\n</tr>\n<tr>\n<td>Other cloud services (Planner, Forms, Stream, Whiteboard)</td>\n<td>●</td>\n<td>●</td>\n<td>●</td>\n</tr>\n<tr>\n<td>Office desktop apps (M365 Apps for enterprise)</td>\n<td>–</td>\n<td>–</td>\n<td>●</td>\n</tr>\n<tr>\n<td>Endpoint management (Intune P1)</td>\n<td>Basic</td>\n<td>●</td>\n<td>●</td>\n</tr>\n<tr>\n<td>Office 365 DLP (Purview DLP for email and files)</td>\n<td>–</td>\n<td>●</td>\n<td>●</td>\n</tr>\n<tr>\n<td>Identity, Conditional Access (Entra ID P1)</td>\n<td>–</td>\n<td>●</td>\n<td>●</td>\n</tr>\n<tr>\n<td>Exchange Online Archiving</td>\n<td>50 GB</td>\n<td>50 GB</td>\n<td>●</td>\n</tr>\n<tr>\n<td>File classification, encryption (Purview P1)</td>\n<td>–</td>\n<td>–</td>\n<td>●</td>\n</tr>\n<tr>\n<td>Windows Enterprise management (Win E3)</td>\n<td>–</td>\n<td>–</td>\n<td>●</td>\n</tr>\n<tr>\n<td>Endpoint protection (MDE P1)</td>\n<td>–</td>\n<td>–</td>\n<td>●</td>\n</tr>\n</tbody></table>\n<p>The three E1 Plus differentiators over E1 are Intune P1, Office 365 DLP and Entra ID P1.</p>\n<h2>Staged Copilot rollout (slide 11 notes)</h2>\n<ul>\n<li><strong>Stage 1: web-grounded prompts.</strong> Microsoft Copilot in Bing, Edge and Windows with <a href=\"#note/10-notes/concepts/enterprise-data-protection\">enterprise-data-protection</a>.</li>\n<li><strong>Stage 2: Microsoft 365 Graph-grounded prompts.</strong> <a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a> over the organization&#39;s data.</li>\n<li>Build <a href=\"#note/10-notes/concepts/zero-trust\">zero-trust</a> protections while moving through the stages. The notes cite Microsoft Learn: <em>Apply Zero Trust principles to Microsoft Copilots</em> (learn.microsoft.com/security/zero-trust/copilots/apply-zero-trust-copilots-overview).</li>\n</ul>\n<h2>Identity detail (slides 13 and 21 notes)</h2>\n<ul>\n<li><strong>CAE triggers:</strong> user termination, password change or reset, network location change, token revocation. Policy is enforced without waiting for the token to expire.</li>\n<li><strong>Entra ID P1 in E1 Plus</strong> defends against password spray, replay and phishing.</li>\n<li><strong>Cloud App Discovery</strong> works by uploading network-device logs and reporting against a catalogue of 400+ gen-AI apps with compliance information.</li>\n<li><strong>Intune P1</strong> covers Windows 11, macOS, iOS and Android.</li>\n</ul>\n<h2>Tier detail from the slide 21 speaker notes</h2>\n<ul>\n<li><strong>E1 Plus (&quot;baseline&quot;):</strong> MFA, SSO, <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>, Cloud App Discovery, Intune P1, Purview DLP for email and files.</li>\n<li><strong>M365 E3 (&quot;core&quot;):</strong> + manual sensitivity and retention labels, including on non-Office files such as PDFs; discover gen-AI apps and alert on or block them on Windows 11 via <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> P1; MDE P1 antimalware.</li>\n<li><strong>M365 E5 (&quot;best-in-class&quot;):</strong> + Entra ID Protection risk signals in Conditional Access; automatic sensitivity and retention labels; risk-adaptive controls, communication compliance and premium investigation; Defender for Cloud Apps to block or sanction 400+ AI apps; Defender XDR across endpoints, identity, cloud apps, email and files. See <a href=\"#note/10-notes/entities/microsoft-365-e5\">microsoft-365-e5</a>.</li>\n</ul>\n<h2>Discovery questions (speaker notes)</h2>\n<ul>\n<li><strong>AI (slide 5):</strong> What is your AI strategy for productivity? Have you identified the key roles to enable Copilot first, and how will you empower everyone else?</li>\n<li><strong>Security (slide 10):</strong> What is your data protection strategy? Are your files in the cloud, on-premises or hybrid? Do you have a Zero Trust strategy, and how is it managed?</li>\n<li><strong>IT (slide 19):</strong> How are endpoints managed today, and how is a new hire set up, remote or on-site? How many productivity and security vendors do you run, and have you considered consolidating?</li>\n</ul>\n<blockquote>\n<p>[!warning] <strong>Out of date (slide 9 notes):</strong> &quot;Customers licensed for Microsoft 365 E3, E5 … are eligible for Copilot at no additional cost during preview.&quot; This refers to the old preview of the free Copilot chat. Do not quote it.</p>\n</blockquote>\n<h2>Control matrix highlights (slide 25)</h2>\n<table>\n<thead>\n<tr>\n<th>Capability</th>\n<th>O365 E1 Plus</th>\n<th>M365 E3</th>\n<th>M365 E5</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Single identity, MFA, SSPR, Conditional Access, CAE</td>\n<td>✓</td>\n<td>✓</td>\n<td>✓</td>\n</tr>\n<tr>\n<td>Access reviews, PIM / just-in-time admin</td>\n<td>–</td>\n<td>–</td>\n<td>✓</td>\n</tr>\n<tr>\n<td>Deploy, update and restrict M365 apps; app protection; wipe; revoke on non-compliance</td>\n<td>✓</td>\n<td>✓</td>\n<td>✓</td>\n</tr>\n<tr>\n<td>eDiscovery for Copilot data</td>\n<td>–</td>\n<td>Standard</td>\n<td>Premium</td>\n</tr>\n<tr>\n<td>Audit of Copilot interactions</td>\n<td>Standard</td>\n<td>Standard</td>\n<td>Premium</td>\n</tr>\n<tr>\n<td>Retention for Copilot interactions</td>\n<td>–</td>\n<td>Standard</td>\n<td>Automated</td>\n</tr>\n<tr>\n<td>DLP for Copilot-generated content</td>\n<td>Files and email</td>\n<td>Files and email</td>\n<td>+ endpoint, Teams</td>\n</tr>\n<tr>\n<td>Sensitivity label inheritance and citation; label-based Copilot restrictions</td>\n<td>–</td>\n<td>✓</td>\n<td>✓</td>\n</tr>\n<tr>\n<td>Labelling</td>\n<td>–</td>\n<td>Manual</td>\n<td>Automated</td>\n</tr>\n<tr>\n<td>Communication compliance; DKE; trainable classifiers</td>\n<td>–</td>\n<td>–</td>\n<td>✓</td>\n</tr>\n<tr>\n<td>AI app discovery (400+ apps)</td>\n<td>Entra ID P1 Cloud App Discovery</td>\n<td>Entra Cloud App Discovery</td>\n<td>✓</td>\n</tr>\n<tr>\n<td>Block or sanction discovered AI apps</td>\n<td>–</td>\n<td>Manual via MDE P1</td>\n<td>✓</td>\n</tr>\n<tr>\n<td>Antimalware, web and network protection</td>\n<td>–</td>\n<td>MDE P1</td>\n<td>XDR</td>\n</tr>\n</tbody></table>\n<h2>Supporting statistics (as cited by the deck)</h2>\n<ul>\n<li>79% / 60% / 59%: AI is imperative / no plan / can&#39;t quantify gains (2024 Work Trend Index)</li>\n<li>65% of organizations use AI; 58% lack visibility into unsanctioned gen-AI use; 80% cite data leakage as a concern (Worklab; Microsoft Security whitepaper)</li>\n<li>87% use flexible work options (McKinsey, 2022); 86% say outdated PCs raise vulnerability (Hypothesis Group, 2021)</li>\n</ul>\n<p><em>Re-read on 2026-10-19: full speaker notes, nested shapes and a rendered slide 7. The first pass had truncated the notes and missed
