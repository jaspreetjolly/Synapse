<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2374d99f'/%3E%3Cpath d='M18 34h28M22 23h20M24 45h16' stroke='%23151719' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>Synapse Note</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6f8;
      --paper: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --line: #d0d7de;
      --accent: #1677b9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font: 18px/1.65 "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .shell {
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px;
    }
    .paper {
      min-height: calc(100vh - 56px);
      padding: clamp(28px, 5vw, 64px);
      background: var(--paper);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 22px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.08);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }
    h2, h3 { line-height: 1.2; }
    a { color: var(--accent); }
    .meta {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 15px;
    }
    .tag-chip {
      display: inline-block;
      margin: 0 6px 8px 0;
      padding: 4px 10px;
      border-radius: 999px;
      color: #0f172a;
      background: #d9f99d;
      font-size: 13px;
    }
    pre {
      overflow: auto;
      background: #111827;
      color: #e5e7eb;
      padding: 16px;
      border-radius: 12px;
    }
    code {
      background: #edf2f7;
      padding: 0.12em 0.32em;
      border-radius: 4px;
    }
    pre code {
      background: transparent;
      padding: 0;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 20px 0;
      font-size: 15px;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 9px;
      vertical-align: top;
    }
    blockquote {
      border-left: 4px solid #94a3b8;
      margin-left: 0;
      padding-left: 16px;
      color: #475569;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
    }
    .topbar a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .missing {
      color: var(--muted);
      text-align: center;
      padding: 20vh 20px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <a href="index.html">Back to graph</a>
      <span>Synapse</span>
    </div>
    <article id="paper" class="paper"></article>
  </div>
  <script>
    let pages = {};
    const paper = document.getElementById("paper");

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function currentId() {
      return decodeURIComponent(location.hash.replace(/^#note\//, "")) || "index";
    }

    function render() {
      const id = currentId();
      const note = pages[id];
      if (!note) {
        document.title = "Note not found";
        paper.innerHTML = "<div class='missing'><h1>Note not found</h1><p>Return to the graph and select another node.</p></div>";
        return;
      }
      document.title = note.title + " - Synapse";
      const tags = note.tags.map(tag => "<span class='tag-chip'>#" + escapeHtml(tag) + "</span>").join("");
      const bodyHtml = note.html.replace(/^\s*<h1[^>]*>[\s\S]*?<\/h1>/i, "");
      paper.innerHTML = "<h1>" + escapeHtml(note.title) + "</h1><div class='meta'>" + escapeHtml(note.path) + "</div>" + tags + bodyHtml;
      paper.querySelectorAll("a[href^='#note/']").forEach(link => {
        link.addEventListener("click", event => {
          event.preventDefault();
          location.hash = link.getAttribute("href");
          render();
          scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    async function loadPages() {
      try {
        const response = await fetch("graph-data.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Unable to load graph-data.json");
        const graph = await response.json();
        pages = graph.pages || {};
        render();
      } catch (error) {
        document.title = "Synapse";
        paper.innerHTML = "<div class='missing'><h1>Unable to load note content</h1><p>" + escapeHtml(error.message) + "</p></div>";
      }
    }

    window.addEventListener("hashchange", render);
    loadPages();
  </script>
</body>
</html>
