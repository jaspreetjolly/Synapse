  <script>
    const pages = {"10-notes/concepts/conditional-access":{"id":"10-notes/concepts/conditional-access","title":"Conditional Access","path":"10-Notes/concepts/conditional-access.md","type":"concept","tags":["identity","security","zero-trust"],"html":"<h1>Conditional Access</h1>\n<p><strong>Idea:</strong> access decisions are policy-driven &#39;if-then&#39; rules over signals such as user, device, location and app, rather than a static allow or deny.</p>\n<ul>\n<li><strong>Delivered by:</strong> <a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1, so it is included in <a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a> and <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a>.</li>\n<li><strong>Pairs with:</strong> MFA (a common control) and device compliance from <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>.</li>\n</ul>\n<p><strong>Now sourced:</strong> the deck lists the signals (user/group membership, IP location, device state, application) and the decisions (allow, require MFA, limit access, force password reset). It also adds Continuous Access Evaluation for near-real-time revocation (<a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a>, slide 13).</p>\n<p><strong>Underpins:</strong> <a href=\"#note/10-notes/concepts/zero-trust\">zero-trust</a> and control 1 of <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>. Also available in <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a>.</p>\n<p>Sources: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>, <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a></p>\n"},"10-notes/concepts/copilot-security-readiness":{"id":"10-notes/concepts/copilot-security-readiness","title":"Copilot security readiness","path":"10-Notes/concepts/copilot-security-readiness.md","type":"concept","tags":["copilot","security","zero-trust","licensing"],"html":"<h1>Copilot security readiness</h1>\n<p><strong>Idea:</strong> before (or while) rolling out <a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a>, put five <a href=\"#note/10-notes/concepts/zero-trust\">zero-trust</a> controls in place. The licence tier sets how deep each control goes.</p>\n<h2>The five controls (deck, slides 12–18)</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>Control</th>\n<th>Baseline product</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>Govern access to Copilot</td>\n<td><a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1, <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>, MFA, CAE</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Mitigate device risk</td>\n<td><a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> P1: app deployment, app protection, wipe</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Protect against threats</td>\n<td><a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a></td>\n</tr>\n<tr>\n<td>4</td>\n<td>Protect against data loss</td>\n<td><a href=\"#note/10-notes/entities/microsoft-purview\">microsoft-purview</a> DLP for email and files</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Discover AI apps</td>\n<td>Entra Cloud App Discovery (400+ AI apps)</td>\n</tr>\n</tbody></table>\n<h2>Staged rollout</h2>\n<ol>\n<li><strong>Web-grounded prompts first:</strong> Copilot Chat with <a href=\"#note/10-notes/concepts/enterprise-data-protection\">enterprise-data-protection</a>.</li>\n<li><strong>Then Graph-grounded prompts:</strong> <a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a> over organizational data.</li>\n</ol>\n<p>Mature the five controls between the stages.</p>\n<h2>Good / better / best</h2>\n<table>\n<thead>\n<tr>\n<th>Tier</th>\n<th>Positioning</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a></td>\n<td><strong>Baseline:</strong> Conditional Access, DLP for email and files, unified endpoint management</td>\n</tr>\n<tr>\n<td><a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a></td>\n<td><strong>Core / jumping-off point:</strong> + manual labels, standard eDiscovery and audit, block risky AI apps on <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a> via <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> P1</td>\n</tr>\n<tr>\n<td><a href=\"#note/10-notes/entities/microsoft-365-e5\">microsoft-365-e5</a></td>\n<td><strong>Best:</strong> Entra ID Protection risk-based access, automatic labels, communication compliance, Defender for Cloud Apps (block or sanction AI apps), Defender XDR</td>\n</tr>\n</tbody></table>\n<p><strong>Talk-track use:</strong> open with &quot;Copilot inherits your existing controls&quot;, then show where the customer sits on the ladder. Detail: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a>.</p>\n"},"10-notes/concepts/email-and-collaboration-protection-layers":{"id":"10-notes/concepts/email-and-collaboration-protection-layers","title":"Email and collaboration protection layers","path":"10-Notes/concepts/email-and-collaboration-protection-layers.md","type":"concept","tags":["security","email-security"],"html":"<h1>Email and collaboration protection layers</h1>\n<p><strong>Idea:</strong> email and collaboration security comes in layers. Each layer adds detection depth and coverage.</p>\n<ol>\n<li><strong>Baseline: <a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a></strong> (in <a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a> and <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a>): multi-engine anti-malware, anti-spam, DLP.</li>\n<li><strong>Threat protection</strong> (<a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a> P1): detonation (Safe Attachments), URL rewriting (Safe Links), impersonation anti-phishing, ZAP, extended to Teams, SharePoint and OneDrive.</li>\n<li><strong>Investigation and response:</strong> real-time detections in P1. Deeper hunting and automation sit above P1; this is not covered by the sources.</li>\n</ol>\n<p>Sources: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>, <a href=\"#note/40-resources/summary-mdo-plan1-feature-map\">summary-mdo-plan1-feature-map</a></p>\n"},"10-notes/concepts/enterprise-data-protection":{"id":"10-notes/concepts/enterprise-data-protection","title":"Enterprise Data Protection (Copilot Chat)","path":"10-Notes/concepts/enterprise-data-protection.md","type":"concept","tags":["copilot","security","privacy"],"html":"<h1>Enterprise Data Protection (Copilot Chat)</h1>\n<p><strong>Idea:</strong> when a user signs in to Microsoft Copilot (web chat) with a work account, the chat runs under enterprise data protection.</p>\n<ul>\n<li>Prompts and responses are not used to train the underlying model.</li>\n<li>Chat data is not retained, and Microsoft has no eyes-on access. The deck&#39;s older talk track calls this &quot;commercial data protection&quot;.</li>\n<li><strong>So:</strong> employees can safely include internal data in web-grounded prompts.</li>\n</ul>\n<p>It is included for <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> users. It is distinct from Graph-grounded <a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a>.</p>\n<blockquote>\n<p>[!question] The deck&#39;s speaker notes use both &quot;commercial&quot; and &quot;enterprise&quot; data protection. Check the current product terms for the retention wording.</p>\n</blockquote>\n<blockquote>\n<p>[!warning] The deck&#39;s slide 9 notes say E3 and E5 customers get Copilot &quot;at no additional cost during preview&quot;. That refers to the old preview and is out of date; check current eligibility at aka.ms/Copilot/FAQ.</p>\n</blockquote>\n<p><strong>Rollout:</strong> this is stage 1 of the staged rollout in <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>.</p>\n<p>Source: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> (slides 8–9, 11)</p>\n"},"10-notes/concepts/m365-licensing-stack":{"id":"10-notes/concepts/m365-licensing-stack","title":"Microsoft 365 licensing stack","path":"10-Notes/concepts/m365-licensing-stack.md","type":"concept","tags":["licensing","modern-work"],"html":"<h1>Microsoft 365 licensing stack</h1>\n<p><strong>Idea:</strong> Microsoft 365 suites are built from smaller suites. Explain them layer by layer, not as one long feature list.</p>\n<table>\n<thead>\n<tr>\n<th>Layer</th>\n<th>E3 component</th>\n<th>Role</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Productivity and compliance</td>\n<td><a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a></td>\n<td>Apps, mail, files, collaboration, baseline DLP and retention</td>\n</tr>\n<tr>\n<td>Identity and endpoint</td>\n<td><a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a></td>\n<td><a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1, <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>, MIP P1</td>\n</tr>\n<tr>\n<td>OS and endpoint security</td>\n<td>ME3 extras</td>\n<td>Windows 11 Enterprise, <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> P1, Universal Print, Loop</td>\n</tr>\n</tbody></table>\n<p><strong>Below E3:</strong> <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> takes the identity and device layer (Entra ID P1, Intune P1) and adds DLP on top of web-only E1. It is a Zero Trust starter for emerging markets.</p>\n<p><strong>Why it matters:</strong> customers with O365 E3 and separate EMS E3 often miss the ME3-only extras. That gap is a common upsell or consolidation talking point. This is my inference, not stated in the source.</p>\n<p>Instances: <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a>, <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> · Sources: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>, <a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a> · Copilot view: <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a></p>\n"},"10-notes/concepts/mdm-vs-mam":{"id":"10-notes/concepts/mdm-vs-mam","title":"MDM vs MAM","path":"10-Notes/concepts/mdm-vs-mam.md","type":"concept","tags":["endpoint","security"],"html":"<h1>MDM vs MAM</h1>\n<p><strong>Idea:</strong> there are two ways to manage endpoints. Pick one per device-ownership scenario.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>MDM</th>\n<th>MAM</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Controls</td>\n<td>Whole device</td>\n<td>Individual apps and their data</td>\n</tr>\n<tr>\n<td>Typical fit</td>\n<td>Corporate-owned devices</td>\n<td>BYOD, unenrolled devices</td>\n</tr>\n<tr>\n<td>Intune features (per source)</td>\n<td>Config profiles, compliance policies, patching, wipe</td>\n<td>App protection policies, Tunnel for MAM</td>\n</tr>\n</tbody></table>\n<p>Both are delivered by <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>. Source: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a></p>\n"},"10-notes/concepts/zero-trust":{"id":"10-notes/concepts/zero-trust","title":"Zero Trust","path":"10-Notes/concepts/zero-trust.md","type":"concept","tags":["security","zero-trust"],"html":"<h1>Zero Trust</h1>\n<p><strong>Idea:</strong> a security strategy, not a product, built on three principles: <strong>verify explicitly, use least-privilege access, assume breach</strong>. In short: &quot;never trust, always verify&quot;.</p>\n<ul>\n<li><strong>Microsoft&#39;s AI framing:</strong> security recommendations for AI are anchored in Zero Trust, and building those protections now prepares a tenant for Copilot.</li>\n<li><strong>In M365:</strong> identity (<a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a>, <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>), devices (<a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>), threats (<a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a>, <a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a>, <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a>), data (<a href=\"#note/10-notes/entities/microsoft-purview\">microsoft-purview</a>) and apps (Cloud App Discovery).</li>\n<li><strong>Applied to Copilot:</strong> <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a></li>\n</ul>\n<p>Source: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> (slide 11 notes)</p>\n"},"10-notes/entities/ems-e3":{"id":"10-notes/entities/ems-e3","title":"Enterprise Mobility + Security E3","path":"10-Notes/entities/ems-e3.md","type":"entity","tags":["product","licensing","security"],"html":"<h1>Enterprise Mobility + Security E3</h1>\n<p>The identity and endpoint layer of <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a>.</p>\n<ul>\n<li><strong>Identity:</strong> <a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1</li>\n<li><strong>Endpoint:</strong> <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>, plus Remote Help and Advanced Endpoint Analytics as listed in the source map</li>\n<li><strong>Information protection:</strong> MIP Plan 1 (manual labeling)</li>\n<li><strong>Rights:</strong> Windows Server CAL rights</li>\n</ul>\n<blockquote>\n<p>[!question] Intune Plan 2, Remote Help and Advanced Endpoint Analytics were historically Intune Suite add-ons. Confirm current inclusion.</p>\n</blockquote>\n<p>Source: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a></p>\n"},"10-notes/entities/exchange-online-protection":{"id":"10-notes/entities/exchange-online-protection","title":"Exchange Online Protection","path":"10-Notes/entities/exchange-online-protection.md","type":"entity","tags":["product","security","email-security"],"html":"<h1>Exchange Online Protection</h1>\n<p>Microsoft&#39;s cloud email filtering service against spam, malware, phishing and other email threats. It is the baseline in every Exchange Online plan, including <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> and <a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a>.</p>\n<ul>\n<li><strong>Layer 1</strong> of <a href=\"#note/10-notes/concepts/email-and-collaboration-protection-layers\">email-and-collaboration-protection-layers</a>; <a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a> builds on top of it.</li>\n<li><strong>Step 3</strong> (&quot;protect against threats&quot;) in the E1 Plus Copilot journey (<a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>).</li>\n</ul>\n<p>Sources: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a>, <a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a></p>\n"},"10-notes/entities/microsoft-365-copilot":{"id":"10-notes/entities/microsoft-365-copilot","title":"Microsoft 365 Copilot","path":"10-Notes/entities/microsoft-365-copilot.md","type":"entity","tags":["product","copilot","ai"],"html":"<h1>Microsoft 365 Copilot</h1>\n<p>An AI assistant that combines LLMs with the user&#39;s data in Microsoft Graph and works inside the M365 apps, <strong>within the Microsoft 365 compliance boundary</strong>.</p>\n<ul>\n<li><strong>Licensing:</strong> an add-on to Office 365 E1–E5 and Microsoft 365 E3/E5. The base plan determines which security and compliance controls apply (<a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>).</li>\n<li><strong>Permissions:</strong> Copilot only accesses data the user already has permission to view, so oversharing becomes visible. Interactions are logged for audit.</li>\n<li><strong>Distinct from:</strong> Microsoft Copilot (free web chat) with <a href=\"#note/10-notes/concepts/enterprise-data-protection\">enterprise-data-protection</a>, which is included with E1 Plus.</li>\n<li><strong>Prepare with:</strong> <a href=\"#note/10-notes/concepts/zero-trust\">zero-trust</a> controls; roll out web-grounded prompts first, then Graph-grounded (<a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>).</li>\n</ul>\n<p>Source: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> · MOC: <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a></p>\n"},"10-notes/entities/microsoft-365-e3":{"id":"10-notes/entities/microsoft-365-e3","title":"Microsoft 365 E3","path":"10-Notes/entities/microsoft-365-e3.md","type":"entity","tags":["product","licensing","modern-work"],"html":"<h1>Microsoft 365 E3</h1>\n<p>Microsoft&#39;s enterprise bundle of productivity, identity, endpoint management and baseline security.</p>\n<ul>\n<li><strong>Made of:</strong> <a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a> + <a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a> + ME3-only extras (Windows 11 Enterprise, <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> P1, Universal Print, Loop). See <a href=\"#note/10-notes/concepts/m365-licensing-stack\">m365-licensing-stack</a>.</li>\n<li><strong>Detail:</strong> <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a></li>\n<li><strong>Windows:</strong> <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a> (detail in <a href=\"#note/40-resources/summary-windows-11-enterprise-feature-map\">summary-windows-11-enterprise-feature-map</a>)</li>\n<li><strong>Copilot positioning:</strong> the &quot;core / jumping-off point&quot; for <a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a> security. It sits above <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> (baseline) and below M365 E5. See <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>.</li>\n<li><strong>MOC:</strong> <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a> · <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a></li>\n</ul>\n"},"10-notes/entities/microsoft-365-e5":{"id":"10-notes/entities/microsoft-365-e5","title":"Microsoft 365 E5","path":"10-Notes/entities/microsoft-365-e5.md","type":"entity","tags":["product","licensing","security","compliance"],"html":"<h1>Microsoft 365 E5</h1>\n<p>Microsoft&#39;s top enterprise suite. It is the &quot;best-in-class&quot; tier for Copilot security in <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>, above <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> and <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a>.</p>\n<h2>What E5 adds over E3 (per deck slides 21 and 25)</h2>\n<table>\n<thead>\n<tr>\n<th>Area</th>\n<th>E5 capability</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Identity</td>\n<td>Entra ID Protection: user and sign-in risk in <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>; access reviews; PIM for just-in-time admin</td>\n</tr>\n<tr>\n<td>Data</td>\n<td><a href=\"#note/10-notes/entities/microsoft-purview\">microsoft-purview</a> automatic sensitivity and retention labels; risk-adaptive controls; communication compliance; premium eDiscovery and audit; DKE; trainable classifiers; DLP extended to endpoints and Teams</td>\n</tr>\n<tr>\n<td>AI apps</td>\n<td>Defender for Cloud Apps: discover, then <strong>block or sanction</strong> 400+ AI apps</td>\n</tr>\n<tr>\n<td>Threats</td>\n<td>Microsoft Defender XDR across endpoints, identity, cloud apps, email and files</td>\n</tr>\n</tbody></table>\n<blockquote>\n<p>[!question] This page rests only on a Copilot-focused deck. Ingest an E5 service description or mind map to confirm the full feature set, including Defender for Office 365 P2 and Defender for Endpoint P2.</p>\n</blockquote>\n<p>Source: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> · MOCs: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a> · <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a></p>\n"},"10-notes/entities/microsoft-defender-for-endpoint":{"id":"10-notes/entities/microsoft-defender-for-endpoint","title":"Microsoft Defender for Endpoint","path":"10-Notes/entities/microsoft-defender-for-endpoint.md","type":"entity","tags":["product","security","endpoint"],"html":"<h1>Microsoft Defender for Endpoint</h1>\n<p>Microsoft&#39;s endpoint security platform. <strong>Plan 1</strong> ships in <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> as an ME3-only feature.</p>\n<p><strong>P1 capabilities (per source):</strong> attack surface reduction, web protection and filtering, device control (USB), centralised AV management.</p>\n<ul>\n<li><strong>Pairs with:</strong> <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> for device management.</li>\n</ul>\n<p><strong>Copilot role (M365 E3):</strong> antimalware, web and network protection, and manual blocking of discovered risky AI apps on <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a> devices. M365 E5 moves this to XDR (<a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>).</p>\n<p>Sources: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>, <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> · MOC: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a></p>\n"},"10-notes/entities/microsoft-defender-for-office-365":{"id":"10-notes/entities/microsoft-defender-for-office-365","title":"Microsoft Defender for Office 365","path":"10-Notes/entities/microsoft-defender-for-office-365.md","type":"entity","tags":["product","security","email-security"],"html":"<h1>Microsoft Defender for Office 365</h1>\n<p>Microsoft&#39;s threat protection for email and collaboration (Exchange, Teams, SharePoint, OneDrive). This page covers <strong>Plan 1</strong>.</p>\n<ul>\n<li><strong>Protection:</strong> Safe Attachments, Safe Links, impersonation anti-phishing, ZAP, all extended to Teams</li>\n<li><strong>Investigation:</strong> real-time detections and reports</li>\n<li><strong>Admin:</strong> preset policies, Configuration Analyzer, Tenant Allow/Block List</li>\n<li><strong>Positioning:</strong> sits on top of the anti-spam and anti-malware baseline in <a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a>. See <a href=\"#note/10-notes/concepts/email-and-collaboration-protection-layers\">email-and-collaboration-protection-layers</a>.</li>\n</ul>\n<p>Sources: <a href=\"#note/40-resources/summary-mdo-plan1-feature-map\">summary-mdo-plan1-feature-map</a>, <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a></p>\n"},"10-notes/entities/microsoft-entra-id":{"id":"10-notes/entities/microsoft-entra-id","title":"Microsoft Entra ID","path":"10-Notes/entities/microsoft-entra-id.md","type":"entity","tags":["product","identity","security"],"html":"<h1>Microsoft Entra ID</h1>\n<p>Microsoft&#39;s cloud identity service. <strong>Plan 1</strong> ships in <a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a>.</p>\n<p><strong>P1 capabilities (per source):</strong> <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>, MFA, SSO, hybrid self-service password reset, group-based access (dynamic groups, licensing, app access), Application Proxy for on-premises web apps, password protection (global and custom banned lists, spray defence, AD DS), Cloud App Discovery (shadow IT).</p>\n<p><strong>Also in:</strong> <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> (same P1 feature set, per <a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a>).</p>\n<p><strong>Copilot role</strong> (control 1 of <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>): a single managed identity; <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a> evaluates user, group, IP location, device state and app; Continuous Access Evaluation (CAE) revokes tokens on critical events: user termination, password change or reset, network location change, token revocation. Policy is enforced without waiting for the token to expire. P1 also defends against password spray, replay and phishing. Cloud App Discovery assesses 400+ AI apps from uploaded network logs.</p>\n<p><strong>Above P1 (in <a href=\"#note/10-notes/entities/microsoft-365-e5\">microsoft-365-e5</a>):</strong> Entra ID Protection feeds user and sign-in risk into Conditional Access.</p>\n<p>Sources: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>, <a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a>, <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> · MOC: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a> · <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a></p>\n"},"10-notes/entities/microsoft-intune":{"id":"10-notes/entities/microsoft-intune","title":"Microsoft Intune","path":"10-Notes/entities/microsoft-intune.md","type":"entity","tags":["product","endpoint","security"],"html":"<h1>Microsoft Intune</h1>\n<p>Microsoft&#39;s endpoint and app management service, included via <a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a>.</p>\n<p><strong>Capabilities (per source):</strong> MDM across platforms, MAM, device configuration profiles, app protection policies, patch management (Windows, Mac, Android, iOS), compliance policies, remote actions such as wipe, Tunnel for MAM (per-app VPN without enrollment), specialty devices (AR/VR headsets), FOTA, Remote Help, Advanced Endpoint Analytics.</p>\n<ul>\n<li><strong>Concept:</strong> <a href=\"#note/10-notes/concepts/mdm-vs-mam\">mdm-vs-mam</a></li>\n<li><strong>Works with:</strong> <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>, which uses device compliance as a signal (general knowledge, not from the source).</li>\n</ul>\n<p><strong>Plan 1 also in:</strong> <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a>.</p>\n<p><strong>Copilot role</strong> (control 2 of <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>): deploy and update M365 apps; restrict work apps, including Copilot, on personal devices; app protection blocks saving Copilot-generated files to unmanaged apps and copy-paste to non-work apps; wipe work content if a device is lost.</p>\n<p><strong>Windows:</strong> rotates BitLocker keys for <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a>.</p>\n<p>Sources: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>, <a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a>, <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a></p>\n"},"10-notes/entities/microsoft-purview":{"id":"10-notes/entities/microsoft-purview","title":"Microsoft Purview","path":"10-Notes/entities/microsoft-purview.md","type":"entity","tags":["product","security","compliance"],"html":"<h1>Microsoft Purview</h1>\n<p>Microsoft&#39;s data security and compliance family: DLP, information protection (sensitivity labels), retention, eDiscovery, audit and communication compliance.</p>\n<table>\n<thead>\n<tr>\n<th>Tier</th>\n<th>Copilot-relevant capability (deck, slide 25)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a></td>\n<td>DLP for email and files; standard audit</td>\n</tr>\n<tr>\n<td><a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a></td>\n<td>+ manual sensitivity labels (MIP P1), label inheritance in Copilot output, standard eDiscovery and retention</td>\n</tr>\n<tr>\n<td>M365 E5</td>\n<td>+ automatic labelling, endpoint and Teams DLP, premium eDiscovery and audit, communication compliance, DKE, trainable classifiers</td>\n</tr>\n</tbody></table>\n<p>Sources: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a>, <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a></p>\n"},"10-notes/entities/office-365-e1-plus":{"id":"10-notes/entities/office-365-e1-plus","title":"Office 365 E1 Plus","path":"10-Notes/entities/office-365-e1-plus.md","type":"entity","tags":["product","licensing","modern-work","security"],"html":"<h1>Office 365 E1 Plus</h1>\n<p>An Office 365 E1 promo bundle that adds <strong><a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1, <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> P1 and Office 365 DLP</strong>. It is sold only in selected emerging markets.</p>\n<ul>\n<li><strong>Position:</strong> the &quot;baseline security&quot; tier for Copilot readiness, below <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> (<a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>).</li>\n<li><strong>Productivity:</strong> Office for the web only; 50 GB mailbox + 50 GB archive; 1 TB OneDrive.</li>\n<li><strong>Security:</strong> EOP anti-malware and anti-spam (<a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a>), DLP for email and files, manual retention labels, Cloud App Discovery via Entra ID P1.</li>\n<li><strong>AI:</strong> Microsoft Copilot (free web chat) with <a href=\"#note/10-notes/concepts/enterprise-data-protection\">enterprise-data-protection</a>. <a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a> is an add-on.</li>\n<li><strong>Not included (slide 7 table):</strong> desktop Office apps, Purview P1 classification and encryption, Windows Enterprise, Defender for Endpoint P1.</li>\n<li><strong>Over plain O365 E1:</strong> adds Intune P1 (E1 has Basic), Office 365 DLP and Entra ID P1. Storage and mailbox sizes are the same.</li>\n</ul>\n<blockquote>\n<p>[!warning] Teams inclusion conflicts between the sources. The map lists Teams; the deck says it is a separate purchase for net-new customers.</p>\n</blockquote>\n<p>Sources: <a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a>, <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> · MOC: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a></p>\n"},"10-notes/entities/office-365-e3":{"id":"10-notes/entities/office-365-e3","title":"Office 365 E3","path":"10-Notes/entities/office-365-e3.md","type":"entity","tags":["product","licensing","modern-work"],"html":"<h1>Office 365 E3</h1>\n<p>The productivity and baseline compliance layer of <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a>.</p>\n<ul>\n<li><strong>Workloads:</strong> Office apps, Exchange Online (100 GB mailbox, 1.5 TB archive), OneDrive (5 TB), SharePoint, Teams, seeded Viva, Stream, Planner, Forms, Lists, Clipchamp, Power Platform with standard connectors.</li>\n<li><strong>Security and compliance:</strong> DLP, anti-malware, anti-spam, eDiscovery, retention, Litigation Hold. See <a href=\"#note/10-notes/concepts/email-and-collaboration-protection-layers\">email-and-collaboration-protection-layers</a>.</li>\n<li><strong>Listed in the source map:</strong> <a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a> Plan 1.</li>\n</ul>\n<blockquote>\n<p>[!question] MDO P1 inclusion in O365 E3 needs verifying against the current service description.</p>\n</blockquote>\n<p>Source: <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a></p>\n"},"10-notes/entities/windows-11-enterprise":{"id":"10-notes/entities/windows-11-enterprise","title":"Windows 11 Enterprise","path":"10-Notes/entities/windows-11-enterprise.md","type":"entity","tags":["product","endpoint","security","licensing"],"html":"<h1>Windows 11 Enterprise</h1>\n<p>The enterprise edition of Windows 11, included in <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> as an ME3-only feature.</p>\n<ul>\n<li><strong>Rights:</strong> up to 5 Windows environments per user (local, AVD, Windows 365, on-premises VDI)</li>\n<li><strong>Servicing:</strong> <a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch</a>, 36-month support, feature-update pinning, expedited updates, Hotpatch</li>\n<li><strong>Security:</strong> Credential Guard, Personal Data Encryption, advanced BitLocker management through <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> with keys escrowed in <a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a></li>\n<li><strong>Other:</strong> quick machine recovery, Always-on VPN, Universal Print, Organizational Messages</li>\n<li><strong>Copilot relevance:</strong> in M365 E3, risky AI apps are blocked on Windows 11 devices via <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> P1 (<a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a>)</li>\n</ul>\n<p>Source: <a href=\"#note/40-resources/summary-windows-11-enterprise-feature-map\">summary-windows-11-enterprise-feature-map</a></p>\n"},"10-notes/entities/windows-autopatch":{"id":"10-notes/entities/windows-autopatch","title":"Windows Autopatch","path":"10-Notes/entities/windows-autopatch.md","type":"entity","tags":["product","endpoint"],"html":"<h1>Windows Autopatch</h1>\n<p>A Microsoft service that automates Windows and Office update rollout. It is listed under <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a>.</p>\n<ul>\n<li>Ring-based patching</li>\n<li>A measurable update-currency target (SLO)</li>\n<li>Break-glass controls: pause and rollback</li>\n</ul>\n<p>Source: <a href=\"#note/40-resources/summary-windows-11-enterprise-feature-map\">summary-windows-11-enterprise-feature-map</a></p>\n"},"40-resources/summary-elevate-security-for-copilot-e1-plus-deck":{"id":"40-resources/summary-elevate-security-for-copilot-e1-plus-deck","title":"Summary — Elevate security for Copilot with Office 365 E1 Plus (deck)","path":"40-Resources/summary-elevate-security-for-copilot-e1-plus-deck.md","type":"summary","tags":["copilot","security","zero-trust","licensing"],"html":"<h1>Summary — Elevate security for Copilot with Office 365 E1 Plus (deck)</h1>\n<p><strong>Source:</strong> Microsoft field presentation &quot;Elevate security for Copilot with Office 365 E1 Plus&quot;, v9.1, 25 slides (raw/2026-10-19-elevate-security-for-copilot-o365-e1-plus.pptx). It is a 45-minute, level-200 deck for ITDMs, IT security leads and CISOs. The deck is marked <em>Microsoft confidential, for presenter info only</em>, so keep this page internal.</p>\n<h2>Key takeaways</h2>\n<ol>\n<li><strong>Pitch:</strong> <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> is a low-cost first step toward <a href=\"#note/10-notes/concepts/zero-trust\">zero-trust</a> that gets a customer ready for <a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a>. It is sold only in selected emerging markets as a promo SKU.</li>\n<li><strong>Five controls frame Copilot security readiness</strong> (slides 12–18): govern access (<a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1, <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>); mitigate device risk (<a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> P1); protect against threats (<a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a>); protect against data loss (<a href=\"#note/10-notes/entities/microsoft-purview\">microsoft-purview</a> DLP for email and files); discover AI apps (Cloud App Discovery, 400+ AI apps). See <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>.</li>\n<li><strong>Good / better / best</strong> (slides 21, 25): E1 Plus = baseline, <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> = &quot;best-in-class&quot; core (the speaker calls ME3 &quot;the jumping-off point&quot;), M365 E5 = automated and XDR-grade. See <a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a>.</li>\n</ol>\n<h2>Narrative arc</h2>\n<table>\n<thead>\n<tr>\n<th>Slides</th>\n<th>Point</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>2–3</td>\n<td>Microsoft 365 Copilot = LLM + Microsoft Graph + M365 apps, inside the compliance boundary</td>\n</tr>\n<tr>\n<td>4–6</td>\n<td>Market data: 79% of leaders see AI as imperative; 60% lack a plan; 80% cite data leakage as the main AI concern</td>\n</tr>\n<tr>\n<td>7</td>\n<td>What E1 Plus contains, compared with O365 E1 and M365 E3</td>\n</tr>\n<tr>\n<td>8–10</td>\n<td>Three value pillars: smart secure productivity (Copilot Chat with <a href=\"#note/10-notes/concepts/enterprise-data-protection\">enterprise-data-protection</a>), AI-era protection (Zero Trust), optimized IT management</td>\n</tr>\n<tr>\n<td>11–18</td>\n<td>The five-step Copilot security journey (see takeaway 2)</td>\n</tr>\n<tr>\n<td>19–20</td>\n<td>Endpoint management: BYOD, consolidation, TCO</td>\n</tr>\n<tr>\n<td>21, 25</td>\n<td>E1 Plus vs M365 E3 vs M365 E5 control matrix</td>\n</tr>\n<tr>\n<td>22–23</td>\n<td>Upsell to M365 E3 + Copilot; next step is a solution assessment</td>\n</tr>\n</tbody></table>\n<h2>E1 Plus contents (slide 7)</h2>\n<p>OneDrive, Exchange, SharePoint, Viva Connections, Viva Engage, Viva Insights, Delve, Power Apps, Power Automate, Bookings, Stream, Sway, Forms, Planner, To Do, <strong>Entra ID P1</strong>, <strong>Office 365 DLP</strong>, <strong>Intune Plan 1</strong>.</p>\n<ul>\n<li>Teams is a separate purchase for net-new customers; some Viva and Power Platform features depend on it.</li>\n<li>Storage per the slide: 1 TB OneDrive and 50 GB mailbox for E1 and E1 Plus; &quot;Unlimited&quot; and 100 GB for M365 E3.</li>\n</ul>\n<blockquote>\n<p>[!warning] Slide 7 says M365 E3 file storage is <strong>&quot;Unlimited&quot;</strong>. The E3 mind map says <strong>OneDrive 5 TB</strong> (<a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>). Treat 5 TB as current and the deck as possibly out of date, and verify before quoting.</p>\n</blockquote>\n<blockquote>\n<p>[!question] The tick marks in the slide 7 comparison table are images and could not be read. Only the text cells were captured.</p>\n</blockquote>\n<h2>Control matrix highlights (slide 25)</h2>\n<table>\n<thead>\n<tr>\n<th>Capability</th>\n<th>O365 E1 Plus</th>\n<th>M365 E3</th>\n<th>M365 E5</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Single identity, MFA, SSPR, Conditional Access, CAE</td>\n<td>✓</td>\n<td>✓</td>\n<td>✓</td>\n</tr>\n<tr>\n<td>Access reviews, PIM / just-in-time admin</td>\n<td>–</td>\n<td>–</td>\n<td>✓</td>\n</tr>\n<tr>\n<td>Deploy, update and restrict M365 apps; app protection; wipe; revoke on non-compliance</td>\n<td>✓</td>\n<td>✓</td>\n<td>✓</td>\n</tr>\n<tr>\n<td>eDiscovery for Copilot data</td>\n<td>–</td>\n<td>Standard</td>\n<td>Premium</td>\n</tr>\n<tr>\n<td>Audit of Copilot interactions</td>\n<td>Standard</td>\n<td>Standard</td>\n<td>Premium</td>\n</tr>\n<tr>\n<td>Retention for Copilot interactions</td>\n<td>–</td>\n<td>Standard</td>\n<td>Automated</td>\n</tr>\n<tr>\n<td>DLP for Copilot-generated content</td>\n<td>Files and email</td>\n<td>Files and email</td>\n<td>+ endpoint, Teams</td>\n</tr>\n<tr>\n<td>Sensitivity label inheritance and citation; label-based Copilot restrictions</td>\n<td>–</td>\n<td>✓</td>\n<td>✓</td>\n</tr>\n<tr>\n<td>Labelling</td>\n<td>–</td>\n<td>Manual</td>\n<td>Automated</td>\n</tr>\n<tr>\n<td>Communication compliance; DKE; trainable classifiers</td>\n<td>–</td>\n<td>–</td>\n<td>✓</td>\n</tr>\n<tr>\n<td>AI app discovery (400+ apps)</td>\n<td>Entra ID P1 Cloud App Discovery</td>\n<td>Entra Cloud App Discovery</td>\n<td>✓</td>\n</tr>\n<tr>\n<td>Block or sanction discovered AI apps</td>\n<td>–</td>\n<td>Manual via MDE P1</td>\n<td>✓</td>\n</tr>\n<tr>\n<td>Antimalware, web and network protection</td>\n<td>–</td>\n<td>MDE P1</td>\n<td>XDR</td>\n</tr>\n</tbody></table>\n<h2>Supporting statistics (as cited by the deck)</h2>\n<ul>\n<li>79% / 60% / 59%: AI is imperative / no plan / can&#39;t quantify gains (2024 Work Trend Index)</li>\n<li>65% of organizations use AI; 58% lack visibility into unsanctioned gen-AI use; 80% cite data leakage as a concern (Worklab; Microsoft Security whitepaper)</li>\n<li>87% use flexible work options (McKinsey, 2022); 86% say outdated PCs raise vulnerability (Hypothesis Group, 2021)</li>\n</ul>\n<p>Related: <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a> · <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a></p>\n"},"40-resources/summary-m365-e3-feature-map":{"id":"40-resources/summary-m365-e3-feature-map","title":"Summary — Microsoft 365 E3 feature map","path":"40-Resources/summary-m365-e3-feature-map.md","type":"summary","tags":["licensing","modern-work","security"],"html":"<h1>Summary — Microsoft 365 E3 feature map</h1>\n<p><strong>Source:</strong> Jaspreet&#39;s own Markmap mind map, &quot;M365 E3 Overview&quot; (raw/2026-10-19-m365-e3-feature-mindmap.html). It is a personal reference, not official Microsoft documentation.</p>\n<h2>Key takeaways</h2>\n<ol>\n<li><strong>E3 is three layers:</strong> <a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a> (productivity and baseline compliance), <a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a> (identity and endpoint), plus ME3-only extras (Windows 11 Enterprise, <a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> P1, Universal Print, Loop). See <a href=\"#note/10-notes/concepts/m365-licensing-stack\">m365-licensing-stack</a>.</li>\n<li><strong>Security is spread across all three layers:</strong> email hygiene and compliance in O365 E3, identity controls in <a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1, device controls in <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>, and endpoint protection in MDE P1.</li>\n<li><strong>Two items need checking against current licensing:</strong> MDO Plan 1 listed under O365 E3, and Intune Plan 2 / Remote Help / Advanced Endpoint Analytics under EMS E3. See &quot;Open questions&quot;.</li>\n</ol>\n<h2>Office 365 E3</h2>\n<table>\n<thead>\n<tr>\n<th>Area</th>\n<th>What the map lists</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Apps</td>\n<td>Office apps (desktop client)</td>\n</tr>\n<tr>\n<td>Exchange Online</td>\n<td>100 GB mailbox, 1.5 TB archive</td>\n</tr>\n<tr>\n<td>OneDrive</td>\n<td>5 TB storage</td>\n</tr>\n<tr>\n<td>SharePoint Online</td>\n<td>1 TB tenant + 10 GB per user, pooled</td>\n</tr>\n<tr>\n<td>Teams</td>\n<td>Meetings, chats, webinars, town halls</td>\n</tr>\n<tr>\n<td>Viva (seeded)</td>\n<td>Engage, Connections, Learning, Personal Insights</td>\n</tr>\n<tr>\n<td>Other apps</td>\n<td>Stream, Planner, To Do, Forms, Lists, Clipchamp, Power Apps and Power Automate (standard connectors)</td>\n</tr>\n<tr>\n<td>Security and compliance</td>\n<td>DLP (Exchange, SharePoint, OneDrive), anti-malware, anti-spam, eDiscovery and Content Search, retention policies, Litigation Hold, MDO Plan 1 → <a href=\"#note/40-resources/summary-mdo-plan1-feature-map\">summary-mdo-plan1-feature-map</a></td>\n</tr>\n</tbody></table>\n<h2>EMS E3</h2>\n<table>\n<thead>\n<tr>\n<th>Area</th>\n<th>What the map lists</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1</td>\n<td><a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>, MFA, SSO, hybrid SSPR, group-based access, App Proxy, password protection (incl. AD DS), Cloud App Discovery</td>\n</tr>\n<tr>\n<td><a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a></td>\n<td>MDM, MAM, config profiles, app protection, patching, compliance policies, remote actions, Tunnel for MAM, specialty devices (AR/VR), FOTA, Remote Help, Advanced Endpoint Analytics. See <a href=\"#note/10-notes/concepts/mdm-vs-mam\">mdm-vs-mam</a>.</td>\n</tr>\n<tr>\n<td>Information protection</td>\n<td>MIP Plan 1 (manual labeling)</td>\n</tr>\n<tr>\n<td>Rights</td>\n<td>Windows Server CAL rights</td>\n</tr>\n</tbody></table>\n<h2>ME3 additional features</h2>\n<ul>\n<li><a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a>: now ingested, see <a href=\"#note/40-resources/summary-windows-11-enterprise-feature-map\">summary-windows-11-enterprise-feature-map</a>.</li>\n<li><a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> P1: attack surface reduction, web protection and filtering, device control (USB), centralised AV management.</li>\n<li>Universal Print (100 jobs per month).</li>\n<li>Microsoft Loop (full workspaces).</li>\n</ul>\n<h2>Open questions</h2>\n<blockquote>\n<p>[!warning] <strong>Storage conflict:</strong> this map says OneDrive is 5 TB. The Copilot deck says M365 E3 storage is &quot;Unlimited&quot; (<a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck#claim-002</a>). 5 TB is treated as current.\n[!question] The map lists <strong>Defender for Office 365 Plan 1 under Office 365 E3</strong>. Verify against the current Microsoft service description before quoting it to a customer.</p>\n</blockquote>\n<blockquote>\n<p>[!question] The map lists <strong>Intune Plan 1 &amp; 2, Remote Help and Advanced Endpoint Analytics under EMS E3</strong>. These were historically Intune Suite add-ons. Confirm current inclusion and effective dates.</p>\n</blockquote>\n<p>Related: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a> · <a href=\"#note/10-notes/concepts/email-and-collaboration-protection-layers\">email-and-collaboration-protection-layers</a> · <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a> · lower tier: <a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a></p>\n"},"40-resources/summary-mdo-plan1-feature-map":{"id":"40-resources/summary-mdo-plan1-feature-map","title":"Summary — Defender for Office 365 Plan 1 feature map","path":"40-Resources/summary-mdo-plan1-feature-map.md","type":"summary","tags":["security","licensing","email-security"],"html":"<h1>Summary — Defender for Office 365 Plan 1 feature map</h1>\n<p><strong>Source:</strong> Jaspreet&#39;s own Markmap mind map, &quot;Microsoft Defender for Office Plan1&quot; (raw/2026-10-19-mdo-plan1-feature-mindmap.html). It is linked from <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>.</p>\n<h2>Key takeaways</h2>\n<ol>\n<li><strong>MDO P1 extends protection beyond email</strong> to Teams, SharePoint and OneDrive: Safe Attachments, Safe Links and ZAP all cover Teams.</li>\n<li><strong>P1 is protection plus basic investigation:</strong> real-time detections and reports, without the advanced hunting or automation of a higher plan. This is my inference; the source does not list P2.</li>\n<li><strong>Admin tooling targets a secure baseline:</strong> Standard/Strict preset policies, Configuration Analyzer and the Tenant Allow/Block List.</li>\n</ol>\n<h2>Capabilities</h2>\n<table>\n<thead>\n<tr>\n<th>Area</th>\n<th>Capabilities</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Threat protection</td>\n<td>Safe Attachments (incl. Teams); Safe Links (incl. Teams); anti-phishing (user and domain impersonation); Safe Attachments for SharePoint, OneDrive and Teams</td>\n</tr>\n<tr>\n<td>Mail hygiene</td>\n<td>Zero-hour Auto Purge (ZAP, incl. Teams); advanced protection for internal mail</td>\n</tr>\n<tr>\n<td>Threat investigation</td>\n<td>Real-time detections; real-time reports</td>\n</tr>\n<tr>\n<td>Policy and admin</td>\n<td>Preset security policies (Standard / Strict); policy tuning; Configuration Analyzer; Tenant Allow/Block List</td>\n</tr>\n</tbody></table>\n<p>Entity: <a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a> · Concept: <a href=\"#note/10-notes/concepts/email-and-collaboration-protection-layers\">email-and-collaboration-protection-layers</a> · MOC: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a></p>\n"},"40-resources/summary-o365-e1-plus-feature-map":{"id":"40-resources/summary-o365-e1-plus-feature-map","title":"Summary — Office 365 E1 Plus feature map","path":"40-Resources/summary-o365-e1-plus-feature-map.md","type":"summary","tags":["licensing","modern-work","security"],"html":"<h1>Summary — Office 365 E1 Plus feature map</h1>\n<p><strong>Source:</strong> Jaspreet&#39;s own Markmap mind map, &quot;Office 365 E1 Plus&quot; (raw/2026-10-19-o365-e1-plus-feature-mindmap.html). It is a personal reference, not official Microsoft documentation.</p>\n<h2>Key takeaways</h2>\n<ol>\n<li><strong>E1 Plus = web-only Office 365 E1 + Entra ID P1 + Intune P1 + Office 365 DLP.</strong> It is a lightweight Zero Trust starter. See <a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a>.</li>\n<li><strong>It carries the same identity stack as E3:</strong> the Entra ID P1 feature list is the same as in <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a>.</li>\n<li><strong>The gaps against <a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a>:</strong> web apps only, 50 GB mailbox and 50 GB archive, 1 TB OneDrive, manual retention labels only, no eDiscovery, no Defender for Office 365.</li>\n</ol>\n<h2>Productivity and collaboration</h2>\n<table>\n<thead>\n<tr>\n<th>Area</th>\n<th>What the map lists</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Apps</td>\n<td>Office for the web (Word, Excel, PowerPoint, Outlook)</td>\n</tr>\n<tr>\n<td>Exchange Online</td>\n<td>50 GB mailbox + 50 GB archive</td>\n</tr>\n<tr>\n<td>OneDrive</td>\n<td>1 TB</td>\n</tr>\n<tr>\n<td>SharePoint</td>\n<td>1 TB + 10 GB per user</td>\n</tr>\n<tr>\n<td>Other</td>\n<td>Teams, Viva (Engage, Connections, Learning, Insights), Stream, Planner, To Do, Forms, Lists, Power Apps and Power Automate (no premium connectors)</td>\n</tr>\n</tbody></table>\n<h2>Security and compliance</h2>\n<ul>\n<li>DLP for Exchange, SharePoint and OneDrive</li>\n<li>Anti-malware and anti-spam (<a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a>)</li>\n<li>Manual retention labels (Exchange, SharePoint, Teams)</li>\n</ul>\n<h2>Identity and device management</h2>\n<ul>\n<li><strong><a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>:</strong> MDM, MAM, configuration profiles, app protection, patching, compliance policies, remote actions, Endpoint Analytics. The map does not name the plan; the deck says Plan 1.</li>\n<li><strong><a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> P1:</strong> <a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a>, MFA, SSO, hybrid SSPR, group-based access, App Proxy, password protection (incl. AD DS), Cloud App Discovery.</li>\n</ul>\n<blockquote>\n<p>[!warning] The map lists <strong>Microsoft Teams</strong> as included. The deck says Teams is a separate purchase for net-new customers (<a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a>). Treat Teams as dependent on the customer&#39;s agreement.</p>\n</blockquote>\n<p>Related: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a> · <a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a></p>\n"},"40-resources/summary-windows-11-enterprise-feature-map":{"id":"40-resources/summary-windows-11-enterprise-feature-map","title":"Summary — Windows 11 Enterprise feature map","path":"40-Resources/summary-windows-11-enterprise-feature-map.md","type":"summary","tags":["licensing","endpoint","security"],"html":"<h1>Summary — Windows 11 Enterprise feature map</h1>\n<p><strong>Source:</strong> Jaspreet&#39;s own Markmap mind map, &quot;Windows 11 Enterprise&quot; (raw/2026-10-19-windows-11-enterprise-feature-mindmap.html). It is linked from <a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a> as an ME3-only feature, which closes the gap logged at the last ingest.</p>\n<h2>Key takeaways</h2>\n<ol>\n<li><strong>Rights:</strong> run up to <strong>5 Windows environments</strong> per user (local, AVD, Windows 365, on-premises VDI under VDA).</li>\n<li><strong>Servicing is the big differentiator:</strong> <a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch</a>, 36 months of support per yearly feature update, feature-update pinning for up to 3 years, expedited zero-day updates, Hotpatch.</li>\n<li><strong>Security hardening beyond Pro:</strong> Credential Guard, Personal Data Encryption, and advanced BitLocker management with keys escrowed in Entra ID and rotated through Intune.</li>\n</ol>\n<h2>Capabilities</h2>\n<table>\n<thead>\n<tr>\n<th>Area</th>\n<th>What the map lists</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Rights</td>\n<td>Up to 5 Windows environments: local, AVD, Windows 365, on-premises VDI (VDA)</td>\n</tr>\n<tr>\n<td>Update management</td>\n<td><a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch</a> (ring-based patching, update-currency SLO, pause and rollback); 36-month support; feature update pinning (up to 3 years); expedited updates; Windows Hotpatch</td>\n</tr>\n<tr>\n<td>Resilience</td>\n<td>Quick machine recovery; point-in-time restore</td>\n</tr>\n<tr>\n<td>Connectivity</td>\n<td>Always-on VPN (user and device tunnel)</td>\n</tr>\n<tr>\n<td>Printing</td>\n<td>Universal Print</td>\n</tr>\n<tr>\n<td>Security</td>\n<td>Credential Guard; Personal Data Encryption; BitLocker and BitLocker To Go advanced management: enforce cipher, block writes to unencrypted removable media, silent deployment, TPM + PIN pre-boot, PIN complexity, block encryption until keys are escrowed in <a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a>, key rotation via <a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a>, reporting</td>\n</tr>\n<tr>\n<td>Experience</td>\n<td>Organizational Messages (M365 admin center)</td>\n</tr>\n</tbody></table>\n<p>Entity: <a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a> · Suite: <a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> · MOC: <a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a></p>\n"},"agents":{"id":"agents","title":"AGENTS — Vault Operating Manual","path":"AGENTS.md","type":"schema","tags":["meta","schema"],"html":"<h1>AGENTS.md</h1>\n<p>Operating manual for any AI agent (and for me) working in this Second Brain. Pattern: Karpathy-style LLM wiki — raw sources in, a compiled wiki out, governed by a schema.</p>\n<h2>1. Three layers and ownership</h2>\n<table>\n<thead>\n<tr>\n<th>Layer</th>\n<th>Folders</th>\n<th>Owner</th>\n<th>Rule</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Raw</strong></td>\n<td><code>raw/</code>, <code>00-Inbox/</code></td>\n<td>Human</td>\n<td>Immutable. Agent may add a copy or reference; never edits or deletes.</td>\n</tr>\n<tr>\n<td><strong>Wiki</strong></td>\n<td><code>10-Notes/</code>, <code>20-Projects/</code>, <code>30-Areas/</code>, <code>40-Resources/</code>, <code>index.md</code>, <code>log.md</code>, <code>_meta/MOCs/</code></td>\n<td>Agent (human reviews)</td>\n<td>Compiled knowledge. Agent creates and updates; every claim traces to a raw source.</td>\n</tr>\n<tr>\n<td><strong>Schema</strong></td>\n<td><code>AGENTS.md</code>, <code>_meta/conventions.md</code>, <code>_meta/templates/</code></td>\n<td>Human</td>\n<td>Rules of the vault. Agent proposes changes; human approves.</td>\n</tr>\n</tbody></table>\n<h2>2. Folder conventions and naming</h2>\n<table>\n<thead>\n<tr>\n<th>Folder</th>\n<th>Holds</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>raw/</code></td>\n<td>Original sources (PDFs, transcripts, clippings, links). Never modified.</td>\n</tr>\n<tr>\n<td><code>00-Inbox/</code></td>\n<td>Quick captures awaiting processing. Cleared weekly.</td>\n</tr>\n<tr>\n<td><code>10-Notes/entities/</code></td>\n<td>People, orgs, products, tools — one per page.</td>\n</tr>\n<tr>\n<td><code>10-Notes/concepts/</code></td>\n<td>Ideas, frameworks, patterns — one per page.</td>\n</tr>\n<tr>\n<td><code>20-Projects/</code></td>\n<td>Time-bound work with a goal and end date.</td>\n</tr>\n<tr>\n<td><code>30-Areas/</code></td>\n<td>Ongoing responsibilities (no end date).</td>\n</tr>\n<tr>\n<td><code>40-Resources/</code></td>\n<td>Source summaries and analysis pages.</td>\n</tr>\n<tr>\n<td><code>50-Archive/</code></td>\n<td>Finished or inactive items. Move, never delete.</td>\n</tr>\n<tr>\n<td><code>_meta/</code></td>\n<td>Schema, MOCs, templates.</td>\n</tr>\n</tbody></table>\n<p>Naming: atomic notes in <code>kebab-case.md</code> (e.g. <code>microsoft-copilot.md</code>); Inbox captures and raw files as <code>YYYY-MM-DD-slug.ext</code>; summaries as <code>summary-&lt;slug&gt;.md</code>; analyses as <code>analysis-&lt;slug&gt;.md</code>; MOCs as <code>moc-&lt;topic&gt;.md</code> (except <code>home.md</code>). Full rules: <code>[conventions](#note/_meta/conventions)</code>.</p>\n<h2>3. Page types and frontmatter</h2>\n<p>Types: <code>entity</code>, <code>concept</code>, <code>summary</code>, <code>analysis</code>, <code>project</code>, <code>area</code>, <code>moc</code>, <code>capture</code>, <code>schema</code>.</p>\n<p>Every wiki page starts with:</p>\n<pre><code class=\"language-yaml\">---\ntitle: Human-readable title\ntype: entity | concept | summary | analysis | project | area | moc | capture | schema\ncreated: YYYY-MM-DD\nupdated: YYYY-MM-DD\ntags: [topic, subtopic]\nsources: [&quot;raw/2026-10-18-source-slug&quot;]\nstatus: draft | active | evergreen | stale | archived\n---\n</code></pre>\n<p>A page missing any of the seven fields fails lint.</p>\n<h3>Optional: claims block</h3>\n<p>Use <code>claims:</code> in frontmatter for assertions worth tracking individually (facts, numbers, predictions, decisions). Most useful on entity, concept, summary and analysis pages.</p>\n<pre><code class=\"language-yaml\">claims:\n  - id: claim-001\n    text: &quot;&lt;one atomic assertion&gt;&quot;\n    confidence: 0.8\n    status: provisional | evergreen | disputed\n    evidence:\n      - source: raw/2026-10-19-source-slug.md\n        kind: documentation | quote | observation\n        excerpt: &quot;&lt;short quote, under 30 words&gt;&quot;\n    captured: YYYY-MM-DD\n    updated: YYYY-MM-DD\n</code></pre>\n<p>Rules:</p>\n<ul>\n<li><code>id</code> is unique within the page (<code>claim-001</code>, <code>claim-002</code>, …); cite elsewhere as <code>page#claim-001</code>.</li>\n<li>One assertion per claim. <code>confidence</code> is 0.0–1.0: below 0.5 is a hunch, 0.5–0.8 is likely, above 0.8 is well supported.</li>\n<li><code>status</code>: <code>provisional</code> = new or single-source; <code>evergreen</code> = confirmed by 2+ sources or durable by nature; <code>disputed</code> = credible evidence on both sides.</li>\n<li>Every <code>evidence.source</code> points to a file in <code>raw/</code>. <code>documentation</code> = official docs or specs; <code>quote</code> = a person&#39;s words; <code>observation</code> = something I saw first-hand.</li>\n<li>When new evidence conflicts, add it to the claim, set <code>status: disputed</code>, adjust <code>confidence</code>, bump <code>updated</code>, and log it. Never delete evidence.</li>\n</ul>\n<h2>4. Operations</h2>\n<h3>ingest (raw → wiki)</h3>\n<ol>\n<li>Read the source in full.</li>\n<li>Save a copy or reference to <code>raw/</code> as <code>YYYY-MM-DD-slug</code>.</li>\n<li>Give the human 1–3 key takeaways; discuss before writing.</li>\n<li>Write <code>40-Resources/summary-&lt;slug&gt;.md</code> with citations.</li>\n<li>Create or update entity pages for people, orgs, products.</li>\n<li>Create or update concept pages for ideas worth tracking.</li>\n<li>Update relevant MOCs in <code>_meta/MOCs/</code>.</li>\n<li>Update <code>index.md</code>; append to <code>log.md</code>.</li>\n<li>Report every page touched.</li>\n</ol>\n<h3>query (wiki → answer)</h3>\n<ol>\n<li>Read <code>index.md</code> first.</li>\n<li>Drill into relevant pages; follow <code>links</code>.</li>\n<li>Synthesize an answer citing wiki pages; no fresh web search unless asked.</li>\n<li>If the answer is non-trivial, offer to file it as <code>40-Resources/analysis-&lt;slug&gt;.md</code>, then update index and log.</li>\n</ol>\n<h3>lint (health check)</h3>\n<p>Report, then wait for approval before fixing.</p>\n<p>Pages:</p>\n<ul>\n<li><strong>Contradictions</strong> — pages that disagree, in prose or in claims.</li>\n<li><strong>Orphans</strong> — pages nothing links to.</li>\n<li><strong>Stale pages</strong> — <code>status: evergreen</code> with page <code>updated</code> older than 90 days.</li>\n<li><strong>Missing</strong> — concepts mentioned often with no page; missing cross-references; missing frontmatter fields.</li>\n<li><strong>Inbox backlog</strong> — captures older than 7 days.</li>\n</ul>\n<p>Claims:</p>\n<ul>\n<li><strong>Disputed</strong> — every claim with <code>status: disputed</code>, with its evidence on each side.</li>\n<li><strong>No evidence</strong> — claims with an empty <code>evidence</code> list, or a <code>source</code> that isn&#39;t in <code>raw/</code>.</li>\n<li><strong>Cross-page contradictions</strong> — two claims on different pages that assert incompatible things about the same subject.</li>\n<li><strong>Stale evergreen</strong> — <code>status: evergreen</code> claims with <code>updated</code> older than 90 days.</li>\n<li><strong>Confidence mismatch</strong> — <code>evergreen</code> claims below 0.8 confidence, or a single source with confidence above 0.8.</li>\n</ul>\n<p>Report format: one table per check — page, claim id (if any), issue, suggested fix.</p>\n<h2>5. Log format</h2>\n<p><code>log.md</code> is append-only, newest at the bottom, one line per event, greppable:</p>\n<pre><code>## [YYYY-MM-DD] &lt;op&gt; | &lt;subject&gt;\n- touched: page-a, page-b\n- note: one line on what changed or why\n</code></pre>\n<p><code>&lt;op&gt;</code> is one of <code>ingest</code>, <code>query</code>, <code>lint</code>, <code>fix</code>, <code>schema</code>, <code>archive</code>, <code>claim</code>.\nFind all ingests: <code>grep &quot;] ingest&quot; log.md</code>.</p>\n<h2>6. House rules</h2>\n<ol>\n<li><strong>One idea per page.</strong> Split when a page covers two things.</li>\n<li><strong>Cite sources.</strong> Every factual claim links to a <code>raw/</code> file or a summary page; tracked claims carry <code>evidence</code>.</li>\n<li><strong>Flag uncertainty.</strong> Mark unverified claims <code>&gt; [!question]</code> and contradictions <code>&gt; [!warning]</code>.</li>\n<li><strong>Link, don&#39;t duplicate.</strong> Reference an existing page instead of restating it.</li>\n<li><strong>Never touch raw.</strong> Raw is append-only.</li>\n<li><strong>Show before saving</strong> schema changes; wiki edits are reported after.</li>\n<li><strong>Update <code>updated:</code></strong> on every edit.</li>\n</ol>\n"},"index":{"id":"index","title":"Index","path":"index.md","type":"moc","tags":["meta","index"],"html":"<h1>Index</h1>\n<p>Catalog of every wiki page. Agents read this first on every query. One line per page: <code>link — one-line description</code>.</p>\n<h2>Entities</h2>\n<ul>\n<li><a href=\"#note/10-notes/entities/microsoft-365-e3\">microsoft-365-e3</a> — enterprise suite: O365 E3 + EMS E3 + ME3 extras</li>\n<li><a href=\"#note/10-notes/entities/office-365-e3\">office-365-e3</a> — productivity and baseline compliance layer of M365 E3</li>\n<li><a href=\"#note/10-notes/entities/ems-e3\">ems-e3</a> — identity and endpoint layer: Entra ID P1, Intune, MIP P1</li>\n<li><a href=\"#note/10-notes/entities/microsoft-entra-id\">microsoft-entra-id</a> — cloud identity; P1 brings Conditional Access, MFA, SSO</li>\n<li><a href=\"#note/10-notes/entities/microsoft-intune\">microsoft-intune</a> — endpoint and app management (MDM, MAM, patching, compliance)</li>\n<li><a href=\"#note/10-notes/entities/microsoft-defender-for-office-365\">microsoft-defender-for-office-365</a> — email and collaboration threat protection (Plan 1)</li>\n<li><a href=\"#note/10-notes/entities/microsoft-defender-for-endpoint\">microsoft-defender-for-endpoint</a> — endpoint security; P1 is in M365 E3</li>\n<li><a href=\"#note/10-notes/entities/office-365-e1-plus\">office-365-e1-plus</a> — E1 + Entra ID P1 + Intune P1 + DLP; emerging-markets promo</li>\n<li><a href=\"#note/10-notes/entities/windows-11-enterprise\">windows-11-enterprise</a> — enterprise Windows: 5-environment rights, Autopatch, BitLocker management</li>\n<li><a href=\"#note/10-notes/entities/windows-autopatch\">windows-autopatch</a> — automated ring-based Windows update service</li>\n<li><a href=\"#note/10-notes/entities/microsoft-365-copilot\">microsoft-365-copilot</a> — Graph-grounded AI assistant; add-on to O365/M365</li>\n<li><a href=\"#note/10-notes/entities/exchange-online-protection\">exchange-online-protection</a> — baseline email filtering (spam, malware, phishing)</li>\n<li><a href=\"#note/10-notes/entities/microsoft-purview\">microsoft-purview</a> — data security and compliance: DLP, labels, retention, eDiscovery</li>\n<li><a href=\"#note/10-notes/entities/microsoft-365-e5\">microsoft-365-e5</a> — top tier: Entra ID Protection, auto-labels, Defender for Cloud Apps, XDR</li>\n</ul>\n<h2>Concepts</h2>\n<ul>\n<li><a href=\"#note/10-notes/concepts/m365-licensing-stack\">m365-licensing-stack</a> — M365 suites are built from smaller suites; explain them layer by layer</li>\n<li><a href=\"#note/10-notes/concepts/email-and-collaboration-protection-layers\">email-and-collaboration-protection-layers</a> — baseline EOP → MDO P1 → investigation</li>\n<li><a href=\"#note/10-notes/concepts/conditional-access\">conditional-access</a> — policy-driven if-then access decisions</li>\n<li><a href=\"#note/10-notes/concepts/mdm-vs-mam\">mdm-vs-mam</a> — manage the whole device vs only the apps</li>\n<li><a href=\"#note/10-notes/concepts/zero-trust\">zero-trust</a> — verify explicitly, least privilege, assume breach</li>\n<li><a href=\"#note/10-notes/concepts/copilot-security-readiness\">copilot-security-readiness</a> — five controls + good/better/best licensing for Copilot</li>\n<li><a href=\"#note/10-notes/concepts/enterprise-data-protection\">enterprise-data-protection</a> — work-account Copilot Chat data isn&#39;t used for training</li>\n</ul>\n<h2>Summaries</h2>\n<ul>\n<li><a href=\"#note/40-resources/summary-m365-e3-feature-map\">summary-m365-e3-feature-map</a> — M365 E3 feature map (O365 E3, EMS E3, ME3 extras); 2 open questions</li>\n<li><a href=\"#note/40-resources/summary-mdo-plan1-feature-map\">summary-mdo-plan1-feature-map</a> — Defender for Office 365 Plan 1 capabilities</li>\n<li><a href=\"#note/40-resources/summary-o365-e1-plus-feature-map\">summary-o365-e1-plus-feature-map</a> — Office 365 E1 Plus feature map</li>\n<li><a href=\"#note/40-resources/summary-windows-11-enterprise-feature-map\">summary-windows-11-enterprise-feature-map</a> — Windows 11 Enterprise feature map</li>\n<li><a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a> — Copilot security deck: five controls, E1 Plus/E3/E5 matrix; 3 claims (1 disputed)</li>\n</ul>\n<h2>MOCs</h2>\n<ul>\n<li><a href=\"#note/_meta/mocs/home\">home</a> — landing page and entry points</li>\n<li><a href=\"#note/_meta/mocs/moc-microsoft-365-licensing\">moc-microsoft-365-licensing</a> — Microsoft 365 licensing, products and concepts</li>\n<li><a href=\"#note/_meta/mocs/moc-copilot-security-readiness\">moc-copilot-security-readiness</a> — Copilot security controls and tiers</li>\n</ul>\n"},"log":{"id":"log","title":"Log","path":"log.md","type":"moc","tags":["meta","log"],"html":"<h1>Log</h1>\n<p>Append-only. Newest at the bottom. Format in <a href=\"#note/agents\">AGENTS</a> §5.</p>\n<h2>[2026-10-18] schema | vault scaffold</h2>\n<ul>\n<li>touched: raw/, 00-Inbox/, 10-Notes/entities/, 10-Notes/concepts/, 20-Projects/, 30-Areas/, 40-Resources/, 50-Archive/, _meta/MOCs/, _meta/templates/</li>\n<li>note: folder structure and empty placeholders created</li>\n</ul>\n<h2>[2026-10-19] schema | AGENTS.md, conventions, index, home</h2>\n<ul>\n<li>touched: <a href=\"#note/agents\">AGENTS</a>, <a href=\"#note/_meta/conventions\">conventions</a>, <a href=\"#note/index\">index</a>, <a href=\"#note/_meta/mocs/home\">home</a></li>\n<li>note: vault manual (incl. optional claims block and claim lint checks), conventions, empty index and landing MOC approved and saved</li>\n</ul>\n<h2>[2026-10-19] schema | Synapse persona</h2>\n<ul>\n<li>touched: .copilot/synapse/SOUL.md, .copilot/synapse/AGENTS.md, <a href=\"#note/_meta/synapse/memory\">MEMORY</a>, <a href=\"#note/_meta/synapse/dreams\">DREAMS</a></li>\n<li>note: Synapse agent persona and rules saved; MEMORY and DREAMS seeded empty; /synapse command created</li>\n</ul>\n<h2>[2026-10-19] schema | vault renamed c-microsoft-365-licensing</a>, <a href=\"#note/index\">index</a></li>\n<li>note: first pass truncated speaker notes and missed the image-based slide 7 ticks; re-read the full notes, nested shapes and a rendered slide 7; added the comparison table, staged rollout, CAE triggers, E5 tier, discovery questions; flagged the outdated &quot;free during preview&quot; note</li>\n</ul>\n"},"raw/2026-10-19-elevate-security-for-copilot-o365-e1-plusref":{"id":"raw/2026-10-19-elevate-security-for-copilot-o365-e1-plusref","title":"Reference — Elevate security for Copilot with Office 365 E1 Plus (deck)","path":"raw/2026-10-19-elevate-security-for-copilot-o365-e1-plus.ref.md","type":"capture","tags":["raw","reference"],"html":"<h1>Reference — Elevate security for Copilot with Office 365 E1 Plus</h1>\n<ul>\n<li>Original file: &quot;Elevate security for Copilot with O365 E1 Plus.PPTX&quot; (25 slides, v9.1), attached by Jaspreet on 2026-10-19.</li>\n<li>Classification: Microsoft confidential, for presenter info only.</li>\n<li>Intended copy: raw/2026-10-19-elevate-security-for-copilot-o365-e1-plus.pptx. The automatic copy was blocked by sensitivity-label policy, so Jaspreet should upload the deck here manually under that name.</li>\n<li>Summary: <a href=\"#note/40-resources/summary-elevate-security-for-copilot-e1-plus-deck\">summary-elevate-security-for-copilot-e1-plus-deck</a></li>\n</ul>\n"},"readme":{"id":"readme","title":"README","path":"README.md","type":"schema","tags":["meta"],"html":"<h1>Jaspreet&#39;s Second Brain</h1>\n<p>A Karpathy-style LLM wiki: raw sources in, compiled wiki out, governed by a schema.</p>\n<ul>\n<li>Start at <a href=\"#note/_meta/mocs/home\">home</a>.</li>\n<li>Rules for agents: <a href=\"#note/agents\">AGENTS</a>. Naming and formatting: <a href=\"#note/_meta/conventions\">conventions</a>.</li>\n<li>Catalog: <a href=\"#note/index\">index</a>. Change history: <a href=\"#note/log\">log</a>.</li>\n<li>Agent persona: Synapse (<code>.copilot/synapse/</code>), memory in <code>_meta/synapse/</code>.</li>\n</ul>\n<h2>Public graph site</h2>\n<p>This vault can be published as an interactive browser graph:</p>\n<p><a href=\"https://jaspreetjolly.github.io/Synapse/\">https://jaspreetjolly.github.io/Synapse/</a></p>\n<p>Local preview:</p>\n<pre><code class=\"language-powershell\">npm install\nnpm run build\nnpm run serve\n</code></pre>\n<p>Then open <code>http://127.0.0.1:8080/</code>.</p>\n"},"_meta/conventions":{"id":"_meta/conventions","title":"Vault Conventions","path":"_meta/conventions.md","type":"schema","tags":["meta","schema"],"html":"<h1>Conventions</h1>\n<h2>File naming</h2>\n<ul>\n<li>Atomic notes (entities, concepts): <code>kebab-case.md</code> — <code>azure-openai.md</code>, <code>second-brain.md</code>.</li>\n<li>Inbox captures and raw files: <code>YYYY-MM-DD-slug.md</code> — <code>2026-10-18-copilot-roadmap.md</code>.</li>\n<li>Summaries: <code>summary-&lt;slug&gt;.md</code>. Analyses: <code>analysis-&lt;slug&gt;.md</code>.</li>\n<li>Lowercase, hyphens only, no spaces or special characters, no dates in atomic note names.</li>\n</ul>\n<h2>Frontmatter</h2>\n<p>Required on every page: <code>title, type, created, updated, tags, sources, status</code>.</p>\n<pre><code class=\"language-yaml\">---\ntitle: Azure OpenAI\ntype: entity\ncreated: 2026-10-18\nupdated: 2026-10-18\ntags: [ai, microsoft, product]\nsources: [&quot;summary-azure-openai-overview&quot;]\nstatus: active\n---\n</code></pre>\n<pre><code class=\"language-yaml\">---\ntitle: 2026-10-18 Copilot roadmap note\ntype: capture\ncreated: 2026-10-18\nupdated: 2026-10-18\ntags: [inbox]\nsources: []\nstatus: draft\n---\n</code></pre>\n<p>Status values: <code>draft</code> → <code>active</code> → <code>evergreen</code>; <code>stale</code>, <code>archived</code> as needed.</p>\n<h2>Links</h2>\n<ul>\n<li>Use <code>wiki-links</code> by filename, no extension: <code>azure-openai</code>.</li>\n<li>Alias with a pipe: <code>AOAI</code>.</li>\n<li>Link to a heading: <code>second-brain#Layers</code>.</li>\n<li>Every new page links to at least one existing page and one MOC.</li>\n</ul>\n<h2>Tags</h2>\n<ul>\n<li>Lowercase, kebab-case, plural-free: <code>#ai</code>, <code>#customer</code>, <code>#modern-work</code>.</li>\n<li>Max 5 tags per page.</li>\n<li>Hierarchy with <code>/</code>: <code>#customer/acme</code>, <code>#area/sci</code>.</li>\n<li>Tags group; links relate. Don&#39;t use a tag where a link fits.</li>\n</ul>\n<h2>MOCs</h2>\n<ul>\n<li>Live in <code>_meta/MOCs/</code>.</li>\n<li>Name: <code>moc-&lt;topic&gt;.md</code>; landing page is <code>home.md</code>.</li>\n<li>Create a MOC when a topic has 5+ notes.</li>\n<li><code>home.md</code> links to every MOC.</li>\n</ul>\n<h2>Weekly Inbox processing (every Friday)</h2>\n<ul>\n<li><input disabled=\"\" type=\"checkbox\"> Open <code>00-Inbox/</code>; handle oldest first.</li>\n<li><input disabled=\"\" type=\"checkbox\"> For each capture: delete, promote to a note, or ingest as a source.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Move source material to <code>raw/</code>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Add frontmatter and links to anything promoted.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Update relevant MOCs and <code>index.md</code>.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Append one <code>log.md</code> entry for the session.</li>\n<li><input disabled=\"\" type=\"checkbox\"> Inbox is empty, or every leftover item has a reason.</li>\n</ul>\n"},"_meta/mocs/home":{"id":"_meta/mocs/home","title":"Home","path":"_meta/MOCs/home.md","type":"moc","tags":["meta","moc"],"html":"<h1>Home</h1>\n<p>Start here.</p>\n<h2>How this vault works</h2>\n<ul>\n<li><a href=\"#note/agents\">AGENTS</a> — operating manual: layers, operations, house rules</li>\n<li><a href=\"#note/_meta/conventions\">conventions</a> — naming, frontmatter, links, tags</li>\n<li><a href=\"#note/index\">index</a> — full catalog of pages</li>\n<li><a href=\"#note/log\">log</a> — what     const paper = document.getElementById("paper");

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function currentId() {
      return decodeURIComponent(location.hash.replace(/^#note\//, "")) || "index";
    }

    function render() {
      const id = currentId();
      const note = pages[id];
      if (!note) {
        document.title = "Note not found";
        paper.innerHTML = "<div class='missing'><h1>Note not found</h1><p>Return to the graph and select another node.</p></div>";
        return;
      }
      document.title = note.title + " - Synapse";
      const tags = note.tags.map(tag => "<span class='tag-chip'>#" + escapeHtml(tag) + "</span>").join("");
      const bodyHtml = note.html.replace(/^\s*<h1[^>]*>[\s\S]*?<\/h1>/i, "");
      paper.innerHTML = "<h1>" + escapeHtml(note.title) + "</h1><div class='meta'>" + escapeHtml(note.path) + "</div>" + tags + bodyHtml;
      paper.querySelectorAll("a[href^='#note/']").forEach(link => {
        link.addEventListener("click", event => {
          event.preventDefault();
          location.hash = link.getAttribute("href");
          render();
          scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    window.addEventListener("hashchange", render);
    render();
  </script>
